objective: 'Будущая задача. Сейчас только регистрация; реализация, выполнение на устройстве, сроки и целевой релиз не согласованы.

Основание: задания/1-1-0-to-1-2-0-upgrade-report.md.

Наблюдение из отчёта: В отчёте обновление ядра, синхронизация трёх реестров и проверка загруженных компонентов выполнялись отдельными действиями; MCP текущего хоста оставался запущенным до обновления.

Область будущего результата: Спроектировать и реализовать единый управляемый сценарий обновления с достоверным итогом по установленному ядру, реестрам, Runtime и подключённому MCP.

Критерии приёмки будущего результата:

1. Сценарий связывает предварительную диагностику, резервирование, план, применение, согласование реестров и итоговую проверку, сохраняя доказательства каждого шага.

2. Проверяется согласованность distributions.yaml, installed-subjects.yaml и update-sources.yaml с фактической установкой; посторонние и пользовательские записи сохраняются.

3. Отдельно показываются установленная версия, фактически загруженная версия Runtime и версия реально подключённого MCP с происхождением процесса; одной записи манифеста недостаточно.

4. Если хост использует старый MCP, итог явно указывает необходимость перезапуска/переподключения Codex или другого хоста и последующей проверки. Изолированный MCP не закрывает это условие.

5. После переподключения проверяются происхождение процесса, свежий pf.context и точные выбранные ресурсы/Work при наличии разрешённой активной Work; чужая Work не возобновляется автоматически.

6. Определены восстановление после частичного сбоя и повторный запуск без повторного применения уже подтверждённого обновления; новые состояния и форматы согласуются до изменения публичного контракта.

7. Проверены штатный переход, частичный сбой, рассогласование реестров и ожидающий перезапуска хост; инструкция содержит понятное операторское продолжение.

Связи: При будущем планировании использовать результаты pf-upgrade-compatibility-matrix-20261019, pf-maintenance-sqlite-journals-20261019 и pf-health-readiness-statistics-20261019. Регистрация не разрешает обновлять устройство или перезапускать инфраструктуру.

Общая постановка: .pf/artifacts/pf-upgrade-maintenance-backlog-20261019/backlog.md.

Границы регистрации: не менять продуктовый код, CLI/MCP-контракты и текущий рефакторинг; не запускать и не перезапускать PF App Server, Runtime, MCP, Agent Ledger или monitor; не обновлять устройство; не возобновлять исторические Work.

Перед будущим исследованием или реализацией заново проверить контекст и оформить отдельную явно ограниченную Work. Эта карточка не предоставляет прав на выполнение или запись продуктовых файлов.'
