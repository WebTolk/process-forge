objective: 'Будущая программа систематических юнит-тестов processforge_core. Текущие изменения context safety, Forge hooks и общей Python QA сопровождаются собственными тестами в отдельных execution Work и не объявляют всё Core покрытым. В будущих ограниченных этапах использовать общий pytest/unittest и coverage.py из workplace toolchain; сохранить существующие smoke/интеграционные проверки. Начать с чистых policies, resolver/builders и сервисов с явными внедряемыми зависимостями. Проверять публичное поведение, нормальные и ошибочные входы, граничные значения, разные проекты, отсутствие grants, неизвестные поля, live reads, порядок guard/error/effects, отказ I/O, идемпотентность и восстановление там, где это контракт класса. Для чистых правил использовать fake dependencies без CLI, MCP или Runtime. Не писать тесты, зеркалящие реализацию или закрепляющие случайное расположение методов; не подменять проверку поведения AST/счётчиками классов. Покрытие строк и ветвей измерять по выбранным модулям, явно указывать exclusions/skips и непроверенные платформы; целевые пороги выбирать по риску и исходной базе, не объявлять 100% всего продукта из одного набора. Каждый этап: ограниченный scope, содержательные положительные/отрицательные тесты, воспроизводимая команда, отчёт покрытия, независимое ревью и перечитывание архитектуры. Изменения поведения/новые возможности — отдельные явно разрешённые задачи. Сейчас planning_only, без продуктовой записи и исполнения всей программы.'
