objective: 'Будущая задача. Сейчас только регистрация; реализация, сроки и целевой релиз не согласованы.

Основание: сообщение агента, переданное пользователем 2026-10-19: «Причина длительности найдена: в PF 1.2.0 обновление контекста запускает индексацию всего реестра знаний рабочего места. Индексатор продолжает работу. Проект уже зарегистрирован, его контекст и журналы готовы; дождусь завершения общей индексации, чтобы проверить и доступность поиска».

Уточнённое требование пользователя: обновление контекста не должно перезапускать индексацию всей локальной документации. Автоматическая индексация будет в планировщике PF App Server на уровне устройства; агент сможет явно запускать индексации по требованию в рамках работы уровня устройства. Ручной запуск не относится к проектному уровню.

Область будущего результата: Убрать запуск и ожидание индексации локальной документации из обновления контекста проекта. Индексацию отнести к обслуживанию устройства/рабочего места: штатное выполнение через планировщик PF App Server, ручной запуск агентом по требованию в рамках разрешённой работы уровня устройства.

Критерии приёмки будущего результата:

1. Проверена цепочка вызовов в PF 1.2.0 и актуальном исходном коде: установлено, откуда запускалась полная индексация реестра знаний, сохранены раздельные замеры обновления контекста и индексации. Сообщение агента является основанием для исследования, а не уже выполненной здесь проверкой причины.

2. Обновление контекста проекта не запускает и не перезапускает индексацию локальной документации, не ставит её в очередь и не ожидает завершения общей индексации. Это относится к первому и повторному обновлению, отсутствующему и устаревшему поисковому индексу.

3. Автоматическая индексация является отдельной задачей планировщика уровня устройства в PF App Server; определены её условия запуска, периодичность, исключение дублей, наблюдаемое состояние и продолжение после сбоя. Проектный lifecycle не управляет этой задачей.

4. Ручной запуск является явным действием агента по требованию в рамках разрешённой работы уровня устройства/рабочего места. Проектный контекст и проектная Work не дают права запускать обслуживание всего устройства.

5. Готовность проектного контекста и доступность поиска сообщаются раздельно. Обновление контекста читает состояние уже имеющегося индекса; отсутствие, устаревание или построение индекса диагностируется явно, без ложного ready и без ослабления проверок обязательных ресурсов контекста.

6. Поиск сохраняет ограничения доступа и отбор разрешённых ресурсов проекта/Work независимо от того, что индекс обслуживается на уровне устройства. Смена владельца индексации не расширяет область чтения.

7. Разделение сохраняет file-only работу: обновление проектного контекста не требует работающего PF App Server и не запускает инфраструктуру. Возможности будущего планировщика и ручного обслуживания устройства оформляются в соответствующем явно разрешённом scope.

8. Проверены первый и повторный refresh, большой реестр документов, отсутствующий и устаревший индекс, уже выполняющаяся фоновая индексация, явный ручной запуск на уровне устройства и недоступный App Server. Ожидание или повторная полная индексация из проектного refresh не возникают.

9. Документация и сообщения CLI/MCP объясняют владельца индексации, отдельные состояния контекста и поиска и способ запросить обслуживание устройства; изменения публичных команд и форматов проектируются отдельно до реализации.

Связи: pf-health-readiness-statistics-20261019, pf-upgrade-integrated-verification-20261019. Общая очередь: .pf/artifacts/pf-upgrade-maintenance-backlog-20261019/backlog.md. Задача диагностики определяет представление состояний; эта карточка определяет границу ответственности и запуска индексации.

Границы регистрации: продуктовый код и публичные CLI/MCP-контракты не менять; не запускать/не останавливать индексацию и не обновлять контексты на соседнем устройстве; не запускать и не перезапускать PF App Server, Runtime, MCP, Agent Ledger или monitor. Существующую работающую индексацию не трогать.

Перед будущим исследованием и реализацией проверить свежий PF context и оформить явно ограниченную Work. Карточка planning_only с writer=false не предоставляет разрешений на выполнение или изменение продукта.'
