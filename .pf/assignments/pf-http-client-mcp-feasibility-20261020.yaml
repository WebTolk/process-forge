objective: 'Будущая задача-вопрос по поручению пользователя 2026-10-20; только регистрация, без реализации и без включения в текущий ночной блок.
Наблюдение: агенты часто создают временные Python-скрипты даже для одного обращения к URL API. Пользователь спрашивает, нужен ли общий HTTP-клиент и имеет ли смысл отдельный MCP-инструмент HTTP-запросов.
Исходный факт: стандартная библиотека Python уже предоставляет urllib.request и http.client. Наличие временного сценария само по себе не доказывает отсутствие клиента: сценарий может добавлять авторизацию, JSON, последовательность действий и сохранение доказательств.
Будущий результат: обоснованное решение о повторном использовании существующих средств PF, общем Python HTTP-клиенте/запускателе либо MCP-инструменте. Внедрение нового инструмента заранее не предписано.
Критерии будущего исследования:
1. Собрать реальные повторяющиеся сценарии из работ агентов и различить один запрос, цепочку API-вызовов и предметную обработку. Выявить, какая обвязка повторяется и какие временные скрипты оправданы.
2. Проверить существующие HTTP-возможности PF, доступных инструментов и стандартной библиотеки, прежде чем добавлять клиент или зависимость. Использовать локальные Python-знания PF и официальные источники при действительном пробеле знаний.
3. Сравнить готовый запуск существующего клиента, общий Python-компонент/CLI и отдельный MCP tool по удобству для агента, сопровождению, ограничениям хоста и качеству доказательств. Решение может быть «переиспользовать существующее»; нужен конкретный пример сокращения повторяющейся обвязки.
4. Если MCP-вариант оправдан, спроектировать минимальный контракт: HTTP method, URL, headers, query/body/JSON, timeout, понятные status/headers/body и ошибки. Разделить базовый транспорт, прикладную логику и загрузку/сохранение результатов; не превращать инструмент в произвольное исполнение Python.
5. Определить обращение с авторизацией и секретами, допустимые адреса/редиректы, лимиты ответа и времени, отмену и повтор запросов с учётом идемпотентности. Секреты не попадают в публичные аргументы, логи и артефакты; сетевой доступ подчинён разрешённой Work.
6. Показать изолированные примеры обычного ответа, HTTP-ошибки, timeout, невалидного JSON, авторизации и большого результата. Прикладной успех или публикация не подтверждается одним HTTP 2xx без предметной проверки.
7. Подготовить решение с границами, рисками и следующей отдельной задачей реализации при необходимости. Не запрещать все временные скрипты и не внедрять MCP tool только из-за их существования.
Границы: open/planning_only, writer=false, без продуктовой записи и execution capsule; не менять продукт, зависимости, MCP-контракты и текущие API-интеграции, не выполнять запросы к пользовательским API. Исследование и реализация требуют отдельного будущего поручения и ограниченной Work. Текущий uptime Work и согласованный ночной блок продолжаются независимо.'
