objective: 'Будущая задача. Сейчас только регистрация; реализация, выполнение на устройстве, сроки и целевой релиз не согласованы.

Основание: задания/1-1-0-to-1-2-0-upgrade-report.md.

Наблюдение из отчёта: При обновлении 1.1.0 → 1.2.0 установленный CLI 1.1.0 не поддерживал --workplace-root; оператор использовал обновлятор из проверенной распаковки 1.2.0.

Область будущего результата: Определить поддерживаемые исходные версии и проверять полный переход на целевую версию, включая команды руководства в исходном CLI.

Критерии приёмки будущего результата:

1. Зафиксированы поддерживаемые исходные версии, варианты установки и целевая версия; неподдерживаемые переходы описаны явно, список не выводится из наличия отдельных тегов.

2. Для каждой поддерживаемой исходной версии проверяется полный переход: предварительные проверки, резервирование, plan/apply, проверка результата и сценарий отката при сбое.

3. Команды руководства выполняются именно поставляемым исходным CLI; случай отсутствия --workplace-root в 1.1.0 покрыт. Если нужен обновлятор целевой версии, описаны проверка архива и точка его использования.

4. Проверяются сохранность локальных настроек и исходных журналов, согласованность реестров и отсутствие незавершённого обновления.

5. Сохранены отдельные доказательства для исходников, релизного архива, установленного ядра, Runtime и реально подключённого MCP; новый изолированный stdio MCP не заменяет проверку хоста.

6. Обновлены инструкции по проверенным командам; выпуск блокируется при непроверенном поддерживаемом переходе или явно оформляется изменение политики поддержки.

Связи: Результат задаёт входные условия для pf-upgrade-integrated-verification-20261019. Обновления живых устройств в текущую регистрацию не входят.

Общая постановка: .pf/artifacts/pf-upgrade-maintenance-backlog-20261019/backlog.md.

Границы регистрации: не менять продуктовый код, CLI/MCP-контракты и текущий рефакторинг; не запускать и не перезапускать PF App Server, Runtime, MCP, Agent Ledger или monitor; не обновлять устройство; не возобновлять исторические Work.

Перед будущим исследованием или реализацией заново проверить контекст и оформить отдельную явно ограниченную Work. Эта карточка не предоставляет прав на выполнение или запись продуктовых файлов.'
