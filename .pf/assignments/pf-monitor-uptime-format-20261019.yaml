objective: 'Будущая небольшая задача. Сейчас только регистрация; реализация, сроки и целевой релиз не согласованы.

Основание: пользователь попросил «PF monitor uptime отображать гг/мм/дд/чч/мм». Расшифровка: годы/месяцы/дни/часы/минуты.

Область будущего результата: изменить формат представления существующего uptime в PF monitor, сохранив источник и смысл метрики.

Критерии приёмки будущего результата:

1. Поле uptime в PF monitor отображается в порядке годы/месяцы/дни/часы/минуты с разделителем /. Каждое поле содержит не менее двух цифр; секунды в это представление не входят.

2. Пример для двух дней, трёх часов и пятнадцати минут: 00/00/02/03/15. Для длительности менее минуты показано 00/00/00/00/00.

3. Существующие источник и смысл uptime сохраняются; изменение ограничено отображением в PF monitor. Числовые метрики и публичные CLI/MCP-контракты не меняются ради форматирования.

4. До реализации зафиксировано правило расчёта лет и месяцев по имеющимся данным; календарные месяцы и годы не подменяются неоговорёнными константами. Подпись или легенда различает месяцы и минуты.

5. Проверены переходы минут/часов/дней и границы месяцев/лет по выбранному правилу; неизвестный uptime сохраняет явное состояние отсутствия данных и не превращается в нулевую длительность.

6. Значение помещается в существующий экран монитора; интерактивное обновление и вывод одного снимка сохраняют читаемость.

Связи: pf-windows-monitor-launch-20261019 и pf-health-readiness-statistics-20261019. Общая очередь: .pf/artifacts/pf-upgrade-maintenance-backlog-20261019/backlog.md. Эта карточка не расширяет задачи запуска Windows-монитора или диагностики.

Границы регистрации: продуктовый код не менять, монитор и инфраструктуру не запускать/не перезапускать, метрики живого устройства не проверять. Карточка open/planning_only с writer=false не разрешает реализацию.

Перед будущим выполнением проверить свежий PF context и оформить явно ограниченную Work; текущий рефакторинг и завершённые задачи не переоткрывать.'
