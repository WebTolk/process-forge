objective: 'Отложенная будущая задача: дальний горизонт, после текущей очереди улучшений; срок и целевой релиз не назначены. Сейчас только регистрация, без реализации.
Главная проблема из сообщения пользователя: одного наличия пакета знаний в специализации оказалось недостаточно для чтения содержимого — потребовался явный выбор ресурса в контексте проекта.
Точный пример: обязательный ресурс joomla.rest-api.documentation:rest-api-docs для работы с REST API. Это сообщённое наблюдение, а не уже воспроизведённая здесь ошибка PF.
Будущий результат: исследовать и согласовать, как требования специализации к пакетам и конкретным ресурсам превращаются в явный выбор и допустимый доступ в проектном контексте и Work.
Критерии приёмки:
1. На изолированном примере воспроизведена цепочка специализация -> пакет -> конкретный resource_id -> project context -> Work/capsule -> resolve/read. Сопоставлены PF 1.2.0 и актуальный код, записаны точные входы и место расхождения; наличие пакета не подменяет доказательство допуска ресурса.
2. Явно различены декларация пакета, объявление обязательного ресурса, фактический выбор ресурса и право чтения. Согласовано поведение для специализации с обязательным конкретным ресурсом: корректный выбор в разрешённом контексте либо ранняя понятная диагностика с точным следующим действием. Способ решения определяется после исследования, автоматический доступ ко всему пакету заранее не предписывается.
3. Отсутствующий, невыбранный или запрещённый обязательный ресурс выявляется до зависимой предметной работы. Сообщение указывает specialization/package/resource_id, источник требования и причину; данные не объявляются доступными только по наличию пакета в реестре.
4. Явный выбор и ограничения чтения согласованы между CLI/MCP pf.context, pf.search/pf.resolve и точными Work search/resolve. Проверяется доступ к содержимому разрешённого ресурса, а не только видимость метаданных пакета.
5. Сохраняются минимальные права, запреты и отрицательные проверки посторонних ресурсов. Подключение специализации не расширяет доступ ко всем ресурсам пакета, другим проектам или устройству.
6. Существующие одобренные capsules и закреплённые Work остаются неизменными; изменение требований контекста оформляется штатным управляемым способом. В file-only режиме результат не требует запуска инфраструктуры.
7. Покрыты случаи: пакет есть без выбранного ресурса; специализация явно требует ресурс; ресурс выбран; ресурс отсутствует или запрещён; конфликт специализаций; совпадение CLI/MCP и изолированная Work с неизменной capsule. Инструкция объясняет проверенный способ выбора обязательных ресурсов.
Контекст примера REST сохранён для будущей проверки прикладного сценария: категория, автор, исходные даты, текст, медиа и метаданные; успешный ответ сохранения сам по себе не подтверждает публикацию, требуется независимое чтение фактического результата. Разработка REST-публикации в предмет этой PF-задачи не включена.
Границы регистрации: open/planning_only, writer=false, без продуктовых разрешений и execution capsule. Не подключать joomla.rest-api.documentation к текущему проекту, не менять контекст, политики доступа, specialization contracts, Core, CLI/MCP или живые данные. Исследование и реализация потребуют отдельного поручения и новой явно ограниченной Work.
Общая очередь: .pf/artifacts/pf-upgrade-maintenance-backlog-20261019/backlog.md. После регистрации остановиться.'
