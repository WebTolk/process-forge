objective: 'Будущая задача по повторному поручению пользователя от 2026-10-20. Сейчас только регистрация; реализация, сроки и релиз не назначены.
Основание: при инициализации проекта на устройстве в режиме кузни (Forge) автоматически создавать и настраивать хуки популярных агентов на PF.
Принятая база: pf-forge-project-init-agent-hooks-20261019 завершена только для текущего штатного Codex adapter. Её не переоткрывать, не менять её capsule и не повторять принятую реализацию.
Будущий результат: определить согласованный перечень дополнительных популярных агентов и поддерживаемых версий, затем подключить их штатные механизмы хуков к существующей автонастройке PF при инициализации.
Критерии приёмки:
1. Для каждого выбранного агента зафиксированы поддерживаемые версии, штатный механизм хуков, конфигурационные файлы, события и ограничения. Неподдерживаемые случаи обозначены явно; наличие произвольного агента не означает поддержку.
2. Автонастройка вызывается инициализацией проекта только при эффективном Forge устройства/рабочего места. Инициализация сама не переводит устройство в Forge; поведение других режимов сохраняется.
3. Используются действующие адаптеры/приёмник PF и обязательный gatekeeper; события связаны с верными проектом и сессией. Подключение агента не расширяет полномочия проектной Work или Agent Ledger.
4. Существующие пользовательские хуки и настройки других инструментов сохраняются; повторная инициализация не создаёт дубли. Конфликт или неподдерживаемая конфигурация диагностируются до опасной записи, частичный сбой имеет понятное восстановление.
5. В изолированных проектах проверены первая и повторная инициализация, существующие хуки, конфликт и отказ записи, Forge и другие режимы. Приёмка подтверждает реальную доставку события агент -> PF, а не одно наличие файлов.
6. Существующая поддержка Codex сохраняется; инструкции показывают фактически поддерживаемых агентов и случаи ручного обслуживания. Обновление живого устройства не считается автоматически разрешённым.
Границы регистрации: planning_only, writer=false, без продуктовых областей записи и execution capsule. Не менять Core, CLI/MCP, текущие хуки, настройки агентов или инфраструктуру; не устанавливать агентов и не инициализировать проекты ради проверки. Перед исследованием/реализацией нужны свежий контекст и новая явно ограниченная Work.
