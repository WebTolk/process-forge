objective: 'Будущая задача. Сейчас только регистрация; реализация, выполнение на устройстве, сроки и целевой релиз не согласованы.

Основание: задания/1-1-0-to-1-2-0-upgrade-report.md.

Наблюдение из отчёта: При ready у Runtime проектные контексты оставались stale/broken ещё с состояния до обновления; агрегат Work был partial с нижней границей из-за некорректной записи Run.

Область будущего результата: Независимо показывать здоровье службы, готовность каждого проектного контекста и полноту доступной статистики.

Критерии приёмки будущего результата:

1. Определены независимые состояния службы, готовности проектного контекста и полноты статистики с источником и временем наблюдения.

2. Исправная служба с stale/broken контекстом отображается без смешивания состояний; исходные проблемы контекста отличимы от новых ошибок обновления.

3. Для partial показываются причина, область неполноты и смысл доступного числа как нижней границы. Отсутствующее/неизвестное значение не превращается в ноль.

4. Повреждённая запись одного Run не скрывает доступные счётчики проектов, сессий и workers; ограничение агрегата диагностируется отдельно.

5. Семантика согласована между CLI, MCP и монитором, где эти сведения уже доступны; изменения публичных полей/форматов сначала проектируются и согласуются.

6. Проверены сочетания ready + stale/broken контекста, ready + partial статистики, недоступной службы и полностью достоверных данных.

7. Оператор видит конкретное следующее действие для каждого состояния; диагностика не запускает скрытое исправление контекста, данных или инфраструктуры.

Связи: Результат используется pf-upgrade-integrated-verification-20261019 и учитывается в pf-app-server-window-ux-20261019 без объединения их областей реализации.

Общая постановка: .pf/artifacts/pf-upgrade-maintenance-backlog-20261019/backlog.md.

Границы регистрации: не менять продуктовый код, CLI/MCP-контракты и текущий рефакторинг; не запускать и не перезапускать PF App Server, Runtime, MCP, Agent Ledger или monitor; не обновлять устройство; не возобновлять исторические Work.

Перед будущим исследованием или реализацией заново проверить контекст и оформить отдельную явно ограниченную Work. Эта карточка не предоставляет прав на выполнение или запись продуктовых файлов.'
