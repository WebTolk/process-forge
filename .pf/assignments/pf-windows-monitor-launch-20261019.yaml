objective: 'Будущая задача. Сейчас только регистрация; реализация, выполнение на устройстве, сроки и целевой релиз не согласованы.

Основание: задания/1-1-0-to-1-2-0-upgrade-report.md.

Наблюдение из отчёта: Первый запуск монитора унаследовал TERM=dumb и завершился после снимка. Отдельный интерактивный запуск с локально очищенным TERM был визуально принят оператором.

Область будущего результата: Поставлять готовый пользовательский запуск монитора в отдельном интерактивном Windows-терминале и понятно объяснять режим одного снимка.

Критерии приёмки будущего результата:

1. В поставке доступен документированный готовый Windows-запуск отдельного монитора, работающий из установленного пакета без правки исходников и ручного создания локального сценария запуска.

2. Окно имеет понятное название PF и показывает подключённое рабочее место; закрытие монитора не останавливает Runtime.

3. В интерактивном терминале монитор обновляется; при TERM=dumb, перенаправлении вывода или иной неинтерактивной среде причина однократного вывода и способ открыть интерактивный монитор объясняются явно.

4. Коррекция окружения ограничена дочерним запуском; глобальные переменные, автозапуск и настройки хоста не меняются автоматически.

5. Проверены обычный интерактивный Windows-терминал, наследуемый TERM=dumb, неинтерактивный запуск и закрытие окна при продолжающейся работе сервера.

6. Описана связь с существующей задачей pf-app-server-window-ux-20261019. Информативная консоль и системный трей остаются альтернативами; эта задача не выбирает вариант и не дублирует их реализацию.

7. Монитор остаётся отдельно запускаемым пользователем; автоматический запуск вместе с сервером в эту задачу не включён.

Связи: Связанная существующая задача: pf-app-server-window-ux-20261019, Run pf-app-server-window-backlog-20261019. Это координационная связь, а не разрешение менять её приоритет или начинать реализацию.

Общая постановка: .pf/artifacts/pf-upgrade-maintenance-backlog-20261019/backlog.md.

Границы регистрации: не менять продуктовый код, CLI/MCP-контракты и текущий рефакторинг; не запускать и не перезапускать PF App Server, Runtime, MCP, Agent Ledger или monitor; не обновлять устройство; не возобновлять исторические Work.

Перед будущим исследованием или реализацией заново проверить контекст и оформить отдельную явно ограниченную Work. Эта карточка не предоставляет прав на выполнение или запись продуктовых файлов.'
