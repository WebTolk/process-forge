objective: 'Будущая задача. Сейчас только регистрация; реализация, сроки и целевой релиз не согласованы.

Основание: пользователь попросил при инициализации проекта, если на устройстве режим кузни, автоматически создавать и настраивать хуки популярных агентов на PF.

Область будущего результата: автоматическая настройка поддерживаемых интеграций агентов в ходе инициализации проекта на устройстве Forge с сохранением действующей политики PF и существующих пользовательских настроек.

Критерии приёмки будущего результата:

1. При инициализации проекта на устройстве с действующим режимом кузни (Forge) автоматически создаются и настраиваются поддерживаемые хуки популярных агентов для передачи событий в PF. Триггером служит инициализация проекта; настройка не остаётся отдельным обязательным ручным шагом.

2. Режим определяется по действующей конфигурации устройства/рабочего места PF; его нельзя выводить из одного поля режима проекта, наличия процесса или предположения агента. Инициализация сама не переводит устройство в Forge. В других режимах устройства сохраняется действующая политика; проектный file-only режим не подменяет проверку режима устройства.

3. На этапе проектирования определён согласованный перечень популярных агентов, поддерживаемые штатные механизмы хуков и область каждого файла настройки. Учитываются конфигурация устройства, доступность интеграций и поддерживаемые версии; неподдерживаемые случаи обозначены явно.

4. Хуки используют штатные адаптеры и приёмник PF и действующую политику допуска событий, включая обязательный gatekeeper в эффективном Forge. События связаны с правильными проектом и сессией; новая настройка не обходит ограничения Agent Ledger и не расширяет права проектной Work.

5. Повторная инициализация идемпотентна: не дублирует обработчики, не стирает пользовательские хуки и настройки других инструментов. Для конфликтов определены безопасное объединение либо явная диагностика; для изменяемых настроек предусмотрено восстановление.

6. Результат инициализации показывает для каждой интеграции, какие хуки настроены, что недоступно и что требует внимания. Частичный сбой не выдаётся за полную готовность; определено понятное продолжение без скрытой переустановки агентов или запуска/перезапуска инфраструктуры.

7. На временных проектах проверены Forge, сохранение поведения других режимов, первая и повторная инициализация, уже существующие пользовательские хуки, неподдерживаемая интеграция и ошибка записи. Проверяется фактическая доставка события агент → PF, а не только наличие файла настройки.

8. Обновлены инструкции и критерии приёмки инициализации; изменения публичных CLI/MCP-контрактов сначала проектируются отдельно. Завершённые работы по политике хуков и Ledger не переоткрываются.

Связи: garage-hook-policy-20261017-implement-the-user-selected-effective-mode-h, ledger-hooks-mcp-next-stage-20260814. Обе существующие карточки прочитаны как связанные завершённые работы; новая задача дополняет инициализацию и не повторяет их реализацию. Общая очередь: .pf/artifacts/pf-upgrade-maintenance-backlog-20261019/backlog.md.

Границы регистрации: продуктовый код и действующие хуки не менять; не инициализировать проекты ради проверки, не устанавливать агентов и не запускать/не перезапускать PF App Server, Runtime, MCP или Agent Ledger. Никакая инфраструктурная настройка в текущем поручении не выполняется.

Перед будущим выполнением проверить свежий PF context и оформить явно ограниченную Work исследования/проектирования и затем реализации. Карточка open/planning_only с writer=false не даёт права менять хуки или продукт.'
