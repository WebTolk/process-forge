objective: 'Будущая задача. Сейчас только регистрация; реализация, выполнение на устройстве, сроки и целевой релиз не согласованы.

Основание: задания/1-1-0-to-1-2-0-upgrade-report.md.

Наблюдение из отчёта: SQLite-индекс резервировался через backup API. В старом журнале найдена строка с начальными NUL; её байты сохранены отдельно, корректные записи импортированы после отдельной проверки с --skip-invalid.

Область будущего результата: Включить согласованное резервирование SQLite, предварительную проверку журналов и сохранение повреждённых строк в штатный сценарий обслуживания.

Критерии приёмки будущего результата:

1. Штатный сценарий делает согласованную копию SQLite через backup API; для архивов и резервных копий сохраняются проверяемые манифесты/контрольные суммы и результат проверки целостности.

2. До миграции проверяются исходные журналы; диагностика указывает файл, строку/смещение и причину ошибки, не меняя исходник.

3. Повреждённая запись сохраняется побайтово отдельно с привязкой к источнику и контрольной суммой. Исходные журналы остаются неизменными.

4. Пропуск повреждённых записей требует явного операторского выбора; --skip-invalid не включается молча. Отчёт содержит числа прочитанных, импортированных, пропущенных и повреждённых записей.

5. После импорта выполняются integrity_check, проверка состояния миграции и сверка корректных записей; определены повторный импорт без дублирования и проверяемое восстановление из резервной копии.

6. Проверены корректный журнал, повреждённая строка с NUL, отказ без разрешения на пропуск, повторное выполнение и восстановление.

7. Операторская документация описывает границы обслуживания и хранение доказательств без автоматического исправления проектных контекстов или возобновления исторических Work.

Связи: Результат используется pf-upgrade-integrated-verification-20261019. Исправление старых данных соседнего устройства сейчас не выполняется.

Общая постановка: .pf/artifacts/pf-upgrade-maintenance-backlog-20261019/backlog.md.

Границы регистрации: не менять продуктовый код, CLI/MCP-контракты и текущий рефакторинг; не запускать и не перезапускать PF App Server, Runtime, MCP, Agent Ledger или monitor; не обновлять устройство; не возобновлять исторические Work.

Перед будущим исследованием или реализацией заново проверить контекст и оформить отдельную явно ограниченную Work. Эта карточка не предоставляет прав на выполнение или запись продуктовых файлов.'
