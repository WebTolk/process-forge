        description: Actual relevant unit, integration and regression commands, tool versions, checked candidate identity, exit codes and results. Failed or unavailable required tests do not pass assurance. For a change without executable behavior, record a justified not_applicable decision with reason and evidence.
        owner_role: reviewer
        template: validation-report-template
        lifecycle:
