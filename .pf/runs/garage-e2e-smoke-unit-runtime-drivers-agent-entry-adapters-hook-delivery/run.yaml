        description: Review is complete and required test-report and code-quality-report show successful relevant tests and project/toolchain quality checks for the current candidate, with actual commands, versions and exit codes. Required failures or unavailable checks block completion. Any inapplicable check, including conditional browser/UI verification, requires an explicit reason and supporting evidence; missing evidence is not success.
        blocking: true
        type: checklist
        required: true
      -
        id: release-readiness-decided
        description: Release delivery is either completed or explicitly recorded as not_applicable with reason and evidence.
        blocking: true
        type: decision
        required: true
        not_applicable_example:
          gate_id: release-readiness-decided
          status: not_applicable
          reason: Task changes are local development only; no release requested.
          evidence:
            - scope
            - test-report
      -
        id: delivery-profile-run-or-skipped-with-reason
        description: Delivery/build profile ran and wrote evidence, or no profile/release need was recorded with reason and evidence.
        blocking: true
        type: decision
        required: true
      -
        id: evolution-captured
        description: Lessons learned and reusable update proposals are captured, or evolve is recorded as not_applicable with reason and evidence.
        blocking: true
        type: decision
        required: true
