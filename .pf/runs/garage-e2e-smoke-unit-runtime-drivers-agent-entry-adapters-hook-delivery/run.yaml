  definition:
    schema_version: 1
    id: software-feature-development
    name: Software Feature Development
    version: 1.2.1
    status: active
    description: Guides one cohesive software result through orchestration, intake, investigation, domain understanding, architecture, iterative implementation, integrated assurance, release delivery and evolution capture. Internal iterations and nested worker contributions stay inside the parent result boundary. Release and evolution stages may be completed as not_applicable with evidence when delivery is not required.
    required_capabilities:
      - repository_read
      - repository_write
      - test_running
      - review
    metadata:
      application_guidance:
        delivery_unit: One cohesive, independently reviewable result defines the Run boundary; a function, tool call, worker response, commit or elapsed time does not. A small independent fix can be a complete result.
        inner_iterations: Repeat domain and architecture reasoning, approved revisions, implementation and targeted checks inside the current Work grants. Iteration completion does not itself require new admission, final assurance or delivery.
        worker_packages: When delegation is authorized, give a worker a substantial independent package or batch related small work. A full child process may be nested inside the parent; its completion contributes to parent acceptance and does not restart or publish the parent.
        verification: Plan focused checks for iterations and risk-based assurance for the integrated candidate. Reuse earlier evidence only while applicable; rerun checks invalidated by later edits.
        delivery: Apply explicit project and operator commit, publication, release and installation requirements at the agreed delivery boundary; record not_applicable decisions with reason and evidence.
        artifacts: Keep artifacts proportional to the decisions and reference current validated facts. Reuse evidence without duplicating the lifecycle per iteration; approved artifacts, process pins and capsules remain immutable.
        authority: Guidance does not grant delegation, broaden file/tool scope, add stage transitions or bypass gates. Use PF-returned outcomes and governed revisions/handoffs when required.
      lifecycle_modes:
        full:
          description: Full software lifecycle from intake to evolve.
          release_delivery_required: true
          evolve_required: true
        feature:
          description: Feature development with investigation, architecture, implementation, assurance, and optional release/evolve.
          release_delivery_required: conditional
          evolve_required: conditional
        bug_fix:
          description: Focused fix with investigation, impact analysis, implementation, regression assurance, and optional release notes.
          release_delivery_required: conditional
          evolve_required: conditional
        debug_loop:
          description: Investigation and repeated implementation/assurance loop; release/evolve optional.
          release_delivery_required: false
          evolve_required: conditional
        implementation_only:
          description: Allowed only when intake, investigation, and architecture artifacts already exist or are explicitly provided as inputs.
          requires_existing_inputs:
            - scope
            - investigation-report
            - implementation-plan
          release_delivery_required: false
          evolve_required: conditional
      compact_mode:
        allowed: true
        rule: Optional stages must be recorded as not_applicable with reason and evidence; they must not be silently skipped.
      lifecycle_stage_order:
        - orchestration
        - intake-scope
        - investigation
        - domain-modeling
        - architecture-plan
        - implementation
        - code-assurance
        - release-delivery
        - evolve
      legacy_webtolk_mapping:
        orchestration: orchestration
        intake: intake-scope
        investigation: investigation
        domain: domain-modeling
        architecture: architecture-plan
        implementation: implementation
        assurance: code-assurance
        release: release-delivery
        evolve: evolve
        delivery-build-runner: delivery-build-profile
      delivery_profile_boundary:
        rule: Delivery/build/package/install is an operation profile used inside assurance or release-delivery, not a separate process id.
        process_id_forbidden_examples:
          - platform-plugin-delivery
          - platform-extension-delivery
          - plugin-delivery
          - package-delivery
        preferred_shape:
          process_id: software-feature-development
          execution_profile:
            delivery_profile: project.default_delivery
    hooks:
      emit:
        -
          event: process.started
          required: true
        -
          event: stage.started
          required: true
        -
          event: stage.completed
          required: true
        -
          event: assignment.created
          required: true
        -
          event: artifact.created
          required: true
        -
          event: gate.failed
          required: true
        -
          event: chat.message.recorded
          required: false
      subscriptions:
        -
          event: assignment.completed
          actions:
            -
              type: create_review_request
        -
          event: gate.failed
          actions:
            -
              type: block_stage
            -
              type: notify_orchestrator
      tracking:
        include:
          - process_id
          - process_version
          - stage_id
          - assignment_id
          - artifact_refs
          - actor
          - session_id
          - status
    roles:
      -
        id: orchestrator
        title: Orchestrator
        responsibility: Coordinates lifecycle mode, scope, planning, gates, and handoffs.
        kind: primary_agent
        responsibilities:
          - Coordinates lifecycle mode, scope, planning, gates, and handoffs.
      -
        id: developer
        title: Developer
        responsibility: Implements the approved change inside the allowed scope.
        kind: primary_agent
        responsibilities:
          - Implements the approved change inside the allowed scope.
      -
        id: reviewer
        title: Reviewer
        responsibility: Reviews behavior, risks, verification evidence, and release readiness.
        kind: primary_agent
        responsibilities:
          - Reviews behavior, risks, verification evidence, and release readiness.
    stages:
      -
        id: orchestration
        title: Orchestration
        description: Prepare context and lifecycle mode; identify the cohesive delivery unit, acceptance boundary, parent Run/Assignment when nested, coordination mode and available delivery/build profile.
        required_inputs:
          []
        produced_artifacts:
          - task-record
          - execution-context-summary
          - lifecycle-mode-decision
        required_role: orchestrator
        required_capabilities:
          - process_coordination
        allowed_tools:
          - processforge-cli
        entry_gates:
          []
        exit_gates:
          - context-ready
        goal: Prepare execution context and select lifecycle mode before scope work starts.
        actor: primary_agent
        gates:
          - context-ready
      -
        id: intake-scope
        title: Intake And Scope
        description: Capture the result objective, included and deferred work, acceptance criteria, risks, unknowns and delivery requirement; distinguish internal iterations and worker contributions from independent deliveries.
        required_inputs:
          - execution-context-summary
          - lifecycle-mode-decision
        produced_artifacts:
          - brief
          - scope
          - task-record
        required_role: orchestrator
        required_capabilities:
          - process_coordination
        allowed_tools:
          - processforge-cli
        entry_gates:
          - context-ready
        exit_gates:
          - scope-accepted
        goal: Establish accepted scope and delivery expectations.
        actor: primary_agent
        gates:
          - scope-accepted
      -
        id: investigation
        title: Investigation
        description: Inspect affected code, configs, tests, docs, compatibility and evidence paths; reuse current validated facts and investigate gaps relevant to the agreed result.
        required_inputs:
          - scope
        produced_artifacts:
          - investigation-report
          - impact-analysis
        required_role: orchestrator
        required_capabilities:
          - repository_read
        allowed_tools:
          - repository_symbol_analysis
          - validator
        entry_gates:
          - scope-accepted
        exit_gates:
          - investigation-complete
          - impact-understood
        goal: Understand the existing system before architecture or edits.
        actor: primary_agent
        gates:
          - investigation-complete
          - impact-understood
      -
        id: domain-modeling
        title: Domain Modeling
        description: Capture or reference current domain terms, rules, constraints and platform/framework rules; record affected rules and refinements rather than recreating unchanged domain documents for each iteration.
        required_inputs:
          - investigation-report
          - impact-analysis
        produced_artifacts:
          - domain-notes
          - domain-model
          - domain-rules
        required_role: orchestrator
        required_capabilities:
          - repository_read
        allowed_tools:
          - processforge-cli
          - repository_symbol_analysis
        entry_gates:
          - investigation-complete
          - impact-understood
        exit_gates:
          - domain-rules-captured
        goal: Record domain understanding without hardcoding platform-specific rules into the core process.
        actor: primary_agent
        gates:
          - domain-rules-captured
      -
        id: architecture-plan
        title: Architecture Plan
        description: Choose the cohesive approach, dependencies, file/module ownership and implementation plan; distinguish targeted iteration checks from integrated assurance and delivery, with trade-offs and rollback concerns.
        required_inputs:
          - domain-rules
        produced_artifacts:
          - architecture
          - implementation-plan
          - decision-log
        required_role: orchestrator
        required_capabilities:
          - architecture
        allowed_tools:
          - repository_symbol_analysis
          - validator
        entry_gates:
          - domain-rules-captured
        exit_gates:
          - architecture-plan-ready
        goal: Approve a bounded implementation plan before edits.
        actor: primary_agent
        gates:
          - architecture-plan-ready
      -
        id: implementation
        title: Implementation
        description: Build the integrated candidate through as many scoped reasoning, approved revision, edit and targeted-check iterations as needed; preserve unrelated files and record changes without restarting the lifecycle for each contribution.
        required_inputs:
          - implementation-plan
        produced_artifacts:
          - changed-files
          - change-summary
        required_role: developer
        required_capabilities:
          - repository_write
        allowed_tools:
          - editor
          - test_runner
        hooks:
          emit:
            -
              event: tool.invoked
            -
              event: artifact.created
            -
              event: artifact.updated
          stop_gates:
            -
              event: session.ended
              require:
                - gate.passed
        entry_gates:
          - architecture-plan-ready
        exit_gates:
          - implementation-scope-respected
        goal: Implement only the approved change and record changed files.
        actor: primary_agent
        gates:
          - implementation-scope-respected
      -
        id: code-assurance
        title: Code Assurance
        description: Review the accumulated candidate against acceptance criteria; run the relevant tests and project/toolchain code-quality checks and record successful results in the required test-report and code-quality-report. Include applicable integration, regression and browser/UI checks; reuse valid evidence and rerun checks affected by later edits.
        required_inputs:
          - change-summary
        produced_artifacts:
          - review-findings
          - test-plan
          - test-cases
          - test-report
          - code-quality-report
          - browser-verification-report
        required_role: reviewer
        required_capabilities:
          - review
          - test_running
        allowed_tools:
          - test_runner
          - validator
        entry_gates:
          - implementation-scope-respected
        exit_gates:
          - assurance-complete
        goal: Require successful relevant tests and code-quality checks; record exact evidence and justified applicability decisions, including browser/UI verification.
        actor: primary_agent
        gates:
          - assurance-complete
      -
        id: release-delivery
        title: Release Delivery
        description: Apply the agreed result-level delivery requirement and explicit project/operator policies, run the configured profile when required, and record package/publication evidence or a justified not_applicable decision.
        required_inputs:
          - test-report
          - code-quality-report
        produced_artifacts:
          - release-notes
          - migration-notes
          - patch
          - delivery-plan
          - delivery-report
        required_role: reviewer
        required_capabilities:
          - test_running
        allowed_tools:
          - test_runner
          - validator
          - processforge-cli
        entry_gates:
          - assurance-complete
        exit_gates:
          - release-readiness-decided
          - delivery-profile-run-or-skipped-with-reason
        goal: Treat delivery/build/package/install as an operation profile, not a separate process.
        actor: primary_agent
        conditional: true
        not_applicable_policy:
          required: true
          evidence_fields:
            - status
            - reason
            - evidence
        gates:
          - release-readiness-decided
          - delivery-profile-run-or-skipped-with-reason
      -
        id: evolve
        title: Evolve
        description: Consolidate lessons from the result and its internal/worker iterations into evidence-backed proposals for rules, templates, knowledge, checks, delivery profiles or instructions at the Run boundary.
        required_inputs:
          - delivery-report
        produced_artifacts:
          - evolution-report
          - updated-rules-or-extensions
          - instruction-update-proposal
          - knowledge-update-proposal
        required_role: orchestrator
        required_capabilities:
          - review
        allowed_tools:
          - processforge-cli
          - validator
        entry_gates:
          - release-readiness-decided
        exit_gates:
          - evolution-captured
        goal: Capture evolution learning or explicit not_applicable evidence before run completion.
        actor: primary_agent
        conditional: true
        not_applicable_policy:
          required: true
          evidence_fields:
            - status
            - reason
            - evidence
        gates:
          - evolution-captured
