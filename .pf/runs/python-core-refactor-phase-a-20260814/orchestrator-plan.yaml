schema_version: 1
run:
  id: python-core-refactor-phase-a-20260814
  title: Python Core refactor Phase A audit
  process: multi-agent-task-orchestration
  objective: Produce independent, read-only inventories needed for the architectural audit required before Process Forge Python Core extraction. No product code changes are authorized in this run.
orchestrator:
  agent_id: codex-primary
  role: orchestrator
  responsibilities:
    - create non-overlapping audit assignments
    - validate each worker report against repository evidence
    - synthesize Phase A architectural artifacts
runtime:
  default_driver: codex-exec
  supervisor_profile: default
  start_policy: manual
  max_parallel_workers: 3
  model: gpt-5.3-codex-spark
workers:
  -
    id: python-core-process-contract-inventory
    title: Process contract code inventory
    role: architecture-inventory
    process: task-batch-execution
    objective: Inventory current ownership, call clusters, dependencies, state and I/O for Process Definition loading, normalization, validation, Doctor, Authoring, Stage, Gate, Artifact/Evidence and Process Transition. Report facts with file and symbol references; do not propose code changes.
    execution_mode: read_only
    writer: false
    runtime_driver: codex-exec
    model: gpt-5.3-codex-spark
    allow_subagents: false
    subagent_policy:
      allow: false
      max_subagents: 0
      allowed_roles:
        []
      require_reports: false
      reports_dir: ""
    allowed_files:
      []
    allowed_read_files:
      - .pf/AGENTS.md
      - .pf/contexts/project-context.snapshot.yaml
      - .pf/artifacts/process-stage-contract-normalization-20260814/**
      - schemas/process-definition.schema.json
      - processes/core/**
      - packs/**
      - tools/processforge.py
      - tools/smoke_process*.py
      - tools/validate-process-forge-schemas.py
    forbidden_files:
      - tools/pf_runtime/**
      - bin/**
      - docs/**
    required_outputs:
      -
        id: process-contract-inventory
        path: .pf/artifacts/python-core-refactor-phase-a-20260814/process-contract-inventory.md
        type: markdown
        required: true
    expected_report_artifact: .pf/artifacts/python-core-refactor-phase-a-20260814/process-contract-inventory.md
    expected_report_language: ru
    worker_may_rebuild_context: false
  -
    id: python-core-adapter-runtime-inventory
    title: Runtime and adapter inventory
    role: architecture-inventory
    process: task-batch-execution
    objective: Inventory runtime, CLI, MCP, worker lifecycle, Inspector, Agent Ledger, Agent Director, projectors, current-work-state, events, routes and runtime drivers. Identify current dependencies on tools/processforge.py and candidate Core-facing seams; report facts only, without changes.
    execution_mode: read_only
    writer: false
    runtime_driver: codex-exec
    model: gpt-5.3-codex-spark
    allow_subagents: false
    subagent_policy:
      allow: false
      max_subagents: 0
      allowed_roles:
        []
      require_reports: false
      reports_dir: ""
    allowed_files:
      []
    allowed_read_files:
      - .pf/AGENTS.md
      - .pf/contexts/project-context.snapshot.yaml
      - .pf/artifacts/process-stage-contract-normalization-20260814/**
      - tools/processforge.py
      - tools/pf_runtime/**
      - tools/smoke_runtime*.py
      - tools/smoke_worker*.py
      - tools/smoke_agent*.py
      - tools/smoke_current*.py
      - tools/smoke_stage*.py
      - bin/pf.py
      - templates/registries/runtime-drivers.yaml
      - schemas/*runtime*.json
      - schemas/*worker*.json
      - schemas/*agent*.json
    forbidden_files:
      - docs/**
      - dist/**
    required_outputs:
      -
        id: adapter-runtime-inventory
        path: .pf/artifacts/python-core-refactor-phase-a-20260814/adapter-runtime-inventory.md
        type: markdown
        required: true
    expected_report_artifact: .pf/artifacts/python-core-refactor-phase-a-20260814/adapter-runtime-inventory.md
    expected_report_language: ru
    worker_may_rebuild_context: false
  -
    id: python-core-public-surface-inventory
    title: Public surface and assurance inventory
    role: release-assurance-inventory
    process: task-batch-execution
    objective: Inventory documented and released Python/CLI surface, package/archive inclusion rules, direct-script import behavior, existing smoke suites, and compatibility cleanup candidates. Distinguish verified public contracts from internal code; do not modify files.
    execution_mode: read_only
    writer: false
    runtime_driver: codex-exec
    model: gpt-5.3-codex-spark
    allow_subagents: false
    subagent_policy:
      allow: false
      max_subagents: 0
      allowed_roles:
        []
      require_reports: false
      reports_dir: ""
    allowed_files:
      []
    allowed_read_files:
      - .pf/AGENTS.md
      - .pf/contexts/project-context.snapshot.yaml
      - README.md
      - README.ru.md
      - QUICKSTART.md
      - QUICKSTART.ru.md
      - docs/**
      - bin/pf.py
      - tools/processforge.py
      - tools/release_archive_test.py
      - tools/smoke_*.py
      - tools/validate-public-cleanliness.py
      - dist/**
      - packages/**
      - checksums/**
      - .processforge-releaseignore
      - requirements.txt
      - VERSION
    forbidden_files:
      - .pf/runtime/**
    required_outputs:
      -
        id: public-surface-inventory
        path: .pf/artifacts/python-core-refactor-phase-a-20260814/public-surface-inventory.md
        type: markdown
        required: true
    expected_report_artifact: .pf/artifacts/python-core-refactor-phase-a-20260814/public-surface-inventory.md
    expected_report_language: ru
    worker_may_rebuild_context: false
integration:
  required: true
  role: orchestrator
  expected_output: .pf/artifacts/python-core-refactor-phase-a-20260814/phase-a-integration.md
allow_write_scope_overlap: false
