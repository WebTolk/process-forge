  process_fingerprint: 'sha256:cc411028e9585dd8f56e07faa8997d9e7af1a39a801a0d8c0ca9c8c1e89dfd49'
  process_source: packs/official/software-development/processes/software-feature-development.yaml
  snapshot_id: ctx-20261002-060156-86cbed
  snapshot_checksum: 'sha256:c0cc71edb3f7ea9b97c2a2571d95b3c8ef7f67b188a476d7a29451193545c2a0'
  definition:
    schema_version: 1
    id: software-feature-development
    name: Software Feature Development
    version: 1.1.0
    status: active
    description: Guides software work from orchestration and intake through investigation, domain understanding, architecture, implementation, assurance, release delivery, and evolution capture. Release and evolution stages may be completed as not_applicable with evidence when the task does not require delivery.
    required_capabilities:
      - repository_read
      - repository_write
      - test_running
      - review
    metadata:
      lifecycle_modes:
        full:
          description: Full software lifecycle from intake to evolve.
          release_delivery_required: true
          evolve_required: true
        feature:
          description: Feature development with investigation, architecture, implementation, assurance, and optional release/evolve.
          release_delivery_required: conditional
          evolve_required: conditional
        bug_fix:
          description: Focused fix with investigation, impact analysis, implementation, regression assurance, and optional release notes.
          release_delivery_required: conditional
          evolve_required: conditional
        debug_loop:
          description: Investigation and repeated implementation/assurance loop; release/evolve optional.
          release_delivery_required: false
          evolve_required: conditional
        implementation_only:
          description: Allowed only when intake, investigation, and architecture artifacts already exist or are explicitly provided as inputs.
          requires_existing_inputs:
            - scope
            - investigation-report
            - implementation-plan
          release_delivery_required: false
          evolve_required: conditional
      compact_mode:
        allowed: true
        rule: Optional stages must be recorded as not_applicable with reason and evidence; they must not be silently skipped.
      lifecycle_stage_order:
        - orchestration
        - intake-scope
        - investigation
        - domain-modeling
        - architecture-plan
        - implementation
        - code-assurance
        - release-delivery
        - evolve
      legacy_webtolk_mapping:
        orchestration: orchestration
        intake: intake-scope
        investigation: investigation
        domain: domain-modeling
        architecture: architecture-plan
        implementation: implementation
        assurance: code-assurance
        release: release-delivery
        evolve: evolve
        delivery-build-runner: delivery-build-profile
      delivery_profile_boundary:
        rule: Delivery/build/package/install is an operation profile used inside assurance or release-delivery, not a separate process id.
        process_id_forbidden_examples:
          - platform-plugin-delivery
          - platform-extension-delivery
          - plugin-delivery
          - package-delivery
        preferred_shape:
          process_id: software-feature-development
          execution_profile:
            delivery_profile: project.default_delivery
    hooks:
      emit:
        -
          event: process.started
          required: true
        -
          event: stage.started
          required: true
        -
          event: stage.completed
          required: true
        -
          event: assignment.created
          required: true
        -
          event: artifact.created
          required: true
        -
          event: gate.failed
          required: true
        -
          event: chat.message.recorded
          required: false
      subscriptions:
        -
          event: assignment.completed
          actions:
            -
              type: create_review_request
        -
          event: gate.failed
          actions:
            -
              type: block_stage
            -
              type: notify_orchestrator
      tracking:
        include:
          - process_id
          - process_version
          - stage_id
          - assignment_id
          - artifact_refs
          - actor
          - session_id
          - status
    roles:
      -
        id: orchestrator
        title: Orchestrator
        responsibility: Coordinates lifecycle mode, scope, planning, gates, and handoffs.
        kind: primary_agent
        responsibilities:
          - Coordinates lifecycle mode, scope, planning, gates, and handoffs.
      -
        id: developer
        title: Developer
        responsibility: Implements the approved change inside the allowed scope.
        kind: primary_agent
        responsibilities:
          - Implements the approved change inside the allowed scope.
      -
        id: reviewer
        title: Reviewer
        responsibility: Reviews behavior, risks, verification evidence, and release readiness.
        kind: primary_agent
        responsibilities:
          - Reviews behavior, risks, verification evidence, and release readiness.
    stages:
      -
        id: orchestration
        title: Orchestration
        description: Prepare execution context, lifecycle mode, coordination mode, run/task ids, context snapshot, and available delivery/build profile.
        required_inputs:
          []
        produced_artifacts:
          - task-record
          - execution-context-summary
          - lifecycle-mode-decision
        required_role: orchestrator
        required_capabilities:
          - process_coordination
        allowed_tools:
          - processforge-cli
        entry_gates:
          []
        exit_gates:
          - context-ready
        goal: Prepare execution context and select lifecycle mode before scope work starts.
        actor: primary_agent
        gates:
          - context-ready
      -
        id: intake-scope
        title: Intake And Scope
        description: Capture objective, boundaries, non-goals, acceptance criteria, risks, unknowns, and release/delivery requirement.
        required_inputs:
          - execution-context-summary
          - lifecycle-mode-decision
        produced_artifacts:
          - brief
          - scope
          - task-record
        required_role: orchestrator
        required_capabilities:
          - process_coordination
        allowed_tools:
          - processforge-cli
        entry_gates:
          - context-ready
        exit_gates:
          - scope-accepted
        goal: Establish accepted scope and delivery expectations.
        actor: primary_agent
        gates:
          - scope-accepted
      -
        id: investigation
        title: Investigation
        description: Inspect existing code, affected areas, configs, tests, docs, compatibility, migration risk, and evidence paths.
        required_inputs:
          - scope
        produced_artifacts:
          - investigation-report
          - impact-analysis
        required_role: orchestrator
        required_capabilities:
          - repository_read
        allowed_tools:
          - repository_symbol_analysis
          - validator
        entry_gates:
          - scope-accepted
        exit_gates:
          - investigation-complete
          - impact-understood
        goal: Understand the existing system before architecture or edits.
        actor: primary_agent
        gates:
          - investigation-complete
          - impact-understood
      -
        id: domain-modeling
        title: Domain Modeling
        description: Capture domain terms, rules, constraints, and platform/framework rules from project context and platform contracts.
        required_inputs:
          - investigation-report
          - impact-analysis
        produced_artifacts:
          - domain-notes
          - domain-model
          - domain-rules
        required_role: orchestrator
        required_capabilities:
          - repository_read
        allowed_tools:
          - processforge-cli
          - repository_symbol_analysis
        entry_gates:
          - investigation-complete
          - impact-understood
        exit_gates:
          - domain-rules-captured
        goal: Record domain understanding without hardcoding platform-specific rules into the core process.
        actor: primary_agent
        gates:
          - domain-rules-captured
      -
        id: architecture-plan
        title: Architecture Plan
        description: Choose approach, file/module plan, verification outline, trade-offs, rollback, and migration concerns.
        required_inputs:
          - domain-rules
        produced_artifacts:
          - architecture
          - implementation-plan
          - decision-log
        required_role: orchestrator
        required_capabilities:
          - architecture
        allowed_tools:
          - repository_symbol_analysis
          - validator
        entry_gates:
          - domain-rules-captured
        exit_gates:
          - architecture-plan-ready
        goal: Approve a bounded implementation plan before edits.
        actor: primary_agent
        gates:
          - architecture-plan-ready
      -
        id: implementation
        title: Implementation
        description: Make bounded changes, preserve unrelated files, collect evidence, and update decisions when the plan changes.
        required_inputs:
          - implementation-plan
        produced_artifacts:
          - changed-files
          - change-summary
        required_role: developer
        required_capabilities:
          - repository_write
        allowed_tools:
          - editor
          - test_runner
        hooks:
          emit:
            -
              event: tool.invoked
            -
              event: artifact.created
            -
              event: artifact.updated
          stop_gates:
            -
              event: session.ended
              require:
                - gate.passed
        entry_gates:
          - architecture-plan-ready
        exit_gates:
          - implementation-scope-respected
        goal: Implement only the approved change and record changed files.
        actor: primary_agent
        gates:
          - implementation-scope-respected
      -
        id: code-assurance
        title: Code Assurance
        description: Review behavior, risks, static checks, tests, browser/UI verification when applicable, regressions, and known limitations.
        required_inputs:
          - change-summary
        produced_artifacts:
          - review-findings
          - test-plan
          - test-cases
          - test-report
          - browser-verification-report
        required_role: reviewer
        required_capabilities:
          - review
          - test_running
        allowed_tools:
          - test_runner
          - validator
        entry_gates:
          - implementation-scope-respected
        exit_gates:
          - assurance-complete
        goal: Verify the change and explicitly record browser/UI verification as applicable or not_applicable.
        actor: primary_agent
        gates:
          - assurance-complete
      -
        id: release-delivery
        title: Release Delivery
        description: Decide release readiness, prepare package or patch when requested, run delivery/build profile when configured, and record release evidence or not_applicable reason.
        required_inputs:
          - test-report
        produced_artifacts:
          - release-notes
          - migration-notes
          - patch
          - delivery-plan
          - delivery-report
        required_role: reviewer
        required_capabilities:
          - test_running
        allowed_tools:
          - test_runner
          - validator
          - processforge-cli
        entry_gates:
          - assurance-complete
        exit_gates:
          - release-readiness-decided
          - delivery-profile-run-or-skipped-with-reason
        goal: Treat delivery/build/package/install as an operation profile, not a separate process.
        actor: primary_agent
        conditional: true
        not_applicable_policy:
          required: true
          evidence_fields:
            - status
            - reason
            - evidence
        gates:
          - release-readiness-decided
          - delivery-profile-run-or-skipped-with-reason
      -
        id: evolve
        title: Evolve
        description: Capture lessons learned and propose updates to rules, templates, knowledge packages, checks, delivery profiles, or agent instructions.
        required_inputs:
          - delivery-report
        produced_artifacts:
          - evolution-report
          - updated-rules-or-extensions
          - instruction-update-proposal
          - knowledge-update-proposal
        required_role: orchestrator
        required_capabilities:
          - review
        allowed_tools:
          - processforge-cli
          - validator
        entry_gates:
          - release-readiness-decided
        exit_gates:
          - evolution-captured
        goal: Capture evolution learning or explicit not_applicable evidence before run completion.
        actor: primary_agent
        conditional: true
        not_applicable_policy:
          required: true
          evidence_fields:
            - status
            - reason
            - evidence
        gates:
          - evolution-captured
    artifact_definitions:
      -
        id: task-record
        title: Task Record
        owner_role: orchestrator
        template: artifact-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: markdown
        required: true
        path_hint: .pf/artifacts/task-record.md
      -
        id: execution-context-summary
        title: Execution Context Summary
        owner_role: orchestrator
        template: artifact-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: markdown
        required: true
        path_hint: .pf/artifacts/execution-context-summary.md
      -
        id: lifecycle-mode-decision
        title: Lifecycle Mode Decision
        owner_role: orchestrator
        template: artifact-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: markdown
        required: true
        path_hint: .pf/artifacts/lifecycle-mode-decision.md
      -
        id: brief
        title: Brief
        owner_role: orchestrator
        template: artifact-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: markdown
        required: true
        path_hint: .pf/artifacts/brief.md
      -
        id: scope
        title: Scope
        owner_role: orchestrator
        template: artifact-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: markdown
        required: true
        path_hint: .pf/artifacts/scope.md
      -
        id: investigation-report
        title: Investigation Report
        owner_role: orchestrator
        template: artifact-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: markdown
        required: true
        path_hint: .pf/artifacts/investigation-report.md
      -
        id: impact-analysis
        title: Impact Analysis
        owner_role: orchestrator
        template: artifact-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: markdown
        required: true
        path_hint: .pf/artifacts/impact-analysis.md
      -
        id: domain-notes
        title: Domain Notes
        owner_role: orchestrator
        template: artifact-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: markdown
        required: true
        path_hint: .pf/artifacts/domain-notes.md
      -
        id: domain-model
        title: Domain Model
        owner_role: orchestrator
        template: artifact-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: markdown
        required: true
        path_hint: .pf/artifacts/domain-model.md
      -
        id: domain-rules
        title: Domain Rules
        owner_role: orchestrator
        template: artifact-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: markdown
        required: true
        path_hint: .pf/artifacts/domain-rules.md
      -
        id: architecture
        title: Architecture
        owner_role: orchestrator
        template: artifact-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: markdown
        required: true
        path_hint: .pf/artifacts/architecture.md
      -
        id: implementation-plan
        title: Implementation Plan
        owner_role: orchestrator
        template: artifact-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: markdown
        required: true
        path_hint: .pf/artifacts/implementation-plan.md
      -
        id: decision-log
        title: Decision Log
        owner_role: orchestrator
        template: artifact-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: markdown
        required: true
        path_hint: .pf/artifacts/decision-log.md
      -
        id: changed-files
        title: Changed Files
        owner_role: developer
        template: artifact-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: markdown
        required: true
        path_hint: .pf/artifacts/changed-files.md
      -
        id: change-summary
        title: Change Summary
        owner_role: developer
        template: artifact-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: markdown
        required: true
        path_hint: .pf/artifacts/change-summary.md
      -
        id: review-findings
        title: Review Findings
        owner_role: reviewer
        template: artifact-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: markdown
        required: true
        path_hint: .pf/artifacts/review-findings.md
      -
        id: test-plan
        title: Test Plan
        owner_role: reviewer
        template: artifact-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: markdown
        required: true
        path_hint: .pf/artifacts/test-plan.md
      -
        id: test-cases
        title: Test Cases
        owner_role: reviewer
        template: artifact-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: markdown
        required: true
        path_hint: .pf/artifacts/test-cases.md
      -
        id: test-report
        title: Test Report
        owner_role: reviewer
        template: validation-report-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: markdown
        required: true
        path_hint: .pf/artifacts/test-report.md
      -
        id: browser-verification-report
        title: Browser Verification Report
        owner_role: reviewer
        template: validation-report-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: markdown
        required: false
        required_when: UI or browser behavior changed.
        not_applicable_requires:
          - reason
          - evidence
        path_hint: .pf/artifacts/browser-verification-report.md
      -
        id: release-notes
        title: Release Notes
        owner_role: reviewer
        template: artifact-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: markdown
        required: false
        required_when: A delivery or release is requested or produced.
        not_applicable_requires:
          - reason
          - evidence
        path_hint: .pf/artifacts/release-notes.md
      -
        id: migration-notes
        title: Migration Notes
        owner_role: reviewer
        template: artifact-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: markdown
        required: false
        required_when: Change has compatibility, data, install, or upgrade implications.
        not_applicable_requires:
          - reason
          - evidence
        path_hint: .pf/artifacts/migration-notes.md
      -
        id: patch
        title: Patch
        owner_role: developer
        template: artifact-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: file
        required: false
        required_when: Operator requests a patch artifact or release package evidence.
        not_applicable_requires:
          - reason
          - evidence
        path_hint: .pf/artifacts/patch
      -
        id: delivery-plan
        title: Delivery Plan
        owner_role: reviewer
        template: artifact-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: markdown
        required: false
        required_when: Delivery/build profile exists or release delivery is requested.
        not_applicable_requires:
          - reason
          - evidence
        path_hint: .pf/artifacts/delivery-plan.md
      -
        id: delivery-report
        title: Delivery Report
        owner_role: reviewer
        template: validation-report-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: markdown
        required: false
        required_when: Delivery/build profile runs or release delivery is requested.
        not_applicable_requires:
          - reason
          - evidence
        path_hint: .pf/artifacts/delivery-report.md
      -
        id: evolution-report
        title: Evolution Report
        owner_role: orchestrator
        template: artifact-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: markdown
        required: true
        not_applicable_requires:
          - reason
          - evidence
        path_hint: .pf/artifacts/evolve/evolution-report.md
      -
        id: updated-rules-or-extensions
        title: Updated Rules Or Extensions
        owner_role: orchestrator
        template: artifact-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: markdown
        required: false
        required_when: The run discovers reusable rule, template, check, or extension changes.
        not_applicable_requires:
          - reason
          - evidence
        path_hint: .pf/artifacts/updated-rules-or-extensions.md
      -
        id: instruction-update-proposal
        title: Instruction Update Proposal
        owner_role: orchestrator
        template: artifact-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: markdown
        required: false
        required_when: The run discovers agent instruction changes.
        not_applicable_requires:
          - reason
          - evidence
        path_hint: .pf/artifacts/instruction-update-proposal.md
      -
        id: knowledge-update-proposal
        title: Knowledge Update Proposal
        owner_role: orchestrator
        template: artifact-template
        lifecycle:
          - draft
          - ready_for_review
          - approved
        type: markdown
        required: false
        required_when: The run discovers reusable knowledge package changes.
        not_applicable_requires:
          - reason
          - evidence
        path_hint: .pf/artifacts/knowledge-update-proposal.md
    gates:
      -
        id: context-ready
        description: Assignment, run/task ids, context snapshot status, coordination mode, lifecycle mode, and delivery profile availability are explicit.
        blocking: true
        type: checklist
        required: true
      -
        id: scope-accepted
        description: Goal, boundaries, non-goals, acceptance criteria, risks, unknowns, and release/delivery need are accepted.
        blocking: true
        type: checklist
        required: true
      -
        id: investigation-complete
        description: Existing code, configs, tests, docs, compatibility, and evidence paths were inspected.
        blocking: true
        type: checklist
        required: true
      -
        id: impact-understood
        description: Affected areas, backward compatibility, migration risk, and regression risk are recorded.
        blocking: true
        type: checklist
        required: true
      -
        id: domain-rules-captured
        description: Domain terms, rules, and platform constraints from project context are captured without hardcoding platform behavior in the core process.
        blocking: true
        type: checklist
        required: true
      -
        id: architecture-plan-ready
        description: Architecture, implementation plan, decision log, verification outline, and rollback/migration concerns are ready.
        blocking: true
        type: checklist
        required: true
      -
        id: implementation-scope-respected
        description: Changes are bounded to approved scope and changed-files/change-summary are recorded.
        blocking: true
        type: checklist
        required: true
      -
        id: assurance-complete
        description: Review, tests, test report, and conditional browser/UI verification evidence are complete.
        blocking: true
        type: checklist
        required: true
      -
        id: release-readiness-decided
        description: Release delivery is either completed or explicitly recorded as not_applicable with reason and evidence.
        blocking: true
        type: decision
        required: true
        not_applicable_example:
          gate_id: release-readiness-decided
          status: not_applicable
          reason: Task changes are local development only; no release requested.
          evidence:
            - scope
            - test-report
      -
        id: delivery-profile-run-or-skipped-with-reason
        description: Delivery/build profile ran and wrote evidence, or no profile/release need was recorded with reason and evidence.
        blocking: true
        type: decision
        required: true
      -
        id: evolution-captured
        description: Lessons learned and reusable update proposals are captured, or evolve is recorded as not_applicable with reason and evidence.
        blocking: true
        type: decision
        required: true
    required_packages:
      - process-forge-core
      - processforge.official.software-development
    required_templates:
      - assignment-template
      - artifact-template
      - review-template
      - handoff-template
    allowed_tools:
      - repository_symbol_analysis
      - test_runner
      - validator
      - processforge-cli
    forbidden_actions:
      - edit_outside_assignment_scope
      - skip_required_review
      - use_delivery_profile_as_process_id
      - create_platform_specific_delivery_process_in_public_core
    evolve:
      enabled: true
      mode: optional
      timing: end_of_run
      default_scope: project
      candidate_targets:
        - knowledge_package
        - delivery_profile
        - process_definition
        - project_rule
        - platform_contract
      extraction_hints:
        - Split candidates when an observation contains project-specific and platform-general parts.
        - Default to the narrowest safe scope and require evidence before parent-platform promotion.
        - reusable rule
        - missing knowledge
        - Split build-command or release-operation findings into delivery_profile candidates.
        - Split process-flow findings into process_definition candidates.
        - Split project-only constraints into project_rule candidates.
        - Route platform constraints to platform_contract only with explicit applicability.
        - Do not promote child-platform observations to a parent platform without reviewed evidence.
      candidate_targeting:
        default_scope: project
        require_applicability: true
        require_target: true
        default_to_narrowest_scope: true
      required_outputs:
        - evolution-report
      privacy:
        default_sensitivity: internal
        export_requires_sanitization: true
        allow_private_paths: false
      apply_policy:
        auto_apply_global: false
        create_candidates_only: true
    evolution_policy:
      active_run_upgrade:
        default: manual_only
      protected_artifacts:
        - scope
        - implementation-plan
        - test-report
      safe_changes:
        - add_optional_artifact
        - add_non_blocking_gate
        - add_delivery_profile_adapter
      blocked_changes:
        - remove_existing_artifact_definition
        - change_approved_artifact_meaning
        - hardcode_platform_delivery_in_core_process
      requires_approval:
        - add_required_gate
        - change_exit_criteria
    catalog:
      classification: PUBLIC_STABLE
      public_surface: true
      strict_contract: true
    public_surface: true
    execution_mode: single_agent
    coordination_requirements:
      mode: simple_allowed
      director_inbox:
        required: false
        optional: false
      error_workflow:
        mode: none
      simple_mode_behavior: disable_director_features
    error_handling:
      enabled: false
      mode: none
      fallback_if_no_director: needs_operator
    responsibility_boundaries:
      operator:
