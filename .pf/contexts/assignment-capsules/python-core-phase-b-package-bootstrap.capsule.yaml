assignment:
  id: python-core-phase-b-package-bootstrap
  path: .pf/assignments/python-core-phase-b-package-bootstrap.yaml
  status: open
  objective: Implement the reviewed Phase B foundation behavior-preservingly. Add src/processforge_core package shell and stdlib-only bootstrap module. Replace duplicated local runtime/core bootstrap in tools/pf_runtime/mcp_server.py and tools/pf_runtime/codex_hooks.py with the smallest necessary first-load shim that loads bootstrap.py, then use bootstrap_runtime(__file__). Bootstrap must centralize tools importability, load and reuse exactly one legacy tools/processforge.py module object, protect processforge module identity, and load pf_runtime.host/service only as normal package modules. Add a focused executable smoke check. Do not modify tools/processforge.py, bin/pf.py, host.py, service.py, compatibility logic, Process Definition semantics, event/work-state, transport, or worker lifecycle. Run the characterization checks and provide a separate report.
  execution_mode:
    kind: implementation
    code_changes_allowed: true
    artifact_changes_allowed: true
    requires_review: true
