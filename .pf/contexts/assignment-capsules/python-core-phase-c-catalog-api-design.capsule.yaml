assignment:
  id: python-core-phase-c-catalog-api-design
  path: .pf/assignments/python-core-phase-c-catalog-api-design.yaml
  status: open
  objective: 'Using the Phase C inventory, produce a precise behavior-preserving design for the smallest first Process Definition API extraction. Correct the inventory''s over-broad recommendation: do not move host payloads, MCP tool mapping, hooks, validation, authoring, routes, handoff, event/work-state, or service transport. Specify exact Python module/package files, public functions/models, legacy wrappers, dependency injection or callback boundaries needed to avoid importing the monolith from canonical Core, characterization tests, and a migration sequence that makes both CLI and runtime host use the same catalog API. Explain whether this first cut must include any helper functions and why. Do not edit product code.'
  execution_mode:
    kind: planning_only
    code_changes_allowed: false
    artifact_changes_allowed: true
    requires_review: true
