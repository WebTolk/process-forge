assignment:
  id: central-ingress-conversation-completeness-correction-20260815
  path: .pf/assignments/central-ingress-conversation-completeness-correction-20260815.yaml
  status: open
  objective: 'Planning only, correction of two existing designs. Make the requirement precise: all actual correspondence that PF or a provider technically receives must enter central ingress as ordered durable private conversation records; telemetry is separate. Resolve the missing PF-owned input-side record before Codex worker execution, without misclassifying the full generated capsule/system instructions as a human user message. Define the exact canonical message sources and roles, pairing/order/dedup identity, raw envelope and privacy boundaries, and explicit limits for generic Codex hooks whose assistant body is unavailable. Produce a concrete revised first implementation slice and focused acceptance. Do not edit source.'
  execution_mode:
    kind: planning_only
    code_changes_allowed: false
    artifact_changes_allowed: true
    requires_review: true
