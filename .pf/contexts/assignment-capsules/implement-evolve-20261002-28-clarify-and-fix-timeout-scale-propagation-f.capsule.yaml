process_execution:
  process_id: software-feature-development
  process_version: 1.1.0
  process_fingerprint: 'sha256:cc411028e9585dd8f56e07faa8997d9e7af1a39a801a0d8c0ca9c8c1e89dfd49'
  process_source: 'catalog:software-feature-development'
  snapshot_id: ctx-20261002-060156-86cbed
  snapshot_checksum: 'sha256:c0cc71edb3f7ea9b97c2a2571d95b3c8ef7f67b188a476d7a29451193545c2a0'
  definition:
    schema_version: 1
    id: software-feature-development
    name: Software Feature Development
    version: 1.1.0
    status: active
    description: Guides software work from orchestration and intake through investigation, domain understanding, architecture, implementation, assurance, release delivery, and evolution capture. Release and evolution stages may be completed as not_applicable with evidence when the task does not require delivery.
    required_capabilities:
      - repository_read
      - repository_write
      - test_running
      - review
    metadata:
      lifecycle_modes:
        full:
          description: Full software lifecycle from intake to evolve.
          release_delivery_required: true
          evolve_required: true
        feature:
          description: Feature development with investigation, architecture, implementation, assurance, and optional release/evolve.
          release_delivery_required: conditional
          evolve_required: conditional
        bug_fix:
          description: Focused fix with investigation, impact analysis, implementation, regression assurance, and optional release notes.
          release_delivery_required: conditional
          evolve_required: conditional
        debug_loop:
          description: Investigation and repeated implementation/assurance loop; release/evolve optional.
          release_delivery_required: false
          evolve_required: conditional
        implementation_only:
          description: Allowed only when intake, investigation, and architecture artifacts already exist or are explicitly provided as inputs.
          requires_existing_inputs:
            - scope
            - investigation-report
            - implementation-plan
          release_delivery_required: false
          evolve_required: conditional
      compact_mode:
        allowed: true
        rule: Optional stages must be recorded as not_applicable with reason and evidence; they must not be silently skipped.
      lifecycle_stage_order:
        - orchestration
        - intake-scope
        - investigation
        - domain-modeling
        - architecture-plan
        - implementation
        - code-assurance
        - release-delivery
        - evolve
      legacy_webtolk_mapping:
        orchestration: orchestration
        intake: intake-scope
        investigation: investigation
        domain: domain-modeling
        architecture: architecture-plan
        implementation: implementation
        assurance: code-assurance
        release: release-delivery
        evolve: evolve
        delivery-build-runner: delivery-build-profile
      delivery_profile_boundary:
        rule: Delivery/build/package/install is an operation profile used inside assurance or release-delivery, not a separate process id.
        process_id_forbidden_examples:
          - platform-plugin-delivery
          - platform-extension-delivery
          - plugin-delivery
          - package-delivery
        preferred_shape:
          process_id: software-feature-development
          execution_profile:
            delivery_profile: project.default_delivery
    hooks:
      emit:
        -
          event: process.started
          required: true
        -
          event: stage.started
          required: true
        -
          event: stage.completed
          required: true
        -
          event: assignment.created
          required: true
        -
          event: artifact.created
          required: true
        -
          event: gate.failed
          required: true
        -
          event: chat.message.recorded
          required: false
      subscriptions:
        -
          event: assignment.completed
          actions:
            -
              type: create_review_request
        -
          event: gate.failed
          actions:
            -
              type: block_stage
            -
              type: notify_orchestrator
      tracking:
        include:
          - process_id
          - process_version
          - stage_id
          - assignment_id
          - artifact_refs
          - actor
          - session_id
          - status
    roles:
      -
        id: orchestrator
        title: Orchestrator
        responsibility: Coordinates lifecycle mode, scope, planning, gates, and handoffs.
        kind: primary_agent
        responsibilities:
          - Coordinates lifecycle mode, scope, planning, gates, and handoffs.
      -
        id: developer
        title: Developer
        responsibility: Implements the approved change inside the allowed scope.
        kind: primary_agent
        responsibilities:
          - Implements the approved change inside the allowed scope.
      -
        id: reviewer
        title: Reviewer
        responsibility: Reviews behavior, risks, verification evidence, and release readiness.
        kind: primary_agent
        responsibilities:
          - Reviews behavior, risks, verification evidence, and release readiness.
    stages:
      -
        id: orchestration
        title: Orchestration
        description: Prepare execution context, lifecycle mode, coordination mode, run/task ids, context snapshot, and available delivery/build profile.
        required_inputs:
          []
        produced_artifacts:
          - task-record
          - execution-context-summary
          - lifecycle-mode-decision
        required_role: orchestrator
        required_capabilities:
          - process_coordination
        allowed_tools:
          - processforge-cli
        entry_gates:
          []
        exit_gates:
          - context-ready
        goal: Prepare execution context and select lifecycle mode before scope work starts.
        actor: primary_agent
        gates:
          - context-ready
      -
        id: intake-scope
        title: Intake And Scope
        description: Capture objective, boundaries, non-goals, acceptance criteria, risks, unknowns, and release/delivery requirement.
        required_inputs:
          - execution-context-summary
          - lifecycle-mode-decision
        produced_artifacts:
          - brief
          - scope
          - task-record
        required_role: orchestrator
        required_capabilities:
          - process_coordination
        allowed_tools:
          - processforge-cli
        entry_gates:
          - context-ready
        exit_gates:
          - scope-accepted
        goal: Establish accepted scope and delivery expectations.
        actor: primary_agent
        gates:
          - scope-accepted
      -
        id: investigation
        title: Investigation
        description: Inspect existing code, affected areas, configs, tests, docs, compatibility, migration risk, and evidence paths.
        required_inputs:
          - scope
        produced_artifacts:
          - investigation-report
          - impact-analysis
        required_role: orchestrator
        required_capabilities:
          - repository_read
        allowed_tools:
          - repository_symbol_analysis
          - validator
        entry_gates:
          - scope-accepted
        exit_gates:
          - investigation-complete
          - impact-understood
        goal: Understand the existing system before architecture or edits.
        actor: primary_agent
        gates:
          - investigation-complete
          - impact-understood
      -
        id: domain-modeling
        title: Domain Modeling
        description: Capture domain terms, rules, constraints, and platform/framework rules from project context and platform contracts.
        required_inputs:
          - investigation-report
          - impact-analysis
        produced_artifacts:
          - domain-notes
          - domain-model
          - domain-rules
        required_role: orchestrator
        required_capabilities:
          - repository_read
        allowed_tools:
          - processforge-cli
          - repository_symbol_analysis
        entry_gates:
          - investigation-complete
          - impact-understood
        exit_gates:
          - domain-rules-captured
        goal: Record domain understanding without hardcoding platform-specific rules into the core process.
        actor: primary_agent
        gates:
          - domain-rules-captured
      -
        id: architecture-plan
        title: Architecture Plan
        description: Choose approach, file/module plan, verification outline, trade-offs, rollback, and migration concerns.
        required_inputs:
          - domain-rules
        produced_artifacts:
          - architecture
          - implementation-plan
          - decision-log
        required_role: orchestrator
        required_capabilities:
          - architecture
        allowed_tools:
          - repository_symbol_analysis
          - validator
        entry_gates:
          - domain-rules-captured
        exit_gates:
          - architecture-plan-ready
        goal: Approve a bounded implementation plan before edits.
        actor: primary_agent
        gates:
          - architecture-plan-ready
      -
        id: implementation
        title: Implementation
        description: Make bounded changes, preserve unrelated files, collect evidence, and update decisions when the plan changes.
        required_inputs:
          - implementation-plan
        produced_artifacts:
          - changed-files
          - change-summary
        required_role: developer
        required_capabilities:
          - repository_write
        allowed_tools:
          - editor
          - test_runner
        hooks:
          emit:
            -
              event: tool.invoked
            -
              event: artifact.created
            -
              event: artifact.updated
          stop_gates:
            -
              event: session.ended
              require:
                - gate.passed
        entry_gates:
          - architecture-plan-ready
        exit_gates:
          - implementation-scope-respected
        goal: Implement only the approved change and record changed files.
        actor: primary_agent
        gates:
          - implementation-scope-respected
      -
        id: code-assurance
        title: Code Assurance
        description: Review behavior, risks, static checks, tests, browser/UI verification when applicable, regressions, and known limitations.
        required_inputs:
          - change-summary
        produced_artifacts:
          - review-findings
          - test-plan
          - test-cases
          - test-report
          - browser-verification-report
        required_role: reviewer
        required_capabilities:
          - review
          - test_running
        allowed_tools:
          - test_runner
          - validator
        entry_gates:
          - implementation-scope-respected
        exit_gates:
          - assurance-complete
        goal: Verify the change and explicitly record browser/UI verification as applicable or not_applicable.
        actor: primary_agent
        gates:
          - assurance-complete
      -
        id: release-delivery
        title: Release Delivery
        description: Decide release readiness, prepare package or patch when requested, run delivery/build profile when configured, and record release evidence or not_applicable reason.
        required_inputs:
          - test-report
        produced_artifacts:
          - release-notes
          - migration-notes
          - patch
          - delivery-plan
          - delivery-report
        required_role: reviewer
        required_capabilities:
          - test_running
        allowed_tools:
          - test_runner
          - validator
          - processforge-cli
        entry_gates:
          - assurance-complete
        exit_gates:
          - release-readiness-decided
          - delivery-profile-run-or-skipped-with-reason
        goal: Treat delivery/build/package/install as an operation profile, not a separate process.
        actor: primary_agent
        conditional: true
        not_applicable_policy:
          required: true
          evidence_fields:
            - status
            - reason
            - evidence
        gates:
          - release-readiness-decided
          - delivery-profile-run-or-skipped-with-reason
      -
        id: evolve
        title: Evolve
        description: Capture lessons learned and propose updates to rules, templates, knowledge packages, checks, delivery profiles, or agent instructions.
        required_inputs:
          - delivery-report
        produced_artifacts:
          - evolution-report
          - updated-rules-or-extensions
          - instruction-update-proposal
          - knowledge-update-proposal
        required_role: orchestrator
        required_capabilities:
          - review
        allowed_tools:
          - processforge-cli
          - validator
        entry_gates:
          - release-readiness-decided
        exit_gates:
          - evolution-captured
        goal: Capture evolution learning or explicit not_applicable evidence before run completion.
        actor: primary_agent
        conditional: true
        not_applicable_policy:
          required: true
          evidence_fields:
            - status
            - reason
            - evidence
        gates:
          - evolution-captured
    artifact_definitions:
      -
