schema_version: 1
root_env: PF_REPO_ROOT
suites:
  supervisor-stress:
    description: Detached shell workers, heartbeat, final drain, and lost-process regressions.
    tests:
      - smoke_supervisor_final_drain
      - smoke_process_supervisor_lifecycle
      - smoke_process_supervisor
      - smoke_shell_launched_agents_supervisor_fix
      - smoke_shell_agent_heartbeat_contract
      - smoke_full_shell_agents_supervisor
  dev-contract:
    description: Internal authoring, resource, update, platform, and lifecycle contract smokes.
    tests:
      - smoke_resource_management
      - smoke_resource_authoring_processes
      - smoke_update_framework_readonly
      - smoke_update_framework_validation
      - smoke_guided_workplace_setup
      - smoke_multiagent_orchestration_process
      - smoke_multiagent_assignment_contract
      - smoke_worker_run_manual
      - smoke_worker_run_lifecycle
      - smoke_manifest_driven_platforms
      - smoke_platform_inheritance
      - smoke_process_authoring
      - smoke_authoring_parity
tests:
  smoke_supervisor_final_drain:
    script: scripts/smoke_supervisor_final_drain.py
    layer: dogfooding
    timeout_seconds: 180
