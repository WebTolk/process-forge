schema_version: 1
process:
  id: mcp-register
  name: MCP Register
  version: 1.0.0
  status: active
  kind: process
  scope: project
  description: Register an MCP capability provider through proposal, transport/config definition, registry update, and review.
  purpose: Register an MCP capability provider through proposal, transport/config definition, registry update, and review.
run_model:

roles:
  -
    id: maintainer
    title: Maintainer
    responsibility: Resolves capability, transport, command, auth reference, and registry entry.
stages:
  -
    id: intake
    title: Intake
    description: Capture MCP id, capability, transport, command, status, and auth reference name.
    required_inputs:
      []
    produced_artifacts:
      - mcp-registration-request
    required_role: maintainer
    required_capabilities:
      - markdown_editing
    allowed_tools:
      []
    entry_gates:
      []
    exit_gates:
      - request-complete
    handoff_required: false
  -
    id: registry-update
    title: Registry Update
    description: Update registries/mcp.yaml without storing secrets.
    required_inputs:
      - mcp-registration-request
    produced_artifacts:
      - mcp-definition
      - validation-report
      - review
    required_role: maintainer
    required_capabilities:
      - repository_write
    allowed_tools:
      - processforge-cli
    entry_gates:
      - request-complete
    exit_gates:
      - mcp-reviewed
    handoff_required: true
artifacts:
  -
    id: mcp-definition
    title: MCP Definition
    owner_role: maintainer
    template: mcp-definition
    lifecycle:
      - draft
      - ready_for_review
      - approved
gates:
  -
    id: request-complete
    description: MCP id, capability, command, transport, and auth reference are explicit.
    blocking: true
  -
    id: mcp-reviewed
    description: Registry entry contains no secrets and transport constraints are documented.
    blocking: true
required_capabilities:
  - repository_write
required_packages:
  - process-forge-core
required_templates:
  - mcp-definition.yaml
allowed_tools:
  - processforge-cli
forbidden_actions:
  - store_secret_values
hooks:
  emit:
    -
      event: mcp.registered
      required: true
    -
      event: mcp.healthcheck.passed
      required: false
    -
      event: mcp.healthcheck.failed
      required: false
evolution_policy:
  active_run_upgrade:
    default: manual_only
  protected_artifacts:
    - review
  safe_changes:
    - add_optional_mcp
  blocked_changes:
    - store_secret_in_command
