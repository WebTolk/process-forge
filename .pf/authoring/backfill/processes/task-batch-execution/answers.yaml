schema_version: 1
process:
  id: task-batch-execution
  name: Task Batch Execution
  version: 0.1.0
  status: active
  kind: process
  scope: project
  description: Execute a group of tasks inside one run/work session with repeated work, debug, fix, review, and handoff iterations.
  purpose: Execute a group of tasks inside one run/work session with repeated work, debug, fix, review, and handoff iterations.
run_model:

roles:
  -
    id: run-coordinator
    title: Run Coordinator
    responsibility: Creates the run, keeps the task index coherent, and writes final summary and handoff.
  -
    id: task-worker
    title: Task Worker
    responsibility: Executes task iterations and records results.
  -
    id: reviewer
    title: Reviewer
    responsibility: Checks run consistency and residual risks before completion.
stages:
  -
    id: run-intake
    title: Create or inspect run
    description: Create the run or inspect an existing active run.
    required_inputs:
      []
    produced_artifacts:
      - run-record
    required_role: run-coordinator
    required_capabilities:
      - process_coordination
    allowed_tools:
      - processforge-cli
    entry_gates:
      []
    exit_gates:
      - run-has-context
    handoff_required: false
  -
    id: task-planning
    title: Create or collect tasks
    description: Create assignment-backed tasks and attach them to the run.
    required_inputs:
      - run-record
    produced_artifacts:
      - task-index
    required_role: run-coordinator
    required_capabilities:
      - process_coordination
    allowed_tools:
      - processforge-cli
    entry_gates:
      - run-has-context
    exit_gates:
      - run-has-tasks
    handoff_required: false
  -
    id: task-execution-loop
    title: Execute task iterations
    description: Record work, debug, fix, review, test, research, handoff, or note iterations for each task.
    required_inputs:
      - task-index
    produced_artifacts:
      - task-iteration-log
    required_role: task-worker
    required_capabilities:
      - repository_read
    allowed_tools:
      - processforge-cli
      - test_runner
    entry_gates:
      - run-has-tasks
    exit_gates:
      - task-results-recorded
    handoff_required: false
  -
    id: task-result-fixation
    title: Fix task results
    description: Complete each task with a result summary or result artifact.
    required_inputs:
      - task-iteration-log
    produced_artifacts:
      - task-result
    required_role: task-worker
    required_capabilities:
      - reporting
    allowed_tools:
      - processforge-cli
    entry_gates:
      - task-results-recorded
    exit_gates:
      - all-blocking-tasks-completed
    handoff_required: false
  -
    id: run-review
    title: Review run results
    description: Run run-doctor and task-doctor checks before final completion.
    required_inputs:
      - task-result
    produced_artifacts:
      - run-review
    required_role: reviewer
    required_capabilities:
      - artifact_review
    allowed_tools:
      - processforge-cli
    entry_gates:
      - all-blocking-tasks-completed
    exit_gates:
      - run-doctor-passed
    handoff_required: false
  -
    id: run-summary
    title: Create final run summary and handoff
    description: Aggregate task results into a run summary and handoff.
    required_inputs:
      - run-review
    produced_artifacts:
      - run-summary
      - run-handoff
    required_role: run-coordinator
    required_capabilities:
      - reporting
    allowed_tools:
      - processforge-cli
    entry_gates:
      - run-doctor-passed
    exit_gates:
      - run-summary-created
    handoff_required: true
artifacts:
  -
    id: run-record
    title: Run Record
    owner_role: run-coordinator
    template: run
    lifecycle:
      - draft
      - ready_for_review
      - approved
  -
    id: task-index
    title: Task Index
    owner_role: run-coordinator
    template: artifact-template
    lifecycle:
      - draft
      - ready_for_review
      - approved
  -
    id: task-iteration-log
    title: Task Iteration Log
    owner_role: task-worker
    template: iteration
    lifecycle:
      - draft
      - ready_for_review
      - approved
  -
    id: task-result
    title: Task Result
    owner_role: task-worker
    template: assignment-task
    lifecycle:
      - draft
      - ready_for_review
      - approved
  -
    id: run-review
    title: Run Review
    owner_role: reviewer
    template: review-template
    lifecycle:
      - draft
      - ready_for_review
      - approved
  -
    id: run-summary
    title: Run Summary
    owner_role: run-coordinator
    template: validation-report-template
    lifecycle:
      - draft
      - ready_for_review
      - approved
  -
    id: run-handoff
    title: Run Handoff
    owner_role: run-coordinator
    template: handoff-template
    lifecycle:
      - draft
      - ready_for_review
      - approved
gates:
  -
    id: run-has-context
    description: Run has title, objective, process id, and public-safe scope.
    blocking: true
  -
    id: run-has-tasks
    description: Run contains at least one assignment-backed task.
    blocking: true
  -
    id: task-results-recorded
    description: Each task has iterations and a result placeholder.
    blocking: true
  -
    id: all-blocking-tasks-completed
    description: All blocking tasks are done before run completion.
    blocking: true
  -
    id: run-doctor-passed
    description: run-doctor reports no failures.
    blocking: true
  -
    id: run-summary-created
    description: Run summary and handoff exist.
    blocking: true
required_capabilities:
  - process_coordination
  - repository_read
  - reporting
required_packages:
  - process-forge-core
required_templates:
  - run
  - assignment-task
  - iteration
  - review-template
  - handoff-template
allowed_tools:
  - processforge-cli
  - test_runner
  - validator
forbidden_actions:
  - create_background_runner
  - claim_task_without_assignment_record
  - write_private_absolute_paths_to_public_files
hooks:
  emit:
    -
      event: run.created
      required: true
    -
      event: task.created
      required: true
    -
      event: task.started
      required: true
    -
      event: iteration.added
      required: true
    -
      event: iteration.completed
      required: true
    -
      event: task.completed
      required: true
    -
      event: run.summary.created
      required: true
    -
      event: run.completed
      required: true
  subscriptions:
    -
      event: task.completed
      actions:
        -
          type: refresh_task_index
    -
      event: run.completed
      actions:
        -
          type: create_handoff
  tracking:
    include:
      - run_id
      - task_id
      - iteration_id
      - process_id
      - assignment_id
      - artifact_refs
      - actor
      - status
evolution_policy:
  active_run_upgrade:
    default: manual_only
  protected_artifacts:
    - run-summary
    - run-handoff
  safe_changes:
    - add_optional_iteration_kind
    - add_non_blocking_gate
  blocked_changes:
    - add_file_locks_to_mvp
    - add_background_watcher_to_mvp
  requires_approval:
    - change_task_status_model
