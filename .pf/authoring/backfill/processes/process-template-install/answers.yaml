schema_version: 1
process:
  id: process-template-install
  name: Process Template Install
  version: 1.0.0
  status: active
  kind: process
  scope: project
  description: Add a reusable process definition template with artifact, gate, resource, and validation mapping.
  purpose: Add a reusable process definition template with artifact, gate, resource, and validation mapping.
run_model:

roles:
  -
    id: maintainer
    title: Maintainer
    responsibility: Classifies process, writes process definition, maps templates/resources, and validates.
stages:
  -
    id: intake
    title: Intake
    description: Capture process purpose, scope, stages, artifacts, gates, and resources.
    required_inputs:
      []
    produced_artifacts:
      - process-template-request
    required_role: maintainer
    required_capabilities:
      - markdown_editing
    allowed_tools:
      []
    entry_gates:
      []
    exit_gates:
      - request-complete
    handoff_required: false
  -
    id: process-definition-creation
    title: Process Definition Creation
    description: Create process definition and validate it against schema.
    required_inputs:
      - process-template-request
    produced_artifacts:
      - process-definition
      - validation-report
      - review
    required_role: maintainer
    required_capabilities:
      - repository_write
    allowed_tools:
      - validator
    entry_gates:
      - request-complete
    exit_gates:
      - process-reviewed
    handoff_required: true
artifacts:
  -
    id: process-definition
    title: Process Definition
    owner_role: maintainer
    template: process-definition-template
    lifecycle:
      - draft
      - ready_for_review
      - approved
gates:
  -
    id: request-complete
    description: Process purpose and boundaries are explicit.
    blocking: true
  -
    id: process-reviewed
    description: Process schema, artifacts, gates, and resource mapping are validated.
    blocking: true
required_capabilities:
  - repository_write
  - schema_validation
required_packages:
  - process-forge-core
required_templates:
  - process-definition-template
allowed_tools:
  - validator
forbidden_actions:
  - create_runner_dependency
hooks:
  emit:
    -
      event: artifact.created
      required: true
evolution_policy:
  active_run_upgrade:
    default: manual_only
  protected_artifacts:
    - review
  safe_changes:
    - add_optional_stage
  blocked_changes:
    - make_runner_required
