schema_version: 1

process_forge:
  version: 0.1.0-rc.1
  version_constraint: "^0.1"
  mode: file_only
  install_mode: linked
  distribution:
    id: processforge
    source: project
  runner_required: false
  backend_required: false

project:
  id: process-forge
  name: ProcessForge
  description: File-first process system for governed repeatable workflows.

workplace:
  reference: auto
  required_capabilities:
    - repository_read
    - markdown_editing
    - schema_validation
  optional_capabilities:
    - repository_symbol_analysis
    - official_documentation_lookup
    - browser_verification

paths:
  docs: ../docs
  schemas: ../schemas
  processes: ../processes
  packages: ../packages
  templates: ../templates
  examples: ../examples
  assignments: assignments
  artifacts: artifacts
  contexts: contexts
  logs: logs
  handoffs: handoffs
  reviews: reviews
  adr: adr
  tools: ../tools
  hooks: hooks.yaml
  runtime: runtime
  chat: runtime/chat

merge:
  order:
    - core
    - workplace
    - organization
    - direction
    - specialization
    - platform
    - toolchain
    - project
    - process
    - stage
    - task
    - agent_profile
  conflict_policy: block_on_locked_policy_conflict

policies:
  one_writer_per_file_scope: true
  approved_artifacts_are_protected: true
  execution_context_is_immutable: true
  process_versions_are_immutable: true
  public_files_exclude_private_paths: true
  runner_is_optional: true
  backend_is_optional: true

status_model:
  artifact:
    - missing
    - draft
    - ready_for_review
    - approved
    - rejected
    - stale
    - superseded
    - archived
  review:
    - pass
    - pass_with_conditions
    - warn
    - fail
    - skipped
  upgrade_assessment:
    - safe
    - requires_approval
    - requires_migration
    - blocked

processes:
  - id: software-feature-development
    path: ../processes/software-feature-development.yaml
  - id: bug-fix
    path: ../processes/bug-fix.yaml
  - id: testing
    path: ../processes/testing.yaml
  - id: content-production
    path: ../processes/content-production.yaml
  - id: knowledge-package-improvement
    path: ../processes/knowledge-package-improvement.yaml
  - id: process-version-upgrade
    path: ../processes/process-version-upgrade.yaml
  - id: workplace-initialization
    path: ../processes/workplace-initialization.yaml
  - id: project-onboarding
    path: ../processes/project-onboarding.yaml
  - id: project-initialization
    path: ../processes/project-initialization.yaml
  - id: session-bootstrap
    path: ../processes/session-bootstrap.yaml
  - id: context-resolution
    path: ../processes/context-resolution.yaml
  - id: processforge-update-check
    path: ../processes/processforge-update-check.yaml
  - id: knowledge-resource-add
    path: ../processes/knowledge-resource-add.yaml
  - id: documentation-mirror-import
    path: ../processes/documentation-mirror-import.yaml
  - id: knowledge-package-update
    path: ../processes/knowledge-package-update.yaml
  - id: template-add
    path: ../processes/template-add.yaml
  - id: tool-register
    path: ../processes/tool-register.yaml
  - id: mcp-register
    path: ../processes/mcp-register.yaml
  - id: platform-contract-install
    path: ../processes/platform-contract-install.yaml
  - id: process-template-install
    path: ../processes/process-template-install.yaml
  - id: reusable-template-authoring
    path: ../processes/reusable-template-authoring.yaml
  - id: knowledge-package-authoring
    path: ../processes/knowledge-package-authoring.yaml
  - id: platform-contract-authoring
    path: ../processes/platform-contract-authoring.yaml
  - id: process-authoring
    path: ../processes/process-authoring.yaml
  - id: authoring-parity-audit
    path: ../processes/authoring-parity-audit.yaml
  - id: task-batch-execution
    path: ../processes/task-batch-execution.yaml

knowledge_stack:
  - id: processforge.core
    version: "^0.1"
    source: distribution
    distribution: processforge
  - id: project.process-forge
    version: "0.1.0"
    source: project

packages:
  - id: process-forge-core
    path: ../packages/process-forge-core.yaml
  - id: process-forge-software-development
    path: ../packages/process-forge-software-development.yaml
  - id: process-forge-content
    path: ../packages/process-forge-content.yaml
  - id: process-forge-testing
    path: ../packages/process-forge-testing.yaml
  - id: process-forge-knowledge-governance
    path: ../packages/process-forge-knowledge-governance.yaml

validation:
  scripts:
    - id: schema-validation
      command: python tools/validate-process-forge-schemas.py
    - id: checksum-inventory
      command: python tools/validate-process-forge-checksums.py
    - id: public-cleanliness
      command: python tools/validate-public-cleanliness.py
    - id: processforge-cli
      command: python tools/processforge.py --help
    - id: doctor-context
      command: python tools/processforge.py doctor-context --project-root .
