schema_version: 1

process_forge:
  version: 1.1.0
  version_constraint: "^1.0"
  mode: file_only
  install_mode: linked
  distribution:
    id: processforge
    source: project
  runner_required: false
  backend_required: false

project:
  id: process-forge
  name: ProcessForge
  type: processforge-development
  description: File-first process system for governed repeatable workflows.

workplace:
  reference: auto
  required_capabilities:
    - repository_read
    - markdown_editing
    - schema_validation
  optional_capabilities:
    - repository_symbol_analysis
    - official_documentation_lookup
    - browser_verification

paths:
  docs: ../docs
  schemas: ../schemas
  processes: ../processes
  processes_core: ../processes/core
  processes_user: ../processes/user
  processes_custom: ../processes/custom
  packages: ../packages
  templates: ../templates
  examples: ../examples
  assignments: assignments
  artifacts: artifacts
  contexts: contexts
  logs: logs
  handoffs: handoffs
  reviews: reviews
  adr: adr
  tools: ../tools
  hooks: hooks.yaml
  runtime: runtime
  chat: runtime/chat

merge:
  order:
    - core
    - workplace
    - organization
    - direction
    - specialization
    - platform
    - toolchain
    - project
    - process
    - stage
    - task
    - agent_profile
  conflict_policy: block_on_locked_policy_conflict

policies:
  one_writer_per_file_scope: true
  approved_artifacts_are_protected: true
  execution_context_is_immutable: true
  process_versions_are_immutable: true
  public_files_exclude_private_paths: true
  runner_is_optional: true
  backend_is_optional: true

status_model:
  artifact:
    - missing
    - draft
    - ready_for_review
    - approved
    - rejected
    - stale
    - superseded
    - archived
  review:
    - pass
    - pass_with_conditions
    - warn
    - fail
    - skipped
  upgrade_assessment:
    - safe
    - requires_approval
    - requires_migration
    - blocked

processes:
  - id: knowledge-package-improvement
    path: ../processes/core/knowledge-package-improvement.yaml
  - id: process-version-upgrade
    path: ../processes/core/process-version-upgrade.yaml
  - id: workplace-initialization
    path: ../processes/core/workplace-initialization.yaml
  - id: project-onboarding
    path: ../processes/core/project-onboarding.yaml
  - id: project-initialization
    path: ../processes/core/project-initialization.yaml
  - id: session-bootstrap
    path: ../processes/core/session-bootstrap.yaml
  - id: context-resolution
    path: ../processes/core/context-resolution.yaml
  - id: processforge-update-check
    path: ../processes/core/processforge-update-check.yaml
  - id: knowledge-resource-add
    path: ../processes/core/knowledge-resource-add.yaml
  - id: knowledge-package-update
    path: ../processes/core/knowledge-package-update.yaml
  - id: template-add
    path: ../processes/core/template-add.yaml
  - id: tool-register
    path: ../processes/core/tool-register.yaml
  - id: mcp-register
    path: ../processes/core/mcp-register.yaml
  - id: platform-contract-install
    path: ../processes/core/platform-contract-install.yaml
  - id: reusable-template-authoring
    path: ../processes/core/reusable-template-authoring.yaml
  - id: knowledge-package-authoring
    path: ../processes/core/knowledge-package-authoring.yaml
  - id: platform-contract-authoring
    path: ../processes/core/platform-contract-authoring.yaml
  - id: process-authoring
    path: ../processes/core/process-authoring.yaml
  - id: authoring-parity-audit
    path: ../processes/core/authoring-parity-audit.yaml
  - id: task-batch-execution
    path: ../processes/core/task-batch-execution.yaml
  - id: guided-workplace-setup
    path: ../processes/core/guided-workplace-setup.yaml
  - id: multi-agent-task-orchestration
    path: ../processes/core/multi-agent-task-orchestration.yaml
  - id: runtime-driver-registry
    path: ../processes/core/runtime-driver-registry.yaml
  - id: process-supervisor
    path: ../processes/core/process-supervisor.yaml
  - id: agent-director-supervision
    path: ../processes/core/agent-director-supervision.yaml
  - id: orchestrator-shell-agents-supervision
    path: ../processes/core/orchestrator-shell-agents-supervision.yaml

knowledge_stack:
  - id: processforge.core
    version: "^1.0"
    source: distribution
    distribution: processforge
  - id: project.process-forge
    version: "1.1.0"
    source: project

packages:
  - id: process-forge-core
    path: ../packages/process-forge-core.yaml
  - id: process-forge-knowledge-governance
    path: ../packages/process-forge-knowledge-governance.yaml

validation:
  scripts:
    - id: schema-validation
      command: python tools/validate-process-forge-schemas.py
    - id: checksum-inventory
      command: python tools/validate-process-forge-checksums.py
    - id: public-cleanliness
      command: python tools/validate-public-cleanliness.py
    - id: processforge-cli
      command: python tools/processforge.py --help
    - id: doctor-context
      command: python tools/processforge.py doctor-context --project-root .
