schema_version: 1
id: package-example
name: "Example Knowledge Package"
version: "1.0.0"
kind: project
scope: project
package_root: global

resources:
  - id: example-resource
    kind: reference
    title: "Example resource"
    path_ref:
      registry: package_roots
      id: global
      relative_path: package-example/README.md
    load_policy: on_demand
    index_policy: full_text
    description: "Use when the current task needs this package reference."
    versioning:
      mode: multi_version
      version_field: version
      instance_id_template: "{id}@{version}"
    retention:
      policy: keep_versions
      keep_last_n: null
    snapshot_behavior:
      on_new_version: notify_only
      on_current_generation_changed: notify_only
      on_instance_missing: broken
      reproducibility: exact
