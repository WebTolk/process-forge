schema_version: 1

project:
  id: example-project
  name: Example Project
  type: auto
  mode: auto

coordination:
  mode: inherit
  director:
    use_workplace_director: true
    inbox_submit_required: false

required_capabilities:
  - repository.read
  - markdown.editing

optional_capabilities:
  - repository.symbol_analysis
  - official_documentation
  - test_running

context_requirements:
  knowledge_packages: []
  knowledge_resources: []
  template_packages: []
  tools: []
  platform_contracts: []

context_policy:
  on_session_start:
    check_freshness: true
    if_stale: ask_operator
    if_broken: block

policies:
  one_writer_per_file_scope: true
  approved_artifacts_are_protected: true
  execution_context_is_immutable: true
  public_files_must_not_contain_local_absolute_paths: true
