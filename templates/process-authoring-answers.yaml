schema_version: 1
process:
  id: seo-audit
  name: SEO Audit
  version: 0.1.0
  status: draft
  kind: audit
  scope: project
  description: Audit search visibility inputs and produce a prioritized report.
run_model:
  supports_multiple_tasks: true
  default_task_loop:
    enabled: true
    iteration_kinds: [work, debug, review, handoff]
roles:
  - id: auditor
    title: Auditor
    responsibility: Reviews inputs and creates findings.
  - id: reviewer
    title: Reviewer
    responsibility: Validates evidence and recommendations.
stages:
  - id: intake
    title: Intake
    description: Capture site, goals, constraints, and source files.
    required_role: auditor
    produced_artifacts: [audit-brief]
    exit_gates: [audit-brief-approved]
  - id: audit-work
    title: Audit Work
    description: Collect evidence and draft findings.
    required_role: auditor
    required_inputs: [audit-brief]
    produced_artifacts: [audit-report]
    entry_gates: [audit-brief-approved]
    exit_gates: [audit-report-ready]
  - id: review
    title: Review
    description: Check evidence, priority, and portability.
    required_role: reviewer
    required_inputs: [audit-report]
    produced_artifacts: [audit-review]
    entry_gates: [audit-report-ready]
    exit_gates: [audit-review-passed]
  - id: handoff
    title: Handoff
    description: Summarize delivered findings and remaining risks.
    required_role: auditor
    required_inputs: [audit-review]
    produced_artifacts: [audit-handoff]
    entry_gates: [audit-review-passed]
    exit_gates: [audit-handoff-created]
    handoff_required: true
artifacts:
  - id: audit-brief
    title: Audit Brief
    owner_role: auditor
    template: artifact-template
  - id: audit-report
    title: Audit Report
    owner_role: auditor
    template: validation-report-template
  - id: audit-review
    title: Audit Review
    owner_role: reviewer
    template: review-template
  - id: audit-handoff
    title: Audit Handoff
    owner_role: auditor
    template: handoff-template
gates:
  - id: audit-brief-approved
    description: Audit brief names goals, scope, and evidence sources.
    blocking: true
    required_artifact: audit-brief
  - id: audit-report-ready
    description: Audit report contains findings and priorities.
    blocking: true
    required_artifact: audit-report
  - id: audit-review-passed
    description: Review has no blocking failures.
    blocking: true
    required_artifact: audit-review
  - id: audit-handoff-created
    description: Handoff records results and residual risks.
    blocking: true
    required_artifact: audit-handoff
required_capabilities:
  - repository_read
  - reporting
  - artifact_review
required_packages:
  - process-forge-core
required_templates:
  - artifact-template
  - validation-report-template
  - review-template
  - handoff-template
allowed_tools:
  - processforge-cli
  - validator
forbidden_actions:
  - write_private_absolute_paths_to_public_files
  - skip_blocking_review
