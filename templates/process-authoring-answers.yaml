schema_version: 1
process:
  id: quality-audit
  name: Quality Audit
  version: 1.0.0
  status: draft
  kind: audit
  scope: project
  description: Audit project inputs and produce a prioritized quality report.
run_model:
  supports_multiple_tasks: true
  default_task_loop:
    enabled: true
    iteration_kinds: [work, debug, review, handoff]
execution_mode: single_agent
execution_mode_questions:
  single_agent:
    cli_checks:
      - process-doctor
      - run-doctor
      - task-doctor
    required_gates:
      - audit-review-passed
      - audit-handoff-created
    primary_agent_artifacts:
      - audit-report
      - audit-review
      - audit-handoff
    agent_ledger_checkin_checkout: true
    operator_approval_required: true
  single_agent_with_subagents:
    subagents_allowed: false
    allowed_roles: []
    require_subagent_reports: true
    reports_dir: .pf/artifacts/subagents/<task-id>/
  orchestrated_agents:
    worker_roles: []
    director_role: agent-director
    leases_required: true
    supervisor_required_for_runtime_workers: false
  process_factory:
    routes: []
    handoff_modes: []
    required_agent_roles: []
    continuations_required: true
coordination_requirements:
  mode: simple_allowed
  director_inbox:
    required: false
    optional: true
  error_workflow:
    mode: none
  simple_mode_behavior: disable_director_features
error_handling:
  enabled: false
  mode: none
  fallback_if_no_director: needs_operator
roles:
  - id: auditor
    title: Auditor
    responsibility: Reviews inputs and creates findings.
  - id: reviewer
    title: Reviewer
    responsibility: Validates evidence and recommendations.
stages:
  - id: intake
    title: Intake
    description: Capture site, goals, constraints, and source files.
    required_role: auditor
    produced_artifacts: [audit-brief]
    exit_gates: [audit-brief-approved]
  - id: audit-work
    title: Audit Work
    description: Collect evidence and draft findings.
    required_role: auditor
    required_inputs: [audit-brief]
    produced_artifacts: [audit-report]
    entry_gates: [audit-brief-approved]
    exit_gates: [audit-report-ready]
  - id: review
    title: Review
    description: Check evidence, priority, and portability.
    required_role: reviewer
    required_inputs: [audit-report]
    produced_artifacts: [audit-review]
    entry_gates: [audit-report-ready]
    exit_gates: [audit-review-passed]
  - id: handoff
    title: Handoff
    description: Summarize delivered findings and remaining risks.
    required_role: auditor
    required_inputs: [audit-review]
    produced_artifacts: [audit-handoff]
    entry_gates: [audit-review-passed]
    exit_gates: [audit-handoff-created]
    handoff_required: true
artifacts:
  - id: audit-brief
    title: Audit Brief
    owner_role: auditor
    template: artifact-template
  - id: audit-report
    title: Audit Report
    owner_role: auditor
    template: validation-report-template
  - id: audit-review
    title: Audit Review
    owner_role: reviewer
    template: review-template
  - id: audit-handoff
    title: Audit Handoff
    owner_role: auditor
    template: handoff-template
gates:
  - id: audit-brief-approved
    description: Audit brief names goals, scope, and evidence sources.
    blocking: true
    required_artifact: audit-brief
  - id: audit-report-ready
    description: Audit report contains findings and priorities.
    blocking: true
    required_artifact: audit-report
  - id: audit-review-passed
    description: Review has no blocking failures.
    blocking: true
    required_artifact: audit-review
  - id: audit-handoff-created
    description: Handoff records results and residual risks.
    blocking: true
    required_artifact: audit-handoff
required_capabilities:
  - repository_read
  - reporting
  - artifact_review
required_packages:
  - process-forge-core
required_templates:
  - artifact-template
  - validation-report-template
  - review-template
  - handoff-template
allowed_tools:
  - processforge-cli
  - validator
forbidden_actions:
  - write_private_absolute_paths_to_public_files
  - skip_blocking_review
process_transitions:
  can_handoff: true
  routes:
    - id: quality-audit-to-review
      target_process: testing
      mode: wait_for_result
      input_artifacts: [audit-report]
      expected_output_artifacts: [audit-review]
      required_role: reviewer
  offline_agent_policy: keep_waiting_then_needs_operator
  continuation_capsule_required: true
  post_handoff_run_owner: source_process
agent_requirements:
  required_role: reviewer
  required_capabilities:
    - artifact_review
responsibility_boundaries:
  coordinator_role: agent-director
  execution_inspector_role: execution-inspector
  worker_role: worker
  needs_agent_director: true
  needs_execution_inspector: true
  director_decisions:
    - route_handoff
    - grant_lease
    - create_continuation
  inspector_checks:
    - task_runtime_status
    - heartbeat_exit_state
    - required_outputs
    - expected_report_artifact
  worker_actions:
    - perform_assigned_capsule_task
    - write_required_outputs
  automatic_cli_checks:
    - agent-availability --role <role> --json
    - agent-director-tick
    - execution-inspector-status
    - execution-inspector-run
subagent_policy:
  worker_shell_agents_may_call_subagents: false
  allowed_roles: []
  required_reports: []
