schema_version: 1
process:
  id: quality-audit
  name: Quality Audit
  version: 1.0.0
  status: draft
  kind: audit
  scope: project
  description: Audit project inputs and produce a prioritized quality report.
output:
  process_root: user
  path: processes/user/quality-audit.yaml
run_model:
  supports_multiple_tasks: true
  default_task_loop:
    enabled: true
    iteration_kinds: [work, debug, review, handoff]
execution_mode: single_agent
execution_mode_questions:
  single_agent:
    cli_checks:
      - process-doctor
      - run-doctor
      - task-doctor
    required_gates:
      - audit-review-passed
      - audit-handoff-created
    primary_agent_artifacts:
      - audit-report
      - audit-review
      - audit-handoff
    agent_ledger_checkin_checkout: true
    operator_approval_required: true
  single_agent_with_subagents:
    subagents_allowed: false
    allowed_roles: []
    require_subagent_reports: true
    reports_dir: .pf/artifacts/subagents/<task-id>/
  orchestrated_agents:
    worker_roles: []
    director_role: agent-director
    leases_required: true
    supervisor_required_for_runtime_workers: false
  process_factory:
    routes: []
    handoff_modes: []
    required_agent_roles: []
    continuations_required: true
coordination_requirements:
  mode: simple_allowed
  director_inbox:
    required: false
    optional: true
  error_workflow:
    mode: none
  simple_mode_behavior: disable_director_features
error_handling:
  enabled: false
  mode: none
  fallback_if_no_director: needs_operator
evolve:
  enabled: true
  decision:
    value: enabled
    reason: This process may produce reusable knowledge.
  mode: optional
  timing: end_of_run
  default_scope: project
  candidate_targets:
    - knowledge_package
    - template_package
    - process_definition
    - delivery_profile
    - project_rule
    - platform_contract
  extraction_hints:
    - Split candidates when an observation contains project-specific and platform-general parts.
    - Default to the narrowest safe scope and require evidence before parent-platform promotion.
    - reusable rule
    - missing knowledge
    - template improvement
    - regression check
    - process improvement
  candidate_targeting:
    ask_target_layer: true
    ask_applicability: true
    ask_not_applicable: true
    ask_generalization_level: true
    default_to_narrowest_scope: true
  prompts:
    - What reusable knowledge may appear during this process?
    - Which outputs are candidates for shared packages?
    - What must remain project-private?
    - Which target layer should receive each candidate?
    - Where does the observation apply, where does it not apply, and what evidence supports that scope?
    - Should the observation stay narrow, split into multiple candidates, or be proposed for promotion?
  required_outputs:
    - evolution-report
  privacy:
    default_sensitivity: internal
    export_requires_sanitization: true
    allow_private_paths: false
  apply_policy:
    auto_apply_global: false
    create_candidates_only: true
roles:
  - id: auditor
    title: Auditor
    kind: primary_agent
    responsibility: Reviews inputs and creates findings.
    responsibilities:
      - Reviews inputs and creates findings.
  - id: reviewer
    title: Reviewer
    kind: primary_agent
    responsibility: Validates evidence and recommendations.
    responsibilities:
      - Validates evidence and recommendations.
stages:
  - id: intake
    title: Intake
    goal: Capture site, goals, constraints, and source files.
    description: Capture site, goals, constraints, and source files.
    actor: primary_agent
    required_role: auditor
    produced_artifacts: [audit-brief]
    exit_gates: [audit-brief-approved]
  - id: audit-work
    title: Audit Work
    goal: Collect evidence and draft findings.
    description: Collect evidence and draft findings.
    actor: primary_agent
    required_role: auditor
    required_inputs: [audit-brief]
    produced_artifacts: [audit-report]
    entry_gates: [audit-brief-approved]
    exit_gates: [audit-report-ready]
  - id: review
    title: Review
    goal: Check evidence, priority, and portability.
    description: Check evidence, priority, and portability.
    actor: primary_agent
    required_role: reviewer
    required_inputs: [audit-report]
    produced_artifacts: [audit-review]
    entry_gates: [audit-report-ready]
    exit_gates: [audit-review-passed]
  - id: handoff
    title: Handoff
    goal: Summarize delivered findings and remaining risks.
    description: Summarize delivered findings and remaining risks.
    actor: primary_agent
    required_role: auditor
    required_inputs: [audit-review]
    produced_artifacts: [audit-handoff]
    entry_gates: [audit-review-passed]
    exit_gates: [audit-handoff-created]
artifacts:
  - id: audit-brief
    title: Audit Brief
    owner_role: auditor
    type: markdown
    required: true
    template: artifact-template
    path_hint: .pf/artifacts/audit-brief.md
  - id: audit-report
    title: Audit Report
    owner_role: auditor
    type: markdown
    required: true
    template: validation-report-template
    path_hint: .pf/artifacts/audit-report.md
  - id: audit-review
    title: Audit Review
    owner_role: reviewer
    type: markdown
    required: true
    template: review-template
    path_hint: .pf/reviews/audit-review.md
  - id: audit-handoff
    title: Audit Handoff
    owner_role: auditor
    type: markdown
    required: true
    template: handoff-template
    path_hint: .pf/handoffs/audit-handoff.md
gates:
  - id: audit-brief-approved
    type: artifact_exists
    description: Audit brief names goals, scope, and evidence sources.
    blocking: true
    required: true
    required_artifact: audit-brief
  - id: audit-report-ready
    type: artifact_exists
    description: Audit report contains findings and priorities.
    blocking: true
    required: true
    required_artifact: audit-report
  - id: audit-review-passed
    type: artifact_exists
    description: Review has no blocking failures.
    blocking: true
    required: true
    required_artifact: audit-review
  - id: audit-handoff-created
    type: artifact_exists
    description: Handoff records results and residual risks.
    blocking: true
    required: true
    required_artifact: audit-handoff
required_capabilities:
  - repository_read
  - reporting
  - artifact_review
required_packages:
  - process-forge-core
required_templates:
  - artifact-template
  - validation-report-template
  - review-template
  - handoff-template
allowed_tools:
  - processforge-cli
  - validator
forbidden_actions:
  - write_private_absolute_paths_to_public_files
  - skip_blocking_review
process_transitions:
  can_handoff: true
  routes:
    - id: quality-audit-to-review
      target_process: task-batch-execution
      mode: wait_for_result
      input_artifacts: [audit-report]
      expected_output_artifacts: [audit-review]
      required_role: reviewer
  offline_agent_policy: keep_waiting_then_needs_operator
  continuation_capsule_required: true
  post_handoff_run_owner: source_process
agent_requirements:
  required_role: reviewer
  required_capabilities:
    - artifact_review
responsibility_boundaries:
  coordinator_role: agent-director
  execution_inspector_role: execution-inspector
  worker_role: worker
  needs_agent_director: true
  needs_execution_inspector: true
  director_decisions:
    - route_handoff
    - grant_lease
    - create_continuation
  inspector_checks:
    - task_runtime_status
    - heartbeat_exit_state
    - required_outputs
    - expected_report_artifact
  worker_actions:
    - perform_assigned_capsule_task
    - write_required_outputs
  automatic_cli_checks:
    - agent-availability --role <role> --json
    - agent-director-tick
    - execution-inspector-status
    - execution-inspector-run
subagent_policy:
  allowed: false
  require_reports: false
  worker_shell_agents_may_call_subagents: false
  allowed_roles: []
  required_reports: []
stage_completion:
  handoff_note_required: true
run_completion:
  summary_required: true
  handoff_artifact_required: true
