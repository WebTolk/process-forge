schema_version: 1
capsule:
  id: example-capsule
  snapshot: .pf/contexts/project-context.snapshot.yaml
  snapshot_checksum: "<sha256>"
  worker_may_rebuild_context: false
assignment:
  id: example-assignment
  path: .pf/assignments/example-assignment.md
context:
  snapshot_id: project-context
  freshness: fresh
  conflict_status: resolved
required_sources:
  - .pf/contexts/project-context.snapshot.yaml
  - .pf/assignments/example-assignment.md
allowed_files: []
forbidden_files: []
required_outputs: []
required_capabilities: []
optional_capabilities: []
selected_sources: []
telemetry:
  events: .pf/runtime/telemetry/example-assignment.ndjson
allowed_actions:
  - read_required_sources
forbidden_actions:
  - rebuild_context_without_approval
