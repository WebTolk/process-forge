schema_version: 1
id: example-process
name: Example Process
version: 1.0.0
status: draft
description: Replace with a concise process description.
execution_mode: single_agent
coordination_requirements:
  mode: simple_allowed
  director_inbox:
    required: false
    optional: false
  error_workflow:
    mode: none
  simple_mode_behavior: disable_director_features
error_handling:
  enabled: false
  mode: none
  fallback_if_no_director: needs_operator
responsibility_boundaries:
  operator:
    - Provides scope and approval.
  primary_agent:
    - Executes the process and writes artifacts.
  director:
    - Not required for simple mode.
  inspector:
    - Runs CLI checks when applicable.
  worker:
    - Not used by default.
  cli_tools:
    - Run deterministic checks.
process_transitions: []
subagent_policy:
  allowed: false
  require_reports: false
  allowed_roles: []
required_capabilities: []
hooks:
  emit:
    - event: process.started
      required: true
    - event: stage.started
      required: true
    - event: stage.completed
      required: true
    - event: assignment.created
      required: true
    - event: artifact.created
      required: true
    - event: gate.failed
      required: true
    - event: chat.message.recorded
      required: false
  subscriptions:
    - event: assignment.completed
      actions:
        - type: create_review_request
    - event: gate.failed
      actions:
        - type: block_stage
        - type: notify_orchestrator
  tracking:
    include:
      - process_id
      - process_version
      - stage_id
      - assignment_id
      - artifact_refs
      - actor
      - session_id
      - status
roles:
  - id: orchestrator
    title: Orchestrator
    kind: primary_agent
    responsibility: Coordinates the process.
    responsibilities:
      - Coordinates the process.
stages:
  - id: intake
    title: Intake
    goal: Capture goal and scope.
    description: Capture goal and scope.
    actor: primary_agent
    required_inputs: []
    produced_artifacts:
      - brief
      - scope
    required_role: orchestrator
    required_capabilities:
      - process_coordination
    allowed_tools: []
    hooks:
      emit:
        - event: tool.invoked
        - event: artifact.created
      stop_gates:
        - event: session.ended
          require:
            - gate.passed
    entry_gates: []
    exit_gates:
      - scope-recorded
    automation_bindings: []
artifact_definitions:
  - id: brief
    title: Brief
    owner_role: orchestrator
    type: markdown
    required: true
    template: artifact-template
    path_hint: .pf/artifacts/brief.md
    lifecycle:
      - draft
      - ready_for_review
      - approved
evidence_definitions:
  - id: scope-attestation
    title: Scope attestation
    kind: attestation
gates:
  - id: scope-recorded
    type: checklist
    description: Scope and exclusions are explicit.
    blocking: true
    required: true
stage_completion:
  handoff_note_required: true
run_completion:
  summary_required: true
  handoff_artifact_required: true
required_packages: []
required_templates:
  - artifact-template
allowed_tools: []
forbidden_actions:
  - edit_outside_assignment_scope
evolve:
  enabled: true
  mode: optional
  timing: end_of_run
  default_scope: project
  candidate_targets:
    - knowledge_package
    - template_package
    - process_definition
    - delivery_profile
    - project_rule
    - platform_contract
  extraction_hints:
    - Split candidates when an observation contains project-specific and platform-general parts.
    - Default to the narrowest safe scope and require evidence before parent-platform promotion.
    - reusable rule
    - missing knowledge
    - template improvement
    - regression check
    - process improvement
  candidate_targeting:
    default_scope: project
    require_applicability: true
    require_target: true
    default_to_narrowest_scope: true
  required_outputs:
    - evolution-report
  privacy:
    default_sensitivity: internal
    export_requires_sanitization: true
    allow_private_paths: false
  apply_policy:
    auto_apply_global: false
    create_candidates_only: true
evolution_policy:
  active_run_upgrade:
    default: manual_only
  protected_artifacts:
    - brief
  safe_changes:
    - add_optional_artifact
  blocked_changes:
    - remove_existing_artifact_definition
  requires_approval:
    - add_required_gate
