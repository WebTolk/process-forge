schema_version: 1

id: platform.joomla
type: platform_contract
version: "1.0.0"

applies_to:
  platforms:
    - joomla
  project_types:
    - joomla-component
    - joomla-plugin
    - joomla-library

requires:
  capabilities:
    - repository.read
    - markdown.editing
    - schema_validation

includes:
  knowledge_packages:
    - php.core
    - joomla.official-docs
    - joomla.source-code
    - joomla.development-articles
    - joomla.snippets
  tools:
    - php.syntax-check
    - php.static-analysis
    - package.builder
  mcp:
    - repository.symbol-analysis
    - official-documentation
  templates:
    - joomla.component
    - joomla.plugin
    - joomla.form-field
    - php.docblock

policies:
  missing_required_capability: block
  missing_optional_resource: warn
