schema_version: 1
run:
  id: example-run
  title: Example multi-agent run
  process: multi-agent-task-orchestration
orchestrator:
  role: orchestrator
  responsibilities:
    - decompose work
    - assign workers
    - review outputs
    - integrate final result
runtime:
  default_driver: manual
  supervisor_profile: default
  start_policy: manual
workers:
  -
    id: fixture-worker-a
    title: Fixture work item A
    role: worker
    process: task-batch-execution
    execution_mode: implementation
    writer: true
    allowed_files:
      - .pf/artifacts/fixture-a/**
    allowed_read_files:
      - .pf/contexts/project-context.snapshot.yaml
    forbidden_files:
      - tools/**
      - schemas/**
    required_sources:
      - .pf/contexts/project-context.snapshot.yaml
    required_outputs:
      -
        id: fixture-a-report
        path: .pf/artifacts/fixture-a-report.md
        type: markdown
        required: true
    expected_report_artifact: .pf/artifacts/fixture-a-report.md
    runtime_driver: manual
    dependencies: []
    worker_may_rebuild_context: false
  -
    id: fixture-worker-b
    title: Fixture work item B
    role: reviewer
    process: task-batch-execution
    execution_mode: assurance
    writer: true
    allowed_files:
      - .pf/artifacts/fixture-b/**
    allowed_read_files:
      - .pf/artifacts/fixture-a/**
      - .pf/contexts/project-context.snapshot.yaml
    forbidden_files:
      - tools/processforge.py
    required_sources:
      - .pf/contexts/project-context.snapshot.yaml
    required_outputs:
      -
        id: fixture-b-report
        path: .pf/artifacts/fixture-b-report.md
        type: markdown
        required: true
    expected_report_artifact: .pf/artifacts/fixture-b-report.md
    runtime_driver: manual
    dependencies:
      - fixture-worker-a
    worker_may_rebuild_context: false
integration:
  required: true
  role: orchestrator
  expected_output: .pf/artifacts/example-integration-report.md
