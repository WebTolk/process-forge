schema_version: 1

process_forge:
  version: "1.0.0"
  version_constraint: "^1.0"
  mode: file_only
  install_mode: linked
  distribution:
    id: processforge
    source: workplace
  runner_required: false
  backend_required: false

project:
  id: "<project-id>"
  name: "<project-name>"
  type: "<project-type>"

flow:
  root: ".pf"
  manifest: ".pf/process-forge.yaml"
  local_config: ".pf/process-forge.local.yaml"

workplace:
  reference: local_file
  local_config: .pf/process-forge.local.yaml

detected:
  languages: []
  platforms: []
  project_kind: []

paths:
  processes: processes
  packages: packages
  templates: templates
  assignments: assignments
  authoring: authoring
  artifacts: artifacts
  contexts: contexts
  logs: logs
  handoffs: handoffs
  reviews: reviews
  adr: adr
  schemas: schemas
  runtime: runtime
  hooks: hooks.yaml
  chat: runtime/chat

knowledge_stack:
  - id: processforge.core
    version: "^1.0"
    source: distribution
    distribution: processforge

required_capabilities:
  - repository.read
  - markdown.editing

optional_capabilities:
  - repository.symbol_analysis
  - official_documentation

policies:
  one_writer_per_file_scope: true
  approved_artifacts_are_protected: true
  execution_context_is_immutable: true
  public_files_must_not_contain_local_absolute_paths: true
