name: Repository checks

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  public-source:
    name: Public source (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Check fresh-clone boundary
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess

          tracked = subprocess.check_output(['git', 'ls-files', '--', '.pf'])
          assert not tracked, 'Root .pf must never be tracked'
          assert not Path('.pf').exists(), 'Fresh checkout must not contain private project state'
          for name in ('AGENTS.md', 'CONTRIBUTING.md', 'CONTRIBUTING.ru.md'):
              assert Path(name).is_file(), f'Missing contributor instructions: {name}'
          scratch = Path(os.environ['RUNNER_TEMP']) / 'processforge-smoke'
          scratch.mkdir(parents=True, exist_ok=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment:
              environment.write(f'PF_TEST_SCRATCH_ROOT={scratch}\n')
      - name: Validate public source
        shell: python
        run: |
          import subprocess
          import sys

          for script in (
              'validate-process-forge-schemas.py',
              'validate-process-forge-checksums.py',
              'validate-public-cleanliness.py',
          ):
              subprocess.run([sys.executable, 'tools/' + script], check=True)
      - name: Check packaging and consumer boundaries
        shell: python
        run: |
          import subprocess
          import sys

          for script in (
              'smoke_agent_entry_release.py',
              'smoke_remediation_checksum_surface.py',
              'smoke_public_cleanliness.py',
              'smoke_docs_agent_no_manual_infra.py',
              'smoke_project_pf_upgrade_assessment_boundary.py',
              'smoke_release_pack_excludes_user_processes.py',
              'smoke_pf_project_process_refs_follow_layout.py',
              'smoke_no_removed_process_refs.py',
          ):
              subprocess.run([sys.executable, 'tools/' + script], check=True)
      - name: Check contributor installation boundaries
        run: python -m unittest discover -s tests/contributor_setup -v
      - name: Check public release consumer gates on source and archive
        run: python -m unittest discover -s tests/release_consumer -v
      - name: Check package rollback metadata
        run: python -m unittest discover -s tests/update_metadata -v
      - name: Check concurrent journal initialization and refusal
        run: python -m unittest discover -s tests/sqlite_storage -v
      - name: Check stable MCP connection across Core replacement and failure
        shell: python
        run: |
          import subprocess
          import sys

          subprocess.run([sys.executable, '-B', '-m', 'unittest', 'discover',
                          '-s', 'tests/mcp_bridge', '-v'], check=True)
          for script in ('smoke_mcp_jsonrpc_validation.py',
                         'smoke_mcp_stdio_unicode.py', 'smoke_mcp_codex_contract.py'):
              subprocess.run([sys.executable, '-B', 'tools/' + script], check=True)
      - name: Check six journal producers and dispatch recovery
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys

          scratch = Path(os.environ['PF_TEST_SCRATCH_ROOT']).resolve() / 'journal-concurrency'
          scratch.mkdir(parents=True, exist_ok=True)
          environment = dict(os.environ, TMPDIR=str(scratch), TEMP=str(scratch), TMP=str(scratch))
          subprocess.run([sys.executable, '-B', 'tools/smoke_process_event_concurrency.py'],
                         env=environment, check=True)
      - name: Check shared Python QA bundle
        env:
          PF_PYTHON_QA_TEST_ROOT: ${{ runner.temp }}/python-qa-tests
        run: python -m unittest discover -s tests/python_qa -v
      - name: Install and resolve the published contributor knowledge
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          workplace = Path(os.environ['RUNNER_TEMP']) / 'contributor workplace'
          def run(*args):
              subprocess.run([sys.executable, *map(str, args)], check=True)
          run('bin/pf.py', 'workplace-init', '--workplace', workplace, '--profile', 'software-development', '--apply')
          run('tools/install-contributor-knowledge.py', '--workplace', workplace)
          run('tools/install-contributor-knowledge.py', '--workplace', workplace, '--apply')
          run('tools/install-contributor-knowledge.py', '--workplace', workplace, '--apply')
          profile = json.loads(Path('docs/contributors/knowledge-packages.json').read_text(encoding='utf-8'))
          for package in profile['packages']:
              run('bin/pf.py', 'knowledge-package-doctor', '--workplace', workplace, '--package', package['id'], '--package-root', 'global')
          run('bin/pf.py', 'update', 'entity-sources', 'rebuild', '--workplace', workplace)
          project = Path(os.environ['RUNNER_TEMP']) / 'contributor source project'
          project.mkdir()
          shared_entry = Path('AGENTS.md').read_bytes()
          (project / 'AGENTS.md').write_bytes(shared_entry)
          run('bin/pf.py', 'project-onboard', '--project-root', project, '--workplace', workplace,
              '--type', 'processforge-development', '--process', 'software-feature-development',
              '--coordination-mode', 'simple', '--apply')
          assert (project / 'AGENTS.md').read_bytes().startswith(shared_entry), 'Onboarding replaced shared instructions'
          run('bin/pf.py', 'doctor-project', '--project-root', project)
          run('bin/pf.py', 'project-context-check', '--project-root', project)

  managed-mcp:
    name: Managed MCP update (windows-latest)
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install runtime and pinned test dependencies
        run: python -m pip install -r requirements.txt pytest==9.1.1
      - name: Qualify live MCP connection and native managed update
        shell: python
        run: |
          import os
          from pathlib import Path
          import platform
          import subprocess
          import sys

          root = Path.cwd()
          scratch = root / '.pf' / 'tmp' / 'managed-mcp'
          scratch.mkdir(parents=True, exist_ok=True)
          environment = dict(os.environ)
          environment['PYTHONPATH'] = os.pathsep.join(str(root / name) for name in ('src', 'tools', 'tests'))
          environment['W3_FIXTURE_ROOT'] = str(scratch)
          print(platform.platform(), sys.version, flush=True)
          subprocess.run([
              sys.executable, '-m', 'pytest', '-q', '-ra', '-p', 'no:cacheprovider',
              'tests/execution_migration/test_native_control.py::test_mcp_request_holds_real_lease_and_idle_releases',
              'tests/execution_migration/test_native_control.py::test_stable_mcp_connection_survives_real_managed_core_update',
          ], env=environment, check=True)

  cleanup:
    name: Cleanup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Native namespace execution uses the same qualified Linux image as the native job.
        os: [ubuntu-22.04, windows-latest]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install runtime and pinned test dependencies
        run: python -m pip install -r requirements.txt pytest==9.1.1
      - name: Qualify historical collection cleanup and native stage advance
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys

          root = Path.cwd()
          scratch = root / '.pf' / 'tmp' / 'cleanup-acceptance'
          environment = dict(os.environ)
          environment['PYTHONPATH'] = os.pathsep.join(str(root / name) for name in ('src', 'tools', 'tests'))
          for name in ('W3_FIXTURE_ROOT', 'PF_TEST_SCRATCH_ROOT', 'PF_PRIVATE_PROCESS_TEST_ROOT',
                       'PF_W4_TEST_ROOT', 'PF_RELEASE_REPORT_TEST_ROOT', 'TMPDIR', 'TEMP', 'TMP'):
              directory = scratch / name.lower()
              directory.mkdir(parents=True, exist_ok=True)
              environment[name] = str(directory)
          subprocess.run([
              sys.executable, '-m', 'pytest', '-q', '-ra', '--capture=sys', '-p', 'no:cacheprovider',
              '--basetemp=' + str(scratch / 'pytest'), '--junitxml=cleanup-results.xml',
              'tests/prepared_collection_state', 'tests/temporary_disposal', 'tests/executions/test_lifecycle.py',
          ], env=environment, check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cleanup-results-${{ matrix.os }}
          path: cleanup-results.xml
          if-no-files-found: ignore


  runtime-recovery:
    name: Runtime recovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install runtime and pinned test dependencies
        run: python -m pip install -r requirements.txt pytest==9.1.1
      - name: Qualify Runtime state and recovery in file-only fixtures
        shell: python
        run: |
          import os
          import sys
          from pathlib import Path

          root = Path.cwd()
          scratch = root / ".pf" / "tmp" / "runtime-recovery"
          paths = [str(root / name) for name in (".", "src", "tools", "tests")]
          os.environ["PYTHONPATH"] = os.pathsep.join(paths)
          sys.path[:0] = paths
          for name in ("W3_FIXTURE_ROOT", "PF_TEST_SCRATCH_ROOT", "PF_PRIVATE_PROCESS_TEST_ROOT",
                       "PF_W4_TEST_ROOT", "PF_RELEASE_REPORT_TEST_ROOT", "TMPDIR", "TEMP", "TMP", "W52_TMP"):
              directory = scratch / name.lower()
              directory.mkdir(parents=True, exist_ok=True)
              os.environ[name] = str(directory)
          os.environ["W52_LABEL"] = "runtime-recovery"
          os.environ["W55_OBSERVATIONS"] = str(scratch / "native-metadata-observations.json")

          """Run maintained assertions and ownership regressions in file-only fixtures."""
          from pathlib import Path
          from unittest.mock import patch
          import json
          import subprocess
          import sys

          import pytest
          import processforge as core
          import process_execution_smoke_support as support

          calls=[]
          original_cli=support.cli

          def fixture_cli(*args):
              if args[0]=="project-onboard":
                  args=(*args,"--coordination-mode","simple")
              return original_cli(*args)

          def file_only_start(workplace,name,arguments):
              assert name=="pf.work.start",name
              assert set(arguments)=={"project_root","objective"},arguments
              calls.append(name)
              return core.process_execution_service(Path(arguments["project_root"]),str(workplace)).start(objective=arguments["objective"])

          def observe(event,arguments):
              if event!="subprocess.Popen":return
              command=arguments[1]
              parts=command if isinstance(command,(tuple,list)) else [command]
              normalized=[str(p).replace(chr(92),"/").lower() for p in parts]
              if any("/pf_runtime/mcp_server.py" in p or "/pf_runtime/service.py" in p or Path(p).name in {"codex","codex.exe","claude","claude.exe"} for p in normalized):
                  raise AssertionError("file_only_profile_forbids_service_or_model_launch")

          sys.addaudithook(observe)
          selection=[
              "tests/runtime/test_service_state.py",
              "tests/runtime/test_scheduler_admission.py",
              "tests/runtime/test_schedule.py",
              "tests/executions/test_admission.py",
              "tests/runtime_monitor/test_uptime.py",
              "tests/core_properties/test_adapters.py",
              "tests/work/test_immutable_publication.py",
              "tests/work/test_start_reliability.py",
              "tests/work/test_complete_admission.py",
              "tests/work/test_completion_intent_validation.py",
              "tests/process_journal/test_sqlite_safety.py",
              "tests/execution_migration/test_storage_admission.py",
              "tests/maintenance_service/test_journals.py",
              "tests/maintenance_scan/test_journal_scan.py",
              "tests/native_metadata/test_native_metadata_staging.py",
          ]
          with patch.object(support,"call_mcp",file_only_start),patch.object(support,"cli",fixture_cli):
              result=pytest.main(["-q","-ra","--capture=sys","-p","no:cacheprovider","--basetemp="+str(scratch/"pytest"),"--junitxml=runtime-recovery-results.xml",*selection])
              if result:raise SystemExit(result)
              import smoke_work_completion_recovery as completion
              completion.main()
          subprocess.run([sys.executable,"-B","tools/smoke_process_event_concurrency.py"],check=True)
          print("FILE_ONLY_PROFILE "+json.dumps({"direct_core_start_calls":len(calls),"bounded_publication_refusal_checked":True,"stdio_mcp_qualified":False,"production_runtime_qualified":False}),flush=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-recovery-results-${{ matrix.os }}
          path: runtime-recovery-results.xml
          if-no-files-found: ignore
