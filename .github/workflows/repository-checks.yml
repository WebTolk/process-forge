name: Repository checks

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  public-source:
    name: Public source (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime and pinned test dependencies
        run: python -m pip install -r requirements.txt pytest==9.1.1
      - name: Check fresh-clone boundary
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess

          tracked = subprocess.check_output(['git', 'ls-files', '--', '.pf'])
          assert not tracked, 'Root .pf must never be tracked'
          assert not Path('.pf').exists(), 'Fresh checkout must not contain private project state'
          for name in ('AGENTS.md', 'CONTRIBUTING.md', 'CONTRIBUTING.ru.md'):
              assert Path(name).is_file(), f'Missing contributor instructions: {name}'
          scratch = Path(os.environ['RUNNER_TEMP']) / 'processforge-smoke'
          scratch.mkdir(parents=True, exist_ok=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment:
              environment.write(f'PF_TEST_SCRATCH_ROOT={scratch}\n')
      - name: Validate public source
        shell: python
        run: |
          import subprocess
          import sys

          for script in (
              'validate-process-forge-schemas.py',
              'validate-process-forge-checksums.py',
              'validate-public-cleanliness.py',
          ):
              subprocess.run([sys.executable, 'tools/' + script], check=True)
      - name: Check packaging and consumer boundaries
        shell: python
        run: |
          import subprocess
          import sys

          for script in (
              'smoke_agent_entry_release.py',
              'smoke_remediation_checksum_surface.py',
              'smoke_public_cleanliness.py',
              'smoke_docs_agent_no_manual_infra.py',
              'smoke_project_pf_upgrade_assessment_boundary.py',
              'smoke_release_pack_excludes_user_processes.py',
              'smoke_pf_project_process_refs_follow_layout.py',
              'smoke_no_removed_process_refs.py',
          ):
              subprocess.run([sys.executable, 'tools/' + script], check=True)
      - name: Check contributor installation boundaries
        run: python -m unittest discover -s tests/contributor_setup -v
      - name: Check public release consumer gates on source and archive
        run: python -m unittest discover -s tests/release_consumer -v
      - name: Check package rollback metadata
        run: python -m unittest discover -s tests/update_metadata -v
      - name: Qualify historical collection cleanup and native stage advance
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys

          root = Path.cwd()
          scratch = root / '.pf' / 'tmp' / 'cleanup-acceptance'
          environment = dict(os.environ)
          environment['PYTHONPATH'] = os.pathsep.join(str(root / name) for name in ('src', 'tools', 'tests'))
          for name in ('W3_FIXTURE_ROOT', 'PF_TEST_SCRATCH_ROOT', 'PF_PRIVATE_PROCESS_TEST_ROOT',
                       'PF_W4_TEST_ROOT', 'PF_RELEASE_REPORT_TEST_ROOT', 'TMPDIR', 'TEMP', 'TMP'):
              directory = scratch / name.lower()
              directory.mkdir(parents=True, exist_ok=True)
              environment[name] = str(directory)
          subprocess.run([
              sys.executable, '-m', 'pytest', '-q', '-ra', '--capture=sys', '-p', 'no:cacheprovider',
              '--basetemp=' + str(scratch / 'pytest'), '--junitxml=cleanup-results.xml',
              'tests/prepared_collection_state', 'tests/temporary_disposal', 'tests/executions/test_lifecycle.py',
          ], env=environment, check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cleanup-results-${{ matrix.os }}
          path: cleanup-results.xml
          if-no-files-found: ignore
      - name: Check shared Python QA bundle
        env:
          PF_PYTHON_QA_TEST_ROOT: ${{ runner.temp }}/python-qa-tests
        run: python -m unittest discover -s tests/python_qa -v
      - name: Install and resolve the published contributor knowledge
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          workplace = Path(os.environ['RUNNER_TEMP']) / 'contributor workplace'
          def run(*args):
              subprocess.run([sys.executable, *map(str, args)], check=True)
          run('bin/pf.py', 'workplace-init', '--workplace', workplace, '--profile', 'software-development', '--apply')
          run('tools/install-contributor-knowledge.py', '--workplace', workplace)
          run('tools/install-contributor-knowledge.py', '--workplace', workplace, '--apply')
          run('tools/install-contributor-knowledge.py', '--workplace', workplace, '--apply')
          profile = json.loads(Path('docs/contributors/knowledge-packages.json').read_text(encoding='utf-8'))
          for package in profile['packages']:
              run('bin/pf.py', 'knowledge-package-doctor', '--workplace', workplace, '--package', package['id'], '--package-root', 'global')
          run('bin/pf.py', 'update', 'entity-sources', 'rebuild', '--workplace', workplace)
          project = Path(os.environ['RUNNER_TEMP']) / 'contributor source project'
          project.mkdir()
          shared_entry = Path('AGENTS.md').read_bytes()
          (project / 'AGENTS.md').write_bytes(shared_entry)
          run('bin/pf.py', 'project-onboard', '--project-root', project, '--workplace', workplace,
              '--type', 'processforge-development', '--process', 'software-feature-development',
              '--coordination-mode', 'simple', '--apply')
          assert (project / 'AGENTS.md').read_bytes().startswith(shared_entry), 'Onboarding replaced shared instructions'
          run('bin/pf.py', 'doctor-project', '--project-root', project)
          run('bin/pf.py', 'project-context-check', '--project-root', project)
