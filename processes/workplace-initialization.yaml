schema_version: 1
id: workplace-initialization
name: Workplace Initialization
kind: first_run
scope: workplace
version: 1.0.0
status: active
description: Initialize or update the machine-local ProcessForge workplace layer.
coordination_requirements:
  mode: simple_allowed
  director_inbox:
    required: false
    optional: false
  error_workflow:
    mode: none
  simple_mode_behavior: disable_director_features
error_handling:
  enabled: false
  mode: none
  fallback_if_no_director: needs_operator
required_capabilities:
- filesystem.write
- markdown.editing
- validation
hooks:
  emit:
  - event: workplace.initialization.started
    required: true
  - event: workplace.structure.created
    required: true
  - event: workplace.path_constants.created
    required: true
  - event: workplace.registry.created
    required: true
  - event: workplace.doctor.passed
    required: true
  - event: workplace.doctor.failed
    required: true
  - event: workplace.initialization.completed
    required: true
  - event: process.started
    required: true
  - event: stage.started
    required: true
  - event: stage.completed
    required: true
  - event: assignment.created
    required: true
  - event: artifact.created
    required: true
  - event: gate.failed
    required: true
  - event: chat.message.recorded
    required: false
  subscriptions:
  - event: assignment.completed
    actions:
    - type: create_review_request
  - event: gate.failed
    actions:
    - type: block_stage
    - type: notify_orchestrator
  tracking:
    include:
    - process_id
    - process_version
    - stage_id
    - assignment_id
    - artifact_refs
    - actor
    - session_id
    - status
roles:
- id: orchestrator
  title: Orchestrator
  responsibility: Coordinates the initialization and safety checks.
  kind: primary_agent
  responsibilities:
  - Coordinates the initialization and safety checks.
- id: reviewer
  title: Reviewer
  responsibility: Reviews the proposal and doctor output.
  kind: primary_agent
  responsibilities:
  - Reviews the proposal and doctor output.
stages:
- id: intake
  title: Intake
  description: Capture root path, answers, Director capability, default project mode, and Director Office initialization choice.
  required_inputs: []
  produced_artifacts:
  - workplace-init-answers
  required_role: orchestrator
  required_capabilities:
  - filesystem.read
  allowed_tools:
  - processforge-init
  entry_gates: []
  exit_gates:
  - root-provided
  goal: Capture root path, answers, Director capability, default project mode, and Director Office initialization choice.
  actor: primary_agent
  gates:
  - root-provided
- id: terms-setup
  title: Terms Setup
  description: Create or update terms aliases.
  required_inputs:
  - workplace-init-answers
  produced_artifacts:
  - terms-file
  required_role: orchestrator
  required_capabilities:
  - filesystem.write
  allowed_tools:
  - processforge-init
  entry_gates:
  - root-provided
  exit_gates:
  - terms-created
  goal: Create or update terms aliases.
  actor: primary_agent
  gates:
  - terms-created
- id: registry-setup
  title: Registry Setup
  description: Create platform, knowledge, package, template, tool, and MCP registries.
  required_inputs:
  - workplace-init-answers
  produced_artifacts:
  - workplace-registries
  required_role: orchestrator
  required_capabilities:
  - filesystem.write
  allowed_tools:
  - processforge-init
  entry_gates:
  - terms-created
  exit_gates:
  - registries-created
  goal: Create platform, knowledge, package, template, tool, and MCP registries.
  actor: primary_agent
  gates:
  - registries-created
- id: tool-discovery
  title: Tool Discovery
  description: Record configured tool providers from answers.
  required_inputs:
  - workplace-registries
  produced_artifacts:
  - tool-registry
  required_role: orchestrator
  required_capabilities:
  - filesystem.write
  allowed_tools:
  - processforge-init
  entry_gates:
  - registries-created
  exit_gates:
  - tools-recorded
  goal: Record configured tool providers from answers.
  actor: primary_agent
  gates:
  - tools-recorded
- id: mcp-discovery
  title: MCP Discovery
  description: Record configured MCP providers from answers.
  required_inputs:
  - workplace-registries
  produced_artifacts:
  - mcp-registry
  required_role: orchestrator
  required_capabilities:
  - filesystem.write
  allowed_tools:
  - processforge-init
  entry_gates:
  - registries-created
  exit_gates:
  - mcp-recorded
  goal: Record configured MCP providers from answers.
  actor: primary_agent
  gates:
  - mcp-recorded
- id: proposal
  title: Proposal
  description: Present the planned workplace changes.
  required_inputs:
  - workplace-init-answers
  produced_artifacts:
  - workplace-init-proposal
  required_role: orchestrator
  required_capabilities:
  - reporting
  allowed_tools:
  - processforge-init
  entry_gates:
  - root-provided
  exit_gates:
  - proposal-created
  goal: Present the planned workplace changes.
  actor: primary_agent
  gates:
  - proposal-created
- id: review
  title: Review
  description: Review the proposed changes.
  required_inputs:
  - workplace-init-proposal
  produced_artifacts:
  - workplace-init-review
  required_role: reviewer
  required_capabilities:
  - review
  allowed_tools: []
  entry_gates:
  - proposal-created
  exit_gates:
  - review-recorded
  goal: Review the proposed changes.
  actor: primary_agent
  gates:
  - review-recorded
- id: apply
  title: Apply
  description: Write workplace files.
  required_inputs:
  - workplace-init-review
  produced_artifacts:
  - workplace-files
  required_role: orchestrator
  required_capabilities:
  - filesystem.write
  allowed_tools:
  - processforge-init
  entry_gates:
  - review-recorded
  exit_gates:
  - workplace-files-written
  goal: Write workplace files.
  actor: primary_agent
  gates:
  - workplace-files-written
- id: doctor
  title: Doctor
  description: Validate workplace setup.
  required_inputs:
  - workplace-files
  produced_artifacts:
  - workplace-doctor-report
  required_role: orchestrator
  required_capabilities:
  - validation
  allowed_tools:
  - processforge-doctor
  entry_gates:
  - workplace-files-written
  exit_gates:
  - doctor-complete
  goal: Validate workplace setup.
  actor: primary_agent
  gates:
  - doctor-complete
artifact_definitions:
- id: workplace-init-answers
  title: Workplace Init Answers
  owner_role: orchestrator
  template: workplace-init.answers
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/workplace-init-answers.md
- id: workplace-init-proposal
  title: Workplace Init Proposal
  owner_role: orchestrator
  template: artifact-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/workplace-init-proposal.md
- id: workplace-doctor-report
  title: Workplace Doctor Report
  owner_role: orchestrator
  template: validation-report-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/workplace-doctor-report.md
- id: workplace-bootstrap-report
  title: Workplace Bootstrap Report
  owner_role: orchestrator
  template: artifact-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/workplace-bootstrap-report.md
- id: workplace-ready-handoff
  title: Workplace Ready Handoff
  owner_role: orchestrator
  template: handoff-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/workplace-ready-handoff.md
- id: terms-file
  title: Terms File
  owner_role: orchestrator
  type: markdown
  required: true
  template: artifact-template
  path_hint: .pf/artifacts/terms-file.md
  lifecycle:
  - draft
  - ready_for_review
  - approved
- id: workplace-registries
  title: Workplace Registries
  owner_role: orchestrator
  type: markdown
  required: true
  template: artifact-template
  path_hint: .pf/artifacts/workplace-registries.md
  lifecycle:
  - draft
  - ready_for_review
  - approved
- id: tool-registry
  title: Tool Registry
  owner_role: orchestrator
  type: markdown
  required: true
  template: artifact-template
  path_hint: .pf/artifacts/tool-registry.md
  lifecycle:
  - draft
  - ready_for_review
  - approved
- id: mcp-registry
  title: Mcp Registry
  owner_role: orchestrator
  type: markdown
  required: true
  template: artifact-template
  path_hint: .pf/artifacts/mcp-registry.md
  lifecycle:
  - draft
  - ready_for_review
  - approved
- id: workplace-init-review
  title: Workplace Init Review
  owner_role: reviewer
  type: markdown
  required: true
  template: artifact-template
  path_hint: .pf/artifacts/workplace-init-review.md
  lifecycle:
  - draft
  - ready_for_review
  - approved
- id: workplace-files
  title: Workplace Files
  owner_role: orchestrator
  type: markdown
  required: true
  template: artifact-template
  path_hint: .pf/artifacts/workplace-files.md
  lifecycle:
  - draft
  - ready_for_review
  - approved
gates:
- id: root-provided
  description: A workplace root was provided by the user.
  blocking: true
  type: checklist
  required: true
- id: terms-created
  description: Terms file exists or is planned.
  blocking: true
  type: checklist
  required: true
- id: registries-created
  description: Registry files exist or are planned.
  blocking: true
  type: checklist
  required: true
- id: tools-recorded
  description: Tool providers are recorded or explicitly empty.
  blocking: false
  type: checklist
  required: false
- id: mcp-recorded
  description: MCP providers are recorded or explicitly empty.
  blocking: false
  type: checklist
  required: false
- id: proposal-created
  description: Proposal-first output exists.
  blocking: true
  type: checklist
  required: true
- id: review-recorded
  description: Review or explicit approval exists.
  blocking: true
  type: checklist
  required: true
- id: workplace-files-written
  description: Files were written in apply mode.
  blocking: true
  type: checklist
  required: true
- id: doctor-complete
  description: Doctor result is recorded.
  blocking: true
  type: checklist
  required: true
required_packages:
- process-forge-core
required_templates:
- workplace.yaml
- terms.yaml
- workplace-init.answers
allowed_tools:
- processforge-init
- processforge-doctor
forbidden_actions:
- invent_root_path
- store_secret_values
evolution_policy:
  active_run_upgrade:
    default: manual_only
  protected_artifacts:
  - workplace-init-answers
  - workplace-doctor-report
  safe_changes:
  - add_optional_registry
  blocked_changes:
  - store_secret_values
  requires_approval:
  - change_locked_policy
catalog:
  classification: PUBLIC_STABLE
  public_surface: true
  strict_contract: true
public_surface: true
execution_mode: single_agent
responsibility_boundaries:
  operator:
  - Provides the objective, constraints, approvals, and final acceptance.
  primary_agent:
  - Executes the process stages, writes required artifacts, and runs gates.
  director:
  - Coordinates handoffs and leases only when the effective project mode requires Director.
  inspector:
  - Verifies runtime state, CLI gates, and worker proof artifacts when applicable.
  worker:
  - Works only from an assigned capsule and writes declared outputs.
  cli_tools:
  - Run deterministic ProcessForge checks and write machine-readable results.
subagent_policy:
  allowed: false
  require_reports: false
  allowed_roles: []
process_transitions: []
stage_completion:
  handoff_note_required: true
run_completion:
  summary_required: true
  handoff_artifact_required: true
process_pack:
  package: process-forge-core
  example_required: true
agent_prompt:
  required: true
