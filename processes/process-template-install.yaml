schema_version: 1
id: process-template-install
name: Process Template Install
version: 1.0.0
status: active
description: Add a reusable process definition template with artifact, gate, resource, and validation mapping.
required_capabilities:
- repository_write
- schema_validation
hooks:
  emit:
  - event: artifact.created
    required: true
roles:
- id: maintainer
  title: Maintainer
  responsibility: Classifies process, writes process definition, maps templates/resources, and validates.
  kind: primary_agent
  responsibilities:
  - Classifies process, writes process definition, maps templates/resources, and validates.
stages:
- id: intake
  title: Intake
  description: Capture process purpose, scope, stages, artifacts, gates, and resources.
  required_inputs: []
  produced_artifacts:
  - process-template-request
  required_role: maintainer
  required_capabilities:
  - markdown_editing
  allowed_tools: []
  entry_gates: []
  exit_gates:
  - request-complete
  goal: Capture process purpose, scope, stages, artifacts, gates, and resources.
  actor: primary_agent
  gates:
  - request-complete
- id: process-definition-creation
  title: Process Definition Creation
  description: Create process definition and validate it against schema.
  required_inputs:
  - process-template-request
  produced_artifacts:
  - process-definition
  - validation-report
  - review
  required_role: maintainer
  required_capabilities:
  - repository_write
  allowed_tools:
  - validator
  entry_gates:
  - request-complete
  exit_gates:
  - process-reviewed
  goal: Create process definition and validate it against schema.
  actor: primary_agent
  gates:
  - process-reviewed
artifact_definitions:
- id: process-definition
  title: Process Definition
  owner_role: maintainer
  template: process-definition-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/process-definition.md
- id: process-template-request
  title: Process Template Request
  owner_role: maintainer
  type: markdown
  required: true
  template: artifact-template
  path_hint: .pf/artifacts/process-template-request.md
  lifecycle:
  - draft
  - ready_for_review
  - approved
- id: validation-report
  title: Validation Report
  owner_role: maintainer
  type: markdown
  required: true
  template: artifact-template
  path_hint: .pf/artifacts/validation-report.md
  lifecycle:
  - draft
  - ready_for_review
  - approved
- id: review
  title: Review
  owner_role: maintainer
  type: markdown
  required: true
  template: artifact-template
  path_hint: .pf/artifacts/review.md
  lifecycle:
  - draft
  - ready_for_review
  - approved
gates:
- id: request-complete
  description: Process purpose and boundaries are explicit.
  blocking: true
  type: checklist
  required: true
- id: process-reviewed
  description: Process schema, artifacts, gates, and resource mapping are validated.
  blocking: true
  type: checklist
  required: true
required_packages:
- process-forge-knowledge-governance
- process-forge-core
required_templates:
- process-definition-template
allowed_tools:
- validator
forbidden_actions:
- create_runner_dependency
evolution_policy:
  active_run_upgrade:
    default: manual_only
  protected_artifacts:
  - review
  safe_changes:
  - add_optional_stage
  blocked_changes:
  - make_runner_required
catalog:
  classification: PUBLIC_STABLE
  public_surface: true
  strict_contract: true
public_surface: true
execution_mode: single_agent
coordination_requirements:
  mode: simple_allowed
  director_inbox:
    required: false
    optional: false
  error_workflow:
    mode: none
  simple_mode_behavior: disable_director_features
error_handling:
  enabled: false
  mode: none
  fallback_if_no_director: needs_operator
responsibility_boundaries:
  operator:
  - Provides the objective, constraints, approvals, and final acceptance.
  primary_agent:
  - Executes the process stages, writes required artifacts, and runs gates.
  director:
  - Coordinates handoffs and leases only when the effective project mode requires Director.
  inspector:
  - Verifies runtime state, CLI gates, and worker proof artifacts when applicable.
  worker:
  - Works only from an assigned capsule and writes declared outputs.
  cli_tools:
  - Run deterministic ProcessForge checks and write machine-readable results.
subagent_policy:
  allowed: false
  require_reports: false
  allowed_roles: []
process_transitions: []
stage_completion:
  handoff_note_required: true
run_completion:
  summary_required: true
  handoff_artifact_required: true
process_pack:
  package: process-forge-knowledge-governance
  example_required: true
agent_prompt:
  required: true
