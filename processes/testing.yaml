schema_version: 1
id: testing
name: Testing
version: 1.0.0
status: active
description: Plan, execute, and report a testing pass.
required_capabilities:
- test_planning
- test_execution
- reporting
hooks:
  emit:
  - event: process.started
    required: true
  - event: stage.started
    required: true
  - event: stage.completed
    required: true
  - event: assignment.created
    required: true
  - event: artifact.created
    required: true
  - event: gate.failed
    required: true
  - event: chat.message.recorded
    required: false
  subscriptions:
  - event: assignment.completed
    actions:
    - type: create_review_request
  - event: gate.failed
    actions:
    - type: block_stage
    - type: notify_orchestrator
  tracking:
    include:
    - process_id
    - process_version
    - stage_id
    - assignment_id
    - artifact_refs
    - actor
    - session_id
    - status
roles:
- id: test-lead
  title: Test Lead
  responsibility: Defines test scope and evidence requirements.
  kind: primary_agent
  responsibilities:
  - Defines test scope and evidence requirements.
- id: tester
  title: Tester
  responsibility: Executes tests and records evidence.
  kind: primary_agent
  responsibilities:
  - Executes tests and records evidence.
stages:
- id: plan
  title: Plan
  description: Define test coverage and data.
  required_inputs: []
  produced_artifacts:
  - test-plan
  required_role: test-lead
  required_capabilities:
  - test_planning
  allowed_tools: []
  entry_gates: []
  exit_gates:
  - test-plan-ready
  goal: Define test coverage and data.
  actor: primary_agent
  gates:
  - test-plan-ready
- id: execute
  title: Execute
  description: Run test cases and record evidence.
  required_inputs:
  - test-plan
  produced_artifacts:
  - test-cases
  - evidence-log
  required_role: tester
  required_capabilities:
  - test_execution
  allowed_tools:
  - test_runner
  - browser_verification
  entry_gates:
  - test-plan-ready
  exit_gates:
  - evidence-recorded
  goal: Run test cases and record evidence.
  actor: primary_agent
  gates:
  - evidence-recorded
- id: report
  title: Report
  description: Summarize findings and residual risk.
  required_inputs:
  - evidence-log
  produced_artifacts:
  - test-report
  required_role: test-lead
  required_capabilities:
  - reporting
  allowed_tools:
  - validator
  entry_gates:
  - evidence-recorded
  exit_gates:
  - report-ready
  goal: Summarize findings and residual risk.
  actor: primary_agent
  gates:
  - report-ready
artifact_definitions:
- id: test-plan
  title: Test Plan
  owner_role: test-lead
  template: artifact-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/test-plan.md
- id: evidence-log
  title: Evidence Log
  owner_role: tester
  template: artifact-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/evidence-log.md
- id: test-report
  title: Test Report
  owner_role: test-lead
  template: validation-report-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/test-report.md
- id: test-cases
  title: Test Cases
  owner_role: tester
  type: markdown
  required: true
  template: artifact-template
  path_hint: .pf/artifacts/test-cases.md
  lifecycle:
  - draft
  - ready_for_review
  - approved
gates:
- id: test-plan-ready
  description: Test scope and data are explicit.
  blocking: true
  type: checklist
  required: true
- id: evidence-recorded
  description: Evidence exists for executed cases.
  blocking: true
  type: checklist
  required: true
- id: report-ready
  description: Results and residual risks are recorded.
  blocking: true
  type: checklist
  required: true
required_packages:
- process-forge-core
- process-forge-testing
required_templates:
- artifact-template
- validation-report-template
allowed_tools:
- test_runner
- browser_verification
- validator
forbidden_actions:
- claim_unexecuted_tests_as_passed
evolve:
  enabled: true
  mode: optional
  timing: end_of_run
  default_scope: project
  candidate_targets:
  - regression_check
  - knowledge_package
  - process_definition
  extraction_hints:
  - Split candidates when an observation contains project-specific and platform-general parts.
  - Default to the narrowest safe scope and require evidence before parent-platform promotion.
  - regression check
  - missing knowledge
  - process improvement
  - Route reusable test gaps to regression_check candidates.
  - Route test-process sequencing changes to process_definition candidates.
  candidate_targeting:
    default_scope: project
    require_applicability: true
    require_target: true
    default_to_narrowest_scope: true
  required_outputs:
  - evolution-report
  privacy:
    default_sensitivity: internal
    export_requires_sanitization: true
    allow_private_paths: false
  apply_policy:
    auto_apply_global: false
    create_candidates_only: true

evolution_policy:
  active_run_upgrade:
    default: manual_only
  protected_artifacts:
  - test-report
  safe_changes:
  - add_optional_case
  blocked_changes:
  - remove_required_evidence_after_execution
  requires_approval:
  - change_pass_criteria
catalog:
  classification: PUBLIC_STABLE
  public_surface: true
  strict_contract: true
public_surface: true
execution_mode: single_agent
coordination_requirements:
  mode: simple_allowed
  director_inbox:
    required: false
    optional: false
  error_workflow:
    mode: none
  simple_mode_behavior: disable_director_features
error_handling:
  enabled: false
  mode: none
  fallback_if_no_director: needs_operator
responsibility_boundaries:
  operator:
  - Provides the objective, constraints, approvals, and final acceptance.
  primary_agent:
  - Executes the process stages, writes required artifacts, and runs gates.
  director:
  - Coordinates handoffs and leases only when the effective project mode requires Director.
  inspector:
  - Verifies runtime state, CLI gates, and worker proof artifacts when applicable.
  worker:
  - Works only from an assigned capsule and writes declared outputs.
  cli_tools:
  - Run deterministic ProcessForge checks and write machine-readable results.
subagent_policy:
  allowed: false
  require_reports: false
  allowed_roles: []
process_transitions: []
stage_completion:
  handoff_note_required: true
run_completion:
  summary_required: true
  handoff_artifact_required: true
process_pack:
  package: process-forge-testing
  example_required: true
agent_prompt:
  required: true
