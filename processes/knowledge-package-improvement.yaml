schema_version: 1
id: knowledge-package-improvement
name: Knowledge Package Improvement
version: 1.0.0
status: active
description: Propose, review, and integrate reusable process knowledge.
required_capabilities:
- research
- process_governance
- review
hooks:
  emit:
  - event: process.started
    required: true
  - event: stage.started
    required: true
  - event: stage.completed
    required: true
  - event: assignment.created
    required: true
  - event: artifact.created
    required: true
  - event: gate.failed
    required: true
  - event: chat.message.recorded
    required: false
  subscriptions:
  - event: assignment.completed
    actions:
    - type: create_review_request
  - event: gate.failed
    actions:
    - type: block_stage
    - type: notify_orchestrator
  tracking:
    include:
    - process_id
    - process_version
    - stage_id
    - assignment_id
    - artifact_refs
    - actor
    - session_id
    - status
roles:
- id: proposer
  title: Proposer
  responsibility: Captures reusable learning.
  kind: primary_agent
  responsibilities:
  - Captures reusable learning.
- id: maintainer
  title: Maintainer
  responsibility: Reviews compatibility and applies accepted changes.
  kind: primary_agent
  responsibilities:
  - Reviews compatibility and applies accepted changes.
stages:
- id: propose
  title: Propose
  description: Create an evolution proposal.
  required_inputs: []
  produced_artifacts:
  - evolution-proposal
  required_role: proposer
  required_capabilities:
  - research
  allowed_tools: []
  entry_gates: []
  exit_gates:
  - proposal-complete
  goal: Create an evolution proposal.
  actor: primary_agent
  gates:
  - proposal-complete
- id: assess
  title: Assess
  description: Evaluate target layer and compatibility.
  required_inputs:
  - evolution-proposal
  produced_artifacts:
  - compatibility-review
  required_role: maintainer
  required_capabilities:
  - process_governance
  allowed_tools:
  - validator
  entry_gates:
  - proposal-complete
  exit_gates:
  - compatibility-reviewed
  goal: Evaluate target layer and compatibility.
  actor: primary_agent
  gates:
  - compatibility-reviewed
- id: integrate
  title: Integrate
  description: Apply accepted reusable knowledge.
  required_inputs:
  - compatibility-review
  produced_artifacts:
  - change-summary
  required_role: maintainer
  required_capabilities:
  - repository_write
  allowed_tools:
  - editor
  - validator
  entry_gates:
  - compatibility-reviewed
  exit_gates:
  - package-updated
  goal: Apply accepted reusable knowledge.
  actor: primary_agent
  gates:
  - package-updated
artifact_definitions:
- id: evolution-proposal
  title: Evolution Proposal
  owner_role: proposer
  template: artifact-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/evolution-proposal.md
- id: compatibility-review
  title: Compatibility Review
  owner_role: maintainer
  template: review-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/compatibility-review.md
- id: change-summary
  title: Change Summary
  owner_role: maintainer
  type: markdown
  required: true
  template: artifact-template
  path_hint: .pf/artifacts/change-summary.md
  lifecycle:
  - draft
  - ready_for_review
  - approved
gates:
- id: proposal-complete
  description: Proposal includes target layer, rationale, and risk.
  blocking: true
  type: checklist
  required: true
- id: compatibility-reviewed
  description: Compatibility and approval needs are recorded.
  blocking: true
  type: checklist
  required: true
- id: package-updated
  description: Accepted change is integrated and validated.
  blocking: true
  type: checklist
  required: true
required_packages:
- process-forge-core
- process-forge-knowledge-governance
required_templates:
- artifact-template
- review-template
allowed_tools:
- validator
forbidden_actions:
- change_rules_without_review
evolution_policy:
  active_run_upgrade:
    default: manual_only
  protected_artifacts:
  - compatibility-review
  safe_changes:
  - add_optional_rule
  blocked_changes:
  - weaken_locked_policy_without_approval
  requires_approval:
  - promote_task_learning_to_core_rule
catalog:
  classification: PUBLIC_STABLE
  public_surface: true
  strict_contract: true
public_surface: true
execution_mode: single_agent
coordination_requirements:
  mode: simple_allowed
  director_inbox:
    required: false
    optional: false
  error_workflow:
    mode: none
  simple_mode_behavior: disable_director_features
error_handling:
  enabled: false
  mode: none
  fallback_if_no_director: needs_operator
responsibility_boundaries:
  operator:
  - Provides the objective, constraints, approvals, and final acceptance.
  primary_agent:
  - Executes the process stages, writes required artifacts, and runs gates.
  director:
  - Coordinates handoffs and leases only when the effective project mode requires Director.
  inspector:
  - Verifies runtime state, CLI gates, and worker proof artifacts when applicable.
  worker:
  - Works only from an assigned capsule and writes declared outputs.
  cli_tools:
  - Run deterministic ProcessForge checks and write machine-readable results.
subagent_policy:
  allowed: false
  require_reports: false
  allowed_roles: []
process_transitions: []
stage_completion:
  handoff_note_required: true
run_completion:
  summary_required: true
  handoff_artifact_required: true
process_pack:
  package: process-forge-knowledge-governance
  example_required: true
agent_prompt:
  required: true
