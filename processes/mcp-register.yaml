schema_version: 1
id: mcp-register
name: MCP Register
version: 1.0.0
status: active
description: Register an MCP capability provider through proposal, transport/config definition, registry update, and review.
required_capabilities:
- repository_write
hooks:
  emit:
  - event: mcp.registered
    required: true
  - event: mcp.healthcheck.passed
    required: false
  - event: mcp.healthcheck.failed
    required: false
roles:
- id: maintainer
  title: Maintainer
  responsibility: Resolves capability, transport, command, auth reference, and registry entry.
  kind: primary_agent
  responsibilities:
  - Resolves capability, transport, command, auth reference, and registry entry.
stages:
- id: intake
  title: Intake
  description: Capture MCP id, capability, transport, command, status, and auth reference name.
  required_inputs: []
  produced_artifacts:
  - mcp-registration-request
  required_role: maintainer
  required_capabilities:
  - markdown_editing
  allowed_tools: []
  entry_gates: []
  exit_gates:
  - request-complete
  goal: Capture MCP id, capability, transport, command, status, and auth reference name.
  actor: primary_agent
  gates:
  - request-complete
- id: registry-update
  title: Registry Update
  description: Update registries/mcp.yaml without storing secrets.
  required_inputs:
  - mcp-registration-request
  produced_artifacts:
  - mcp-definition
  - validation-report
  - review
  required_role: maintainer
  required_capabilities:
  - repository_write
  allowed_tools:
  - processforge-cli
  entry_gates:
  - request-complete
  exit_gates:
  - mcp-reviewed
  goal: Update registries/mcp.yaml without storing secrets.
  actor: primary_agent
  gates:
  - mcp-reviewed
artifact_definitions:
- id: mcp-definition
  title: MCP Definition
  owner_role: maintainer
  template: mcp-definition
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/mcp-definition.md
- id: mcp-registration-request
  title: Mcp Registration Request
  owner_role: maintainer
  type: markdown
  required: true
  template: artifact-template
  path_hint: .pf/artifacts/mcp-registration-request.md
  lifecycle:
  - draft
  - ready_for_review
  - approved
- id: validation-report
  title: Validation Report
  owner_role: maintainer
  type: markdown
  required: true
  template: artifact-template
  path_hint: .pf/artifacts/validation-report.md
  lifecycle:
  - draft
  - ready_for_review
  - approved
- id: review
  title: Review
  owner_role: maintainer
  type: markdown
  required: true
  template: artifact-template
  path_hint: .pf/artifacts/review.md
  lifecycle:
  - draft
  - ready_for_review
  - approved
gates:
- id: request-complete
  description: MCP id, capability, command, transport, and auth reference are explicit.
  blocking: true
  type: checklist
  required: true
- id: mcp-reviewed
  description: Registry entry contains no secrets and transport constraints are documented.
  blocking: true
  type: checklist
  required: true
required_packages:
- process-forge-knowledge-governance
- process-forge-core
required_templates:
- mcp-definition.yaml
allowed_tools:
- processforge-cli
forbidden_actions:
- store_secret_values
evolve:
  enabled: true
  mode: optional
  timing: end_of_run
  default_scope: project
  candidate_targets:
  - knowledge_package
  - template_package
  - process_definition
  - delivery_profile
  - project_rule
  - workplace_rule
  - platform_contract
  extraction_hints:
  - Split candidates when an observation contains project-specific and platform-general parts.
  - Default to the narrowest safe scope and require evidence before parent-platform promotion.
  - reusable rule
  - missing knowledge
  - template improvement
  - regression check
  - process improvement
  candidate_targeting:
    default_scope: project
    require_applicability: true
    require_target: true
    default_to_narrowest_scope: true
  required_outputs:
  - evolution-report
  privacy:
    default_sensitivity: internal
    export_requires_sanitization: true
    allow_private_paths: false
  apply_policy:
    auto_apply_global: false
    create_candidates_only: true

evolution_policy:
  active_run_upgrade:
    default: manual_only
  protected_artifacts:
  - review
  safe_changes:
  - add_optional_mcp
  blocked_changes:
  - store_secret_in_command
catalog:
  classification: PUBLIC_STABLE
  public_surface: true
  strict_contract: true
public_surface: true
execution_mode: single_agent
coordination_requirements:
  mode: simple_allowed
  director_inbox:
    required: false
    optional: false
  error_workflow:
    mode: none
  simple_mode_behavior: disable_director_features
error_handling:
  enabled: false
  mode: none
  fallback_if_no_director: needs_operator
responsibility_boundaries:
  operator:
  - Provides the objective, constraints, approvals, and final acceptance.
  primary_agent:
  - Executes the process stages, writes required artifacts, and runs gates.
  director:
  - Coordinates handoffs and leases only when the effective project mode requires Director.
  inspector:
  - Verifies runtime state, CLI gates, and worker proof artifacts when applicable.
  worker:
  - Works only from an assigned capsule and writes declared outputs.
  cli_tools:
  - Run deterministic ProcessForge checks and write machine-readable results.
subagent_policy:
  allowed: false
  require_reports: false
  allowed_roles: []
process_transitions: []
stage_completion:
  handoff_note_required: true
run_completion:
  summary_required: true
  handoff_artifact_required: true
process_pack:
  package: process-forge-knowledge-governance
  example_required: true
agent_prompt:
  required: true
