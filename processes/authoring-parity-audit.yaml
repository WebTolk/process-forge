schema_version: 1
id: authoring-parity-audit
name: Authoring Parity Audit
kind: release_audit
scope: project
version: 1.0.0
status: internal
description: Audit existing ProcessForge processes and resources against authoring workflows to prove they can be reproduced
  or explained through authoring metadata.
purpose: Ensure built-in ProcessForge processes and resources are not untracked manual exceptions before public release.
required_capabilities:
- repository_read
- artifact_review
- reporting
hooks:
  emit:
  - event: authoring_parity.started
    required: true
  - event: authoring_parity.process.checked
    required: true
  - event: authoring_parity.resource.checked
    required: true
  - event: authoring_parity.warning
    required: true
  - event: authoring_parity.failed
    required: true
  - event: authoring_parity.completed
    required: true
  tracking:
    include:
    - process_id
    - resource_id
    - parity_result
    - artifact_refs
    - status
run_model:
  supports_multiple_tasks: false
  default_task_loop:
    enabled: false
    iteration_kinds:
    - work
    - review
    - handoff
roles:
- id: parity-auditor
  title: Parity Auditor
  responsibility: Imports existing definitions and compares authoring candidates.
  kind: primary_agent
  responsibilities:
  - Imports existing definitions and compares authoring candidates.
- id: release-reviewer
  title: Release Reviewer
  responsibility: Reviews WARN and FAIL findings before release.
  kind: primary_agent
  responsibilities:
  - Reviews WARN and FAIL findings before release.
stages:
- id: intake
  title: Intake
  description: Define audit scope and critical built-in processes.
  required_inputs: []
  produced_artifacts:
  - parity-scope
  required_role: parity-auditor
  entry_gates: []
  exit_gates:
  - parity-scope-approved
  goal: Define audit scope and critical built-in processes.
  actor: primary_agent
  gates:
  - parity-scope-approved
- id: discover-existing-processes
  title: Discover Existing Processes
  description: Enumerate process definitions and discover resource candidates.
  required_inputs:
  - parity-scope
  produced_artifacts:
  - parity-inventory
  required_role: parity-auditor
  entry_gates:
  - parity-scope-approved
  exit_gates:
  - parity-inventory-ready
  goal: Enumerate process definitions and discover resource candidates.
  actor: primary_agent
  gates:
  - parity-inventory-ready
- id: import-authoring-answers
  title: Import Authoring Answers
  description: Backfill authoring answers, source snapshots, semantic maps, and unsupported-field records.
  required_inputs:
  - parity-inventory
  produced_artifacts:
  - authoring-backfill
  required_role: parity-auditor
  entry_gates:
  - parity-inventory-ready
  exit_gates:
  - authoring-backfill-created
  goal: Backfill authoring answers, source snapshots, semantic maps, and unsupported-field records.
  actor: primary_agent
  gates:
  - authoring-backfill-created
- id: generate-candidates
  title: Generate Candidates
  description: Generate draft process candidates from backfilled answers.
  required_inputs:
  - authoring-backfill
  produced_artifacts:
  - parity-candidates
  required_role: parity-auditor
  entry_gates:
  - authoring-backfill-created
  exit_gates:
  - parity-candidates-ready
  goal: Generate draft process candidates from backfilled answers.
  actor: primary_agent
  gates:
  - parity-candidates-ready
- id: semantic-compare
  title: Semantic Compare
  description: Compare process meaning instead of byte-identical YAML formatting.
  required_inputs:
  - parity-candidates
  produced_artifacts:
  - semantic-diff
  required_role: parity-auditor
  entry_gates:
  - parity-candidates-ready
  exit_gates:
  - semantic-diff-reviewed
  goal: Compare process meaning instead of byte-identical YAML formatting.
  actor: primary_agent
  gates:
  - semantic-diff-reviewed
- id: doctor-candidates
  title: Doctor Candidates
  description: Validate candidate definitions with process logic checks.
  required_inputs:
  - semantic-diff
  produced_artifacts:
  - candidate-doctor-report
  required_role: parity-auditor
  entry_gates:
  - semantic-diff-reviewed
  exit_gates:
  - candidate-doctor-complete
  goal: Validate candidate definitions with process logic checks.
  actor: primary_agent
  gates:
  - candidate-doctor-complete
- id: resource-parity-checks
  title: Resource Parity Checks
  description: Check templates, knowledge packages, and platform contracts where discovery is available.
  required_inputs:
  - parity-inventory
  produced_artifacts:
  - resource-parity-report
  required_role: parity-auditor
  entry_gates:
  - parity-inventory-ready
  exit_gates:
  - resource-parity-reviewed
  goal: Check templates, knowledge packages, and platform contracts where discovery is available.
  actor: primary_agent
  gates:
  - resource-parity-reviewed
- id: report-findings
  title: Report Findings
  description: Summarize PASS, WARN, FAIL, unsupported fields, and recommendations.
  required_inputs:
  - semantic-diff
  - resource-parity-report
  produced_artifacts:
  - authoring-parity-report
  required_role: release-reviewer
  entry_gates:
  - candidate-doctor-complete
  - resource-parity-reviewed
  exit_gates:
  - authoring-parity-report-approved
  goal: Summarize PASS, WARN, FAIL, unsupported fields, and recommendations.
  actor: primary_agent
  gates:
  - authoring-parity-report-approved
- id: handoff
  title: Handoff
  description: Hand off release risks and follow-up actions.
  required_inputs:
  - authoring-parity-report
  produced_artifacts:
  - authoring-parity-handoff
  required_role: release-reviewer
  entry_gates:
  - authoring-parity-report-approved
  exit_gates:
  - authoring-parity-handoff-created
  goal: Hand off release risks and follow-up actions.
  actor: primary_agent
  gates:
  - authoring-parity-handoff-created
artifact_definitions:
- id: parity-scope
  title: Parity Scope
  owner_role: parity-auditor
  template: artifact-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/parity-scope.md
- id: parity-inventory
  title: Parity Inventory
  owner_role: parity-auditor
  template: artifact-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/parity-inventory.md
- id: authoring-backfill
  title: Authoring Backfill
  owner_role: parity-auditor
  template: process-authoring-answers
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/authoring-backfill.md
- id: parity-candidates
  title: Parity Candidates
  owner_role: parity-auditor
  template: process-definition-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/parity-candidates.md
- id: semantic-diff
  title: Semantic Diff
  owner_role: parity-auditor
  template: artifact-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/semantic-diff.md
- id: candidate-doctor-report
  title: Candidate Doctor Report
  owner_role: parity-auditor
  template: validation-report-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/candidate-doctor-report.md
- id: resource-parity-report
  title: Resource Parity Report
  owner_role: parity-auditor
  template: validation-report-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/resource-parity-report.md
- id: authoring-parity-report
  title: Authoring Parity Report
  owner_role: release-reviewer
  template: validation-report-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/authoring-parity-report.md
- id: authoring-parity-handoff
  title: Authoring Parity Handoff
  owner_role: release-reviewer
  template: handoff-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/authoring-parity-handoff.md
gates:
- id: parity-scope-approved
  description: Audit scope and critical built-ins are explicit.
  blocking: true
  required_artifact: parity-scope
  type: artifact_exists
  required: true
- id: parity-inventory-ready
  description: Existing processes and discoverable resources are listed.
  blocking: true
  required_artifact: parity-inventory
  type: artifact_exists
  required: true
- id: authoring-backfill-created
  description: Backfill files exist without changing source definitions.
  blocking: true
  required_artifact: authoring-backfill
  type: artifact_exists
  required: true
- id: parity-candidates-ready
  description: Candidate drafts were generated from backfilled answers.
  blocking: true
  required_artifact: parity-candidates
  type: artifact_exists
  required: true
- id: semantic-diff-reviewed
  description: Semantic differences are classified as PASS, WARN, or FAIL.
  blocking: true
  required_artifact: semantic-diff
  type: artifact_exists
  required: true
- id: candidate-doctor-complete
  description: Candidate logic checks completed and critical built-ins do not FAIL.
  blocking: true
  required_artifact: candidate-doctor-report
  type: artifact_exists
  required: true
- id: resource-parity-reviewed
  description: Resource parity checks ran or recorded SKIP reasons.
  blocking: true
  required_artifact: resource-parity-report
  type: artifact_exists
  required: true
- id: authoring-parity-report-approved
  description: Report lists counts, unsupported fields, commands, docs, tests, and limitations.
  blocking: true
  required_artifact: authoring-parity-report
  type: artifact_exists
  required: true
- id: authoring-parity-handoff-created
  description: Handoff records release risks and next actions.
  blocking: true
  required_artifact: authoring-parity-handoff
  type: artifact_exists
  required: true
required_packages:
- process-forge-knowledge-governance
- process-forge-core
required_templates:
- process-authoring-answers
- process-definition-template
- validation-report-template
- handoff-template
allowed_tools:
- processforge-cli
- validator
forbidden_actions:
- edit_source_process_without_apply_to_source
- require_byte_identical_yaml
- hide_warn_findings
- write_private_absolute_paths_to_public_files
evolve:
  enabled: true
  mode: optional
  timing: end_of_run
  default_scope: project
  candidate_targets:
  - knowledge_package
  - template_package
  - process_definition
  - delivery_profile
  - project_rule
  - workplace_rule
  - platform_contract
  extraction_hints:
  - Split candidates when an observation contains project-specific and platform-general parts.
  - Default to the narrowest safe scope and require evidence before parent-platform promotion.
  - reusable rule
  - missing knowledge
  - template improvement
  - regression check
  - process improvement
  candidate_targeting:
    default_scope: project
    require_applicability: true
    require_target: true
    default_to_narrowest_scope: true
  required_outputs:
  - evolution-report
  privacy:
    default_sensitivity: internal
    export_requires_sanitization: true
    allow_private_paths: false
  apply_policy:
    auto_apply_global: false
    create_candidates_only: true

evolution_policy:
  active_run_upgrade:
    default: manual_only
  safe_changes:
  - add_resource_discovery_skip_reason
  - add_warn_classification
  blocked_changes:
  - change_source_process_during_backfill
  - weaken_fail_on_missing_stage_gate_artifact
  requires_approval:
  - add_apply_to_source_mode
catalog:
  classification: INTERNAL_MAINTENANCE
  public_surface: false
  strict_contract: false
public_surface: false
execution_mode: single_agent
coordination_requirements:
  mode: simple_allowed
  director_inbox:
    required: false
    optional: false
  error_workflow:
    mode: none
  simple_mode_behavior: disable_director_features
error_handling:
  enabled: false
  mode: none
  fallback_if_no_director: needs_operator
responsibility_boundaries:
  operator:
  - Provides the objective, constraints, approvals, and final acceptance.
  primary_agent:
  - Executes the process stages, writes required artifacts, and runs gates.
  director:
  - Coordinates handoffs and leases only when the effective project mode requires Director.
  inspector:
  - Verifies runtime state, CLI gates, and worker proof artifacts when applicable.
  worker:
  - Works only from an assigned capsule and writes declared outputs.
  cli_tools:
  - Run deterministic ProcessForge checks and write machine-readable results.
subagent_policy:
  allowed: false
  require_reports: false
  allowed_roles: []
process_transitions: []
stage_completion:
  handoff_note_required: true
run_completion:
  summary_required: true
  handoff_artifact_required: true
process_pack:
  package: process-forge-knowledge-governance
  example_required: false
agent_prompt:
  required: false
