schema_version: 1
id: template-add
name: Template Add
version: 1.0.0
status: active
description: Add a simple reusable template folder with README guidance and optional registry update.
required_capabilities:
- repository_read
- repository_write
hooks:
  emit:
  - event: template.add.requested
    required: true
  - event: template.added
    required: true
  - event: template.updated
    required: false
roles:
- id: maintainer
  title: Maintainer
  responsibility: Resolves template type, creates folder, writes README, copies payload, and validates.
  kind: primary_agent
  responsibilities:
  - Resolves template type, creates folder, writes README, copies payload, and validates.
stages:
- id: intake
  title: Intake
  description: Capture template type, id, source, and target use case.
  required_inputs: []
  produced_artifacts:
  - template-add-request
  required_role: maintainer
  required_capabilities:
  - markdown_editing
  allowed_tools: []
  entry_gates: []
  exit_gates:
  - request-complete
  goal: Capture template type, id, source, and target use case.
  actor: primary_agent
  gates:
  - request-complete
- id: template-folder-creation
  title: Template Folder Creation
  description: Create templates/file/<template-id>/ with README and payload files.
  required_inputs:
  - template-add-request
  produced_artifacts:
  - template-package
  - validation-report
  - review
  required_role: maintainer
  required_capabilities:
  - repository_write
  allowed_tools:
  - processforge-cli
  entry_gates:
  - request-complete
  exit_gates:
  - template-reviewed
  goal: Create templates/file/<template-id>/ with README and payload files.
  actor: primary_agent
  gates:
  - template-reviewed
artifact_definitions:
- id: template-package
  title: Template Package
  owner_role: maintainer
  template: template-package
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/template-package.md
- id: template-add-request
  title: Template Add Request
  owner_role: maintainer
  type: markdown
  required: true
  template: artifact-template
  path_hint: .pf/artifacts/template-add-request.md
  lifecycle:
  - draft
  - ready_for_review
  - approved
- id: validation-report
  title: Validation Report
  owner_role: maintainer
  type: markdown
  required: true
  template: artifact-template
  path_hint: .pf/artifacts/validation-report.md
  lifecycle:
  - draft
  - ready_for_review
  - approved
- id: review
  title: Review
  owner_role: maintainer
  type: markdown
  required: true
  template: artifact-template
  path_hint: .pf/artifacts/review.md
  lifecycle:
  - draft
  - ready_for_review
  - approved
gates:
- id: request-complete
  description: Template id, type, and source are clear.
  blocking: true
  type: checklist
  required: true
- id: template-reviewed
  description: README explains placeholders, adaptation, limits, and verification.
  blocking: true
  type: checklist
  required: true
required_packages:
- process-forge-knowledge-governance
- process-forge-core
required_templates:
- template-readme-template.md
allowed_tools:
- processforge-cli
forbidden_actions:
- add_template_without_readme
evolution_policy:
  active_run_upgrade:
    default: manual_only
  protected_artifacts:
  - review
  safe_changes:
  - add_payload_file
  blocked_changes:
  - overwrite_existing_template_without_review
catalog:
  classification: PUBLIC_STABLE
  public_surface: true
  strict_contract: true
public_surface: true
execution_mode: single_agent
coordination_requirements:
  mode: simple_allowed
  director_inbox:
    required: false
    optional: false
  error_workflow:
    mode: none
  simple_mode_behavior: disable_director_features
error_handling:
  enabled: false
  mode: none
  fallback_if_no_director: needs_operator
responsibility_boundaries:
  operator:
  - Provides the objective, constraints, approvals, and final acceptance.
  primary_agent:
  - Executes the process stages, writes required artifacts, and runs gates.
  director:
  - Coordinates handoffs and leases only when the effective project mode requires Director.
  inspector:
  - Verifies runtime state, CLI gates, and worker proof artifacts when applicable.
  worker:
  - Works only from an assigned capsule and writes declared outputs.
  cli_tools:
  - Run deterministic ProcessForge checks and write machine-readable results.
subagent_policy:
  allowed: false
  require_reports: false
  allowed_roles: []
process_transitions: []
stage_completion:
  handoff_note_required: true
run_completion:
  summary_required: true
  handoff_artifact_required: true
process_pack:
  package: process-forge-knowledge-governance
  example_required: true
agent_prompt:
  required: true
