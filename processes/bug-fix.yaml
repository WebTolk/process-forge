schema_version: 1
id: bug-fix
name: Bug Fix
version: 1.0.0
status: active
description: Reproduce, fix, verify, and document a defect.
required_capabilities:
- repository_read
- repository_write
- test_running
hooks:
  emit:
  - event: process.started
    required: true
  - event: stage.started
    required: true
  - event: stage.completed
    required: true
  - event: assignment.created
    required: true
  - event: artifact.created
    required: true
  - event: gate.failed
    required: true
  - event: chat.message.recorded
    required: false
  subscriptions:
  - event: assignment.completed
    actions:
    - type: create_review_request
  - event: gate.failed
    actions:
    - type: block_stage
    - type: notify_orchestrator
  tracking:
    include:
    - process_id
    - process_version
    - stage_id
    - assignment_id
    - artifact_refs
    - actor
    - session_id
    - status
roles:
- id: triager
  title: Triager
  responsibility: Confirms the defect and impact.
  kind: primary_agent
  responsibilities:
  - Confirms the defect and impact.
- id: developer
  title: Developer
  responsibility: Fixes the defect.
  kind: primary_agent
  responsibilities:
  - Fixes the defect.
- id: reviewer
  title: Reviewer
  responsibility: Checks regression risk.
  kind: primary_agent
  responsibilities:
  - Checks regression risk.
stages:
- id: reproduce
  title: Reproduce
  description: Capture expected and actual behavior.
  required_inputs: []
  produced_artifacts:
  - reproduction-report
  required_role: triager
  required_capabilities:
  - investigation
  allowed_tools:
  - test_runner
  entry_gates: []
  exit_gates:
  - defect-reproduced
  goal: Capture expected and actual behavior.
  actor: primary_agent
  gates:
  - defect-reproduced
- id: fix
  title: Fix
  description: Apply the smallest coherent fix.
  required_inputs:
  - reproduction-report
  produced_artifacts:
  - changed-files
  - change-summary
  required_role: developer
  required_capabilities:
  - repository_write
  allowed_tools:
  - editor
  - test_runner
  entry_gates:
  - defect-reproduced
  exit_gates:
  - fix-recorded
  goal: Apply the smallest coherent fix.
  actor: primary_agent
  gates:
  - fix-recorded
- id: verify
  title: Verify
  description: Check fix and regression risk.
  required_inputs:
  - change-summary
  produced_artifacts:
  - test-report
  - review-findings
  required_role: reviewer
  required_capabilities:
  - review
  - test_running
  allowed_tools:
  - test_runner
  - validator
  entry_gates:
  - fix-recorded
  exit_gates:
  - verification-complete
  goal: Check fix and regression risk.
  actor: primary_agent
  gates:
  - verification-complete
artifact_definitions:
- id: reproduction-report
  title: Reproduction Report
  owner_role: triager
  template: artifact-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/reproduction-report.md
- id: change-summary
  title: Change Summary
  owner_role: developer
  template: artifact-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/change-summary.md
- id: test-report
  title: Test Report
  owner_role: reviewer
  template: validation-report-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/test-report.md
- id: changed-files
  title: Changed Files
  owner_role: developer
  type: markdown
  required: true
  template: artifact-template
  path_hint: .pf/artifacts/changed-files.md
  lifecycle:
  - draft
  - ready_for_review
  - approved
- id: review-findings
  title: Review Findings
  owner_role: reviewer
  type: markdown
  required: true
  template: artifact-template
  path_hint: .pf/artifacts/review-findings.md
  lifecycle:
  - draft
  - ready_for_review
  - approved
gates:
- id: defect-reproduced
  description: The defect is observable or explicitly accepted as not reproducible.
  blocking: true
  type: checklist
  required: true
- id: fix-recorded
  description: The fix and changed files are recorded.
  blocking: true
  type: checklist
  required: true
- id: verification-complete
  description: Tests and review findings are recorded.
  blocking: true
  type: checklist
  required: true
required_packages:
- process-forge-core
- process-forge-software-development
required_templates:
- artifact-template
- validation-report-template
allowed_tools:
- test_runner
- validator
forbidden_actions:
- widen_scope_without_handoff
evolution_policy:
  active_run_upgrade:
    default: manual_only
  protected_artifacts:
  - reproduction-report
  - test-report
  safe_changes:
  - add_optional_artifact
  blocked_changes:
  - remove_existing_artifact_definition
  requires_approval:
  - add_required_gate
catalog:
  classification: PUBLIC_STABLE
  public_surface: true
  strict_contract: true
public_surface: true
execution_mode: single_agent
coordination_requirements:
  mode: simple_allowed
  director_inbox:
    required: false
    optional: false
  error_workflow:
    mode: none
  simple_mode_behavior: disable_director_features
error_handling:
  enabled: false
  mode: none
  fallback_if_no_director: needs_operator
responsibility_boundaries:
  operator:
  - Provides the objective, constraints, approvals, and final acceptance.
  primary_agent:
  - Executes the process stages, writes required artifacts, and runs gates.
  director:
  - Coordinates handoffs and leases only when the effective project mode requires Director.
  inspector:
  - Verifies runtime state, CLI gates, and worker proof artifacts when applicable.
  worker:
  - Works only from an assigned capsule and writes declared outputs.
  cli_tools:
  - Run deterministic ProcessForge checks and write machine-readable results.
subagent_policy:
  allowed: false
  require_reports: false
  allowed_roles: []
process_transitions: []
stage_completion:
  handoff_note_required: true
run_completion:
  summary_required: true
  handoff_artifact_required: true
process_pack:
  package: process-forge-software-development
  example_required: true
agent_prompt:
  required: true
