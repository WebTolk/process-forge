schema_version: 1
id: agent-director-supervision
name: Agent Director Supervision
version: 1.0.0
status: draft
kind: orchestration
description: Coordinates organized projects, multiple agent sessions, and process runs through pending handoffs, agent availability, leases, target runs, and continuation capsules; delegates task execution checks to the Process Execution Inspector.
execution_mode: process_factory
coordination_requirements:
  mode: organized_required
  director_inbox:
    required: false
    optional: true
  error_workflow:
    mode: director_inbox
error_handling:
  enabled: true
  mode: director_inbox
  fallback_if_no_director: fail_validation
roles:
  - id: agent-director
    title: Agent Director
    responsibility: Routes process handoffs, grants/revokes bounded leases, tracks unavailable or stale agents, and asks the execution inspector for runtime task state when needed.
stages:
  - id: inspect
    title: Inspect pending handoffs
    required_role: agent-director
    produced_artifacts: [director-tick-report]
    exit_gates: [handoff-status-known]
  - id: assign
    title: Assign available agent
    required_role: agent-director
    produced_artifacts: [director-tick-report]
    exit_gates: [handoff-status-known]
  - id: wait-or-return
    title: Wait or return
    required_role: agent-director
    produced_artifacts: [director-tick-report]
    exit_gates: [handoff-status-known]
artifact_definitions:
  - id: director-tick-report
    title: Director tick report
    owner_role: agent-director
    lifecycle: [draft, ready_for_review, approved]
gates:
  - id: project-effective-mode-known
    description: Each routed project has known effective coordination mode.
    blocking: true
  - id: organized-project-case-ready
    description: Organized project case is available before Director scheduling.
    blocking: true
  - id: simple-project-not-routed-to-director
    description: Simple projects are not routed to Director unless explicitly included.
    blocking: true
  - id: director-inbox-accepted
    description: Director inbox accepted required project messages.
    blocking: true
  - id: error-routed
    description: Error workflow resolved through Director inbox, process route, or operator escalation.
    blocking: true
  - id: handoff-status-known
    description: Every pending handoff remains waiting, becomes ready, or needs operator.
    blocking: true
required_capabilities:
  - repository_read
  - process.routing
  - lease.management
required_templates:
  - agent-director-policy
forbidden_actions:
  - start_network_service
  - call_external_agent_cli
  - start_shell_worker_process_directly
  - write_worker_process_runtime_state
  - infer_task_success_from_report_artifact
runtime_execution_boundary:
  inspector_process: process-supervisor
  rule: Director may request supervisor/execution-inspector CLI status, ticks, or reports, but must not infer task success from worker artifacts and must not write process.json, heartbeat.json, exit.json, or agent-run status files.
evolution_policy:
  versioning: additive
  compatibility: preserve_file_contracts
