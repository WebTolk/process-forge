schema_version: 1
id: orchestrator-shell-agents-supervision
name: Orchestrator Shell Agents Supervision
version: 1.0.0
status: experimental
kind: orchestration
description: Decomposes work into external shell-agent worker sessions launched through ProcessForge runtime drivers and governed
  by subagent policy metadata.
execution_mode: orchestrated_agents
roles:
- id: orchestrator
  title: Orchestrator
  responsibility: Creates worker assignments, leases, capsules, and delegates runtime checking to the execution inspector
    when shell workers run.
  kind: primary_agent
  responsibilities:
  - Creates worker assignments, leases, capsules, and delegates runtime checking to the execution inspector when shell workers
    run.
- id: shell-worker
  title: Shell Worker
  responsibility: Executes one assignment through a runtime driver.
  kind: worker_agent
  responsibilities:
  - Executes one assignment through a runtime driver.
stages:
- id: plan
  title: Plan shell workers
  required_role: orchestrator
  produced_artifacts:
  - orchestrator-shell-agent-plan
  exit_gates:
  - required-worker-outputs-exist
  goal: Plan shell workers
  actor: primary_agent
  gates:
  - required-worker-outputs-exist
- id: launch
  title: Launch shell workers
  required_role: orchestrator
  produced_artifacts:
  - worker-report
  exit_gates:
  - required-worker-outputs-exist
  goal: Launch shell workers
  actor: primary_agent
  gates:
  - required-worker-outputs-exist
- id: collect
  title: Collect outputs
  required_role: orchestrator
  produced_artifacts:
  - worker-report
  exit_gates:
  - required-worker-outputs-exist
  goal: Collect outputs
  actor: primary_agent
  gates:
  - required-worker-outputs-exist
artifact_definitions:
- id: orchestrator-shell-agent-plan
  title: Orchestrator shell-agent plan
  owner_role: orchestrator
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/orchestrator-shell-agent-plan.md
- id: worker-report
  title: Worker report
  owner_role: shell-worker
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/worker-report.md
gates:
- id: required-worker-outputs-exist
  description: Required worker outputs and required subagent reports exist.
  blocking: true
  type: checklist
  required: true
required_capabilities:
- assignment.execution
- report.writing
required_templates:
- orchestrator-shell-agent-plan
forbidden_actions:
- hardcode_real_agent_ecosystem_driver
- skip_subagent_report_validation
evolve:
  enabled: true
  mode: optional
  timing: end_of_run
  default_scope: project
  candidate_targets:
  - knowledge_package
  - template_package
  - process_definition
  - delivery_profile
  - project_rule
  - workplace_rule
  - platform_contract
  extraction_hints:
  - Split candidates when an observation contains project-specific and platform-general parts.
  - Default to the narrowest safe scope and require evidence before parent-platform promotion.
  - reusable rule
  - missing knowledge
  - template improvement
  - regression check
  - process improvement
  candidate_targeting:
    default_scope: project
    require_applicability: true
    require_target: true
    default_to_narrowest_scope: true
  required_outputs:
  - evolution-report
  privacy:
    default_sensitivity: internal
    export_requires_sanitization: true
    allow_private_paths: false
  apply_policy:
    auto_apply_global: false
    create_candidates_only: true

evolution_policy:
  versioning: additive
  compatibility: preserve_file_contracts
catalog:
  classification: PUBLIC_EXPERIMENTAL
  public_surface: true
  strict_contract: false
public_surface: true
coordination_requirements:
  mode: organized_required
  director_inbox:
    required: true
    optional: false
  error_workflow:
    mode: director_inbox
  simple_mode_behavior: fail_validation
error_handling:
  enabled: true
  mode: director_inbox
  fallback_if_no_director: fail_validation
responsibility_boundaries:
  operator:
  - Provides the objective, constraints, approvals, and final acceptance.
  primary_agent:
  - Executes the process stages, writes required artifacts, and runs gates.
  director:
  - Coordinates handoffs and leases only when the effective project mode requires Director.
  inspector:
  - Verifies runtime state, CLI gates, and worker proof artifacts when applicable.
  worker:
  - Works only from an assigned capsule and writes declared outputs.
  cli_tools:
  - Run deterministic ProcessForge checks and write machine-readable results.
subagent_policy:
  allowed: true
  require_reports: true
  allowed_roles:
  - worker_agent
runtime_requirements:
  supervisor_required: true
  runtime_driver_required: true
process_transitions: []
stage_completion:
  handoff_note_required: false
run_completion:
  summary_required: true
  handoff_artifact_required: false
required_packages:
- process-forge-testing
- process-forge-core
process_pack:
  package: process-forge-testing
  example_required: false
agent_prompt:
  required: false
