schema_version: 1
id: software-feature-development
name: Software Feature Development
version: 1.0.0
status: active
description: Govern a software feature from intake through release and evolution.
required_capabilities:
- repository_read
- repository_write
- test_running
- review
hooks:
  emit:
  - event: process.started
    required: true
  - event: stage.started
    required: true
  - event: stage.completed
    required: true
  - event: assignment.created
    required: true
  - event: artifact.created
    required: true
  - event: gate.failed
    required: true
  - event: chat.message.recorded
    required: false
  subscriptions:
  - event: assignment.completed
    actions:
    - type: create_review_request
  - event: gate.failed
    actions:
    - type: block_stage
    - type: notify_orchestrator
  tracking:
    include:
    - process_id
    - process_version
    - stage_id
    - assignment_id
    - artifact_refs
    - actor
    - session_id
    - status
roles:
- id: orchestrator
  title: Orchestrator
  responsibility: Coordinates stages, assignments, and handoffs.
  kind: primary_agent
  responsibilities:
  - Coordinates stages, assignments, and handoffs.
- id: developer
  title: Developer
  responsibility: Implements the approved change.
  kind: primary_agent
  responsibilities:
  - Implements the approved change.
- id: reviewer
  title: Reviewer
  responsibility: Reviews behavior, risks, and evidence.
  kind: primary_agent
  responsibilities:
  - Reviews behavior, risks, and evidence.
stages:
- id: intake
  title: Intake
  description: Capture goal and scope.
  required_inputs: []
  produced_artifacts:
  - brief
  - scope
  required_role: orchestrator
  required_capabilities:
  - process_coordination
  allowed_tools: []
  entry_gates: []
  exit_gates:
  - scope-recorded
  goal: Capture goal and scope.
  actor: primary_agent
  gates:
  - scope-recorded
- id: architecture
  title: Architecture
  description: Define design and implementation plan.
  required_inputs:
  - scope
  produced_artifacts:
  - decision-log
  - implementation-plan
  required_role: orchestrator
  required_capabilities:
  - architecture
  allowed_tools:
  - repository_symbol_analysis
  entry_gates:
  - scope-recorded
  exit_gates:
  - plan-approved
  goal: Define design and implementation plan.
  actor: primary_agent
  gates:
  - plan-approved
- id: implementation
  title: Implementation
  description: Make bounded changes.
  required_inputs:
  - implementation-plan
  produced_artifacts:
  - changed-files
  - change-summary
  required_role: developer
  required_capabilities:
  - repository_write
  allowed_tools:
  - editor
  - test_runner
  hooks:
    emit:
    - event: tool.invoked
    - event: artifact.created
    - event: artifact.updated
    stop_gates:
    - event: session.ended
      require:
      - gate.passed
  entry_gates:
  - plan-approved
  exit_gates:
  - changes-recorded
  goal: Make bounded changes.
  actor: primary_agent
  gates:
  - changes-recorded
- id: assurance
  title: Assurance
  description: Verify behavior and risks.
  required_inputs:
  - change-summary
  produced_artifacts:
  - review-findings
  - test-report
  required_role: reviewer
  required_capabilities:
  - review
  - test_running
  allowed_tools:
  - test_runner
  - validator
  entry_gates:
  - changes-recorded
  exit_gates:
  - assurance-complete
  goal: Verify behavior and risks.
  actor: primary_agent
  gates:
  - assurance-complete
artifact_definitions:
- id: brief
  title: Brief
  owner_role: orchestrator
  template: artifact-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/brief.md
- id: scope
  title: Scope
  owner_role: orchestrator
  template: artifact-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/scope.md
- id: implementation-plan
  title: Implementation Plan
  owner_role: orchestrator
  template: artifact-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/implementation-plan.md
- id: change-summary
  title: Change Summary
  owner_role: developer
  template: artifact-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/change-summary.md
- id: test-report
  title: Test Report
  owner_role: reviewer
  template: validation-report-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/test-report.md
- id: decision-log
  title: Decision Log
  owner_role: orchestrator
  type: markdown
  required: true
  template: artifact-template
  path_hint: .pf/artifacts/decision-log.md
  lifecycle:
  - draft
  - ready_for_review
  - approved
- id: changed-files
  title: Changed Files
  owner_role: developer
  type: markdown
  required: true
  template: artifact-template
  path_hint: .pf/artifacts/changed-files.md
  lifecycle:
  - draft
  - ready_for_review
  - approved
- id: review-findings
  title: Review Findings
  owner_role: reviewer
  type: markdown
  required: true
  template: artifact-template
  path_hint: .pf/artifacts/review-findings.md
  lifecycle:
  - draft
  - ready_for_review
  - approved
gates:
- id: scope-recorded
  description: Goal, exclusions, and allowed files are explicit.
  blocking: true
  type: checklist
  required: true
- id: plan-approved
  description: Architecture and implementation plan are ready.
  blocking: true
  type: checklist
  required: true
- id: changes-recorded
  description: Changed files and summary are recorded.
  blocking: true
  type: checklist
  required: true
- id: assurance-complete
  description: Review and tests are complete.
  blocking: true
  type: checklist
  required: true
required_packages:
- process-forge-core
- process-forge-software-development
required_templates:
- assignment-template
- artifact-template
- review-template
- handoff-template
allowed_tools:
- repository_symbol_analysis
- test_runner
- validator
forbidden_actions:
- edit_outside_assignment_scope
- skip_required_review
evolution_policy:
  active_run_upgrade:
    default: manual_only
  protected_artifacts:
  - scope
  - implementation-plan
  - test-report
  safe_changes:
  - add_optional_artifact
  - add_non_blocking_gate
  blocked_changes:
  - remove_existing_artifact_definition
  - change_approved_artifact_meaning
  requires_approval:
  - add_required_gate
  - change_exit_criteria
catalog:
  classification: PUBLIC_STABLE
  public_surface: true
  strict_contract: true
public_surface: true
execution_mode: single_agent
coordination_requirements:
  mode: simple_allowed
  director_inbox:
    required: false
    optional: false
  error_workflow:
    mode: none
  simple_mode_behavior: disable_director_features
error_handling:
  enabled: false
  mode: none
  fallback_if_no_director: needs_operator
responsibility_boundaries:
  operator:
  - Provides the objective, constraints, approvals, and final acceptance.
  primary_agent:
  - Executes the process stages, writes required artifacts, and runs gates.
  director:
  - Coordinates handoffs and leases only when the effective project mode requires Director.
  inspector:
  - Verifies runtime state, CLI gates, and worker proof artifacts when applicable.
  worker:
  - Works only from an assigned capsule and writes declared outputs.
  cli_tools:
  - Run deterministic ProcessForge checks and write machine-readable results.
subagent_policy:
  allowed: false
  require_reports: false
  allowed_roles: []
process_transitions: []
stage_completion:
  handoff_note_required: true
run_completion:
  summary_required: true
  handoff_artifact_required: true
process_pack:
  package: process-forge-software-development
  example_required: true
agent_prompt:
  required: true
