  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/project-init-review.md
- id: mcp-capability-report
  title: Mcp Capability Report
  owner_role: orchestrator
  type: markdown
  required: true
  template: artifact-template
  path_hint: .pf/artifacts/mcp-capability-report.md
