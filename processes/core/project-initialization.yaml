schema_version: 1
id: project-initialization
name: Project Initialization
version: 1.0.0
status: active
description: Connect a project to ProcessForge and a configured workplace layer.
required_capabilities:
- filesystem.write
- repository.scan
- validation
hooks:
  emit:
  - event: process.started
    required: true
  - event: stage.started
    required: true
  - event: stage.completed
    required: true
  - event: assignment.created
    required: true
  - event: artifact.created
    required: true
  - event: gate.failed
    required: true
  - event: search.index.maintenance.completed
    required: false
  - event: chat.message.recorded
    required: false
  subscriptions:
  - event: assignment.completed
    actions:
    - type: create_review_request
  - event: gate.failed
    actions:
    - type: block_stage
    - type: notify_orchestrator
  tracking:
    include:
    - process_id
    - process_version
    - stage_id
    - assignment_id
    - artifact_refs
    - actor
    - session_id
    - status
roles:
- id: orchestrator
  title: Orchestrator
  responsibility: Coordinates project init and proposal-first safety.
  kind: primary_agent
  responsibilities:
  - Coordinates project init and proposal-first safety.
- id: reviewer
  title: Reviewer
  responsibility: Reviews the proposal and observed project facts.
  kind: primary_agent
  responsibilities:
  - Reviews the proposal and observed project facts.
stages:
- id: intake
  title: Intake
  description: Capture project root, workplace manifest, and answers.
  required_inputs: []
  produced_artifacts:
  - project-init-answers
  required_role: orchestrator
  required_capabilities:
  - filesystem.read
  allowed_tools:
  - processforge-init
  entry_gates: []
  exit_gates:
  - inputs-provided
  goal: Capture project root, workplace manifest, and answers.
  actor: primary_agent
  gates:
  - inputs-provided
- id: workplace-resolution
  title: Workplace Resolution
  description: Read workplace manifest and registries.
  required_inputs:
  - project-init-answers
  produced_artifacts:
  - mcp-capability-report
  - toolchain-detection-report
  required_role: orchestrator
  required_capabilities:
  - filesystem.read
  allowed_tools:
  - processforge-init
  entry_gates:
  - inputs-provided
  exit_gates:
  - workplace-resolved
  goal: Read workplace manifest and registries.
  actor: primary_agent
  gates:
  - workplace-resolved
- id: repository-scan
  title: Repository Scan
  description: Scan only the supplied project root.
  required_inputs:
  - project-init-answers
  produced_artifacts:
  - repository-map
  required_role: orchestrator
  required_capabilities:
  - repository.scan
  allowed_tools:
  - processforge-init
  entry_gates:
  - inputs-provided
  exit_gates:
  - repository-mapped
  goal: Scan only the supplied project root.
  actor: primary_agent
  gates:
  - repository-mapped
- id: project-classification
  title: Project Classification
  description: Classify languages, platforms, frameworks, and project type.
  required_inputs:
  - repository-map
  produced_artifacts:
  - project-classification-report
  - project-profile
  required_role: orchestrator
  required_capabilities:
  - repository.scan
  allowed_tools:
  - processforge-init
  entry_gates:
  - repository-mapped
  exit_gates:
  - classification-recorded
  goal: Classify languages, platforms, frameworks, and project type.
  actor: primary_agent
  gates:
  - classification-recorded
- id: global-resource-matching
  title: Global Resource Matching
  description: Match detected project needs against workplace registries.
  required_inputs:
  - project-classification-report
  produced_artifacts:
  - global-resource-matching-report
  - template-matching-report
  required_role: orchestrator
  required_capabilities:
  - filesystem.read
  allowed_tools:
  - processforge-init
  entry_gates:
  - classification-recorded
  exit_gates:
  - resources-matched
  goal: Match detected project needs against workplace registries.
  actor: primary_agent
  gates:
  - resources-matched
- id: project-specificity-extraction
  title: Project Specificity Extraction
  description: Create observed project conventions and project package draft.
  required_inputs:
  - project-classification-report
  produced_artifacts:
  - project-conventions
  - project-package-draft
  required_role: orchestrator
  required_capabilities:
  - filesystem.write
  allowed_tools:
  - processforge-init
  entry_gates:
  - classification-recorded
  exit_gates:
  - project-specificity-recorded
  goal: Create observed project conventions and project package draft.
  actor: primary_agent
  gates:
  - project-specificity-recorded
- id: proposal
  title: Proposal
  description: Produce project init proposal before applying changes.
  required_inputs:
  - global-resource-matching-report
  - project-package-draft
  produced_artifacts:
  - project-init-proposal
  required_role: orchestrator
  required_capabilities:
  - reporting
  allowed_tools:
  - processforge-init
  entry_gates:
  - resources-matched
  exit_gates:
  - proposal-created
  goal: Produce project init proposal before applying changes.
  actor: primary_agent
  gates:
  - proposal-created
- id: review
  title: Review
  description: Review proposed project init changes.
  required_inputs:
  - project-init-proposal
  produced_artifacts:
  - project-init-review
  required_role: reviewer
  required_capabilities:
  - review
  allowed_tools: []
  entry_gates:
  - proposal-created
  exit_gates:
  - review-recorded
  goal: Review proposed project init changes.
  actor: primary_agent
  gates:
  - review-recorded
- id: apply
  title: Apply
  description: Write project files without unsafe overwrite.
  required_inputs:
  - project-init-review
  produced_artifacts:
  - project-files
  required_role: orchestrator
  required_capabilities:
  - filesystem.write
  allowed_tools:
  - processforge-init
  entry_gates:
  - review-recorded
  exit_gates:
  - project-files-written
  goal: Write project files without unsafe overwrite.
  actor: primary_agent
  gates:
  - project-files-written
- id: doctor
  title: Doctor
  description: Validate project init output.
  required_inputs:
  - project-files
  produced_artifacts:
  - project-doctor-report
  required_role: orchestrator
  required_capabilities:
  - validation
  allowed_tools:
  - processforge-doctor
  entry_gates:
  - project-files-written
  exit_gates:
  - doctor-complete
  goal: Validate project init output.
  actor: primary_agent
  gates:
  - doctor-complete
- id: search-index-maintenance
  title: Search Index Maintenance
  description: Run bounded local search index maintenance for the fresh project context snapshot.
  required_inputs:
  - project-files
  produced_artifacts:
  - search-index-maintenance-report
  required_role: orchestrator
  required_capabilities:
  - validation
  allowed_tools:
  - processforge-search-index
  entry_gates:
  - project-files-written
  exit_gates:
  - search-index-maintenance-recorded
  goal: Ensure project-scoped MCP/resource search is ready or report why the project context must be refreshed first.
  actor: primary_agent
  gates:
  - search-index-maintenance-recorded
