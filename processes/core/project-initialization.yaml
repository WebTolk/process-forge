gates:
- id: inputs-provided
  description: Project root and workplace manifest were provided.
  blocking: true
  type: checklist
  required: true
- id: workplace-resolved
  description: Workplace manifest was read or missing state was reported.
  blocking: true
  type: checklist
  required: true
- id: repository-mapped
  description: Repository map was produced from the supplied root only.
  blocking: true
  type: checklist
  required: true
- id: classification-recorded
  description: Detection evidence was recorded as observed.
  blocking: true
  type: checklist
  required: true
- id: resources-matched
  description: Global resources were matched or missing capabilities were reported.
  blocking: true
  type: checklist
  required: true
- id: project-specificity-recorded
  description: Project conventions and package draft were produced.
  blocking: true
  type: checklist
  required: true
- id: proposal-created
  description: Proposal-first output exists.
  blocking: true
  type: checklist
  required: true
- id: review-recorded
  description: Review or explicit approval exists.
  blocking: true
  type: checklist
  required: true
- id: project-files-written
  description: Files were written in apply mode.
  blocking: true
  type: checklist
  required: true
- id: doctor-complete
  description: Doctor result is recorded.
  blocking: true
  type: checklist
  required: true
- id: search-index-maintenance-recorded
  description: Local search index maintenance was run or explicitly skipped with a reason.
  blocking: false
  type: checklist
  required: false
required_packages:
- process-forge-core
required_templates:
- process-forge.yaml
- process-forge.local.yaml
- project-agents-template
allowed_tools:
- processforge-init
- processforge-doctor
- processforge-search-index
forbidden_actions:
- scan_outside_project_root
- overwrite_brownfield_files_without_force
- write_absolute_paths_to_public_manifest
evolve:
  enabled: true
  mode: optional
  timing: end_of_run
  default_scope: project
  candidate_targets:
  - knowledge_package
  - template_package
  - process_definition
  - delivery_profile
  - project_rule
  - workplace_rule
  - platform_contract
  extraction_hints:
  - Split candidates when an observation contains project-specific and platform-general parts.
  - Default to the narrowest safe scope and require evidence before parent-platform promotion.
  - reusable rule
  - missing knowledge
  - template improvement
  - regression check
  - process improvement
  candidate_targeting:
    default_scope: project
    require_applicability: true
    require_target: true
    default_to_narrowest_scope: true
  required_outputs:
  - evolution-report
  privacy:
    default_sensitivity: internal
    export_requires_sanitization: true
    allow_private_paths: false
  apply_policy:
    auto_apply_global: false
    create_candidates_only: true

evolution_policy:
  active_run_upgrade:
    default: manual_only
  protected_artifacts:
  - project-init-proposal
  - project-init-review
  safe_changes:
  - add_optional_report
  blocked_changes:
  - remove_public_private_separation
  requires_approval:
  - change_overwrite_policy
catalog:
  classification: PUBLIC_STABLE
  public_surface: true
  strict_contract: true
public_surface: true
execution_mode: single_agent
coordination_requirements:
  mode: simple_allowed
  director_inbox:
    required: false
    optional: false
  error_workflow:
    mode: none
  simple_mode_behavior: disable_director_features
error_handling:
  enabled: false
  mode: none
  fallback_if_no_director: needs_operator
responsibility_boundaries:
  operator:
  - Provides the objective, constraints, approvals, and final acceptance.
  primary_agent:
  - Executes the process stages, writes required artifacts, and runs gates.
  director:
  - Coordinates handoffs and leases only when the effective project mode requires Director.
  inspector:
  - Verifies runtime state, CLI gates, and worker proof artifacts when applicable.
  worker:
  - Works only from an assigned capsule and writes declared outputs.
  cli_tools:
  - Run deterministic ProcessForge checks and write machine-readable results.
subagent_policy:
  allowed: false
  require_reports: false
  allowed_roles: []
process_transitions: []
stage_completion:
  handoff_note_required: true
run_completion:
  summary_required: true
  handoff_artifact_required: true
process_pack:
  package: process-forge-core
  example_required: true
agent_prompt:
  required: true
