  required: true
  path_hint: .pf/artifacts/project-classification-report.md
- id: repository-map
  title: Repository Map
  owner_role: orchestrator
  template: repository-map-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/repository-map.md
- id: project-conventions
