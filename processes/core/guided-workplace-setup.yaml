schema_version: 1
id: guided-workplace-setup
name: Guided Workplace Setup
version: 1.0.0
status: active
description: Agent-guided dialogue for preparing a ProcessForge workplace, reviewing a proposal, applying workplace files,
  and producing project-onboarding next steps.
coordination_requirements:
  mode: organized_optional
  director_inbox:
    required: false
    optional: true
  error_workflow:
    mode: needs_operator
  simple_mode_behavior: optional
error_handling:
  enabled: true
  mode: needs_operator
  fallback_if_no_director: needs_operator
required_capabilities:
- process_coordination
- repository_read
- reporting
hooks:
  emit:
  - event: workplace.setup.started
    required: true
  - event: workplace.device_discovery.completed
    required: false
  - event: workplace.setup.reviewed
    required: true
  - event: workplace.setup.applied
    required: true
  - event: workplace.doctor.passed
    required: true
  tracking:
    include:
    - session_id
    - workplace_root
    - artifact_refs
    - status
roles:
- id: setup-agent
  title: Setup Agent
  responsibility: Guides the operator through setup blocks and updates answers after each block.
  kind: primary_agent
  responsibilities:
  - Guides the operator through setup blocks and updates answers after each block.
- id: operator
  title: Operator
  responsibility: Confirms machine-local paths, agent environments, privacy policy, resources, and first project intent.
  kind: human
  responsibilities:
  - Confirms machine-local paths, agent environments, privacy policy, resources, and first project intent.
- id: reviewer
  title: Reviewer
  responsibility: Reviews proposal and apply report before the workplace is used for project onboarding.
  kind: primary_agent
  responsibilities:
  - Reviews proposal and apply report before the workplace is used for project onboarding.
stages:
- id: intake
  title: Start setup session
  description: Create setup session artifacts and seed answers.
  required_inputs: []
  produced_artifacts:
  - answers
  required_role: setup-agent
  required_capabilities:
  - process_coordination
  allowed_tools:
  - processforge-cli
  entry_gates: []
  exit_gates:
  - answers-created
  goal: Create setup session artifacts and seed answers.
  actor: primary_agent
  gates:
  - answers-created
- id: dialogue
  title: Guided dialogue
  description: Ask block-scoped questions, optionally include read-only device discovery when the operator asks for it, and
    update answers YAML after each block.
  required_inputs:
  - answers
  produced_artifacts:
  - answers
  - device-discovery-report
  - resource-candidates
  - proposal
  required_role: setup-agent
  required_capabilities:
  - reporting
  allowed_tools:
  - processforge-cli
  entry_gates:
  - answers-created
  exit_gates:
  - proposal-created-before-apply
  goal: Ask block-scoped questions, optionally include read-only device discovery when the operator asks for it, and update
    answers YAML after each block.
  actor: primary_agent
  discovery_policy:
    default: ask_operator
    read_only: true
    fallback_scope:
    - global AGENTS.md
    - configured skills root
    - configured docs root
    - configured platforms root
    - configured toolchains root
  gates:
  - proposal-created-before-apply
- id: review
  title: Review setup proposal
  description: Check privacy, resource, and platform-neutrality policy before apply.
  required_inputs:
  - proposal
  produced_artifacts:
  - review
  required_role: reviewer
  required_capabilities:
  - artifact_review
  allowed_tools:
  - processforge-cli
  entry_gates:
  - proposal-created-before-apply
  exit_gates:
  - proposal-reviewed
  goal: Check privacy, resource, and platform-neutrality policy before apply.
  actor: primary_agent
  gates:
  - proposal-reviewed
- id: apply
  title: Apply workplace setup
  description: Delegate to workplace-init internals, run doctor-workplace, and write agent instruction snippets.
  required_inputs:
  - answers
  - proposal
  - review
  produced_artifacts:
  - apply-report
  - agent-instructions
  - next-steps
  required_role: setup-agent
  required_capabilities:
  - process_coordination
  allowed_tools:
  - processforge-cli
  entry_gates:
  - proposal-reviewed
  exit_gates:
  - doctor-workplace-passed
  goal: Delegate to workplace-init internals, run doctor-workplace, and write agent instruction snippets.
  actor: primary_agent
  gates:
  - doctor-workplace-passed
artifact_definitions:
- id: answers
  title: Guided Workplace Answers
  owner_role: setup-agent
  template: guided-workplace-setup.answers
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/answers.md
- id: device-discovery-report
  title: Device Discovery Report
  owner_role: setup-agent
  template: artifact-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: false
  path_hint: .pf/artifacts/device-discovery-report.md
- id: resource-candidates
  title: Resource Candidates
  owner_role: setup-agent
  template: artifact-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: yaml
  required: false
  path_hint: .pf/artifacts/resource-candidates.yaml
- id: proposal
  title: Guided Workplace Proposal
  owner_role: setup-agent
  template: guided-workplace-setup.proposal
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/proposal.md
- id: review
  title: Guided Workplace Review
  owner_role: reviewer
  template: review-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/review.md
- id: apply-report
  title: Guided Workplace Apply Report
  owner_role: setup-agent
  template: validation-report-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/apply-report.md
- id: agent-instructions
  title: Agent Instruction Snippet
  owner_role: setup-agent
  template: global-agents-processforge-section
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/agent-instructions.md
- id: next-steps
  title: Project Onboarding Next Steps
  owner_role: setup-agent
  template: handoff-template
  lifecycle:
  - draft
  - ready_for_review
  - approved
  type: markdown
  required: true
  path_hint: .pf/artifacts/next-steps.md
gates:
- id: answers-created
  description: Session answers YAML exists.
  blocking: true
  type: checklist
  required: true
- id: proposal-created-before-apply
  description: Proposal YAML and Markdown exist before apply.
  blocking: true
  type: checklist
  required: true
- id: proposal-reviewed
  description: Review artifact exists and records remaining conditions.
  blocking: true
  type: checklist
  required: true
- id: doctor-workplace-passed
  description: doctor-workplace runs after apply.
  blocking: true
  type: checklist
  required: true
required_packages:
- process-forge-core
required_templates:
- guided-workplace-setup.answers
- guided-workplace-setup.proposal
allowed_tools:
- processforge-cli
- validator
forbidden_actions:
- create_terminal_only_wizard
- store_secret_values
- write_private_paths_to_public_manifests
- add_platform_specific_core_support_pack
- create_background_daemon
- run_destructive_device_discovery
metadata:
  setup_modes:
    guided:
      device_discovery: optional_operator_choice
evolve:
  enabled: true
  mode: optional
  timing: end_of_run
  default_scope: project
  candidate_targets:
  - knowledge_package
  - template_package
  - process_definition
  - delivery_profile
  - project_rule
  - workplace_rule
  - platform_contract
  extraction_hints:
  - Split candidates when an observation contains project-specific and platform-general parts.
  - Default to the narrowest safe scope and require evidence before parent-platform promotion.
  - reusable rule
  - missing knowledge
  - template improvement
  - regression check
  - process improvement
  candidate_targeting:
    default_scope: project
    require_applicability: true
    require_target: true
    default_to_narrowest_scope: true
  required_outputs:
  - evolution-report
  privacy:
    default_sensitivity: internal
    export_requires_sanitization: true
    allow_private_paths: false
  apply_policy:
    auto_apply_global: false
    create_candidates_only: true

evolution_policy:
  active_run_upgrade:
    default: manual_only
  protected_artifacts:
  - proposal
  - apply-report
  safe_changes:
  - add_optional_question_block
  - add_optional_registry_section
  blocked_changes:
  - require_network_for_smoke
  - require_daemon_for_setup
catalog:
  classification: PUBLIC_STABLE
  public_surface: true
  strict_contract: true
public_surface: true
execution_mode: single_agent
responsibility_boundaries:
  operator:
  - Provides the objective, constraints, approvals, and final acceptance.
  primary_agent:
  - Executes the process stages, writes required artifacts, and runs gates.
  director:
  - Coordinates handoffs and leases only when the effective project mode requires Director.
  inspector:
  - Verifies runtime state, CLI gates, and worker proof artifacts when applicable.
  worker:
  - Works only from an assigned capsule and writes declared outputs.
  cli_tools:
  - Run deterministic ProcessForge checks and write machine-readable results.
subagent_policy:
  allowed: false
  require_reports: false
  allowed_roles: []
process_transitions: []
stage_completion:
  handoff_note_required: true
run_completion:
  summary_required: true
  handoff_artifact_required: true
process_pack:
  package: process-forge-core
  example_required: true
agent_prompt:
  required: true
