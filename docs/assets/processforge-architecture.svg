<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" role="img" aria-labelledby="title desc">
  <title id="title">ProcessForge workplace layout</title>
  <desc id="desc">A workstation contains a global agent area with ProcessForge and workplace resources, plus multiple projects that each have a project-local .pf flow layer.</desc>
  <style>
    .bg { fill: #f7f8f4; }
    .device { fill: #ffffff; stroke: #56635a; stroke-width: 2.5; rx: 18; }
    .global { fill: #edf7ef; stroke: #6c9a73; stroke-width: 2; rx: 12; }
    .forge { fill: #fff4df; stroke: #af8b42; stroke-width: 2; rx: 10; }
    .project { fill: #edf4fb; stroke: #6f8fad; stroke-width: 2; rx: 10; }
    .flow { fill: #f4eef9; stroke: #8c70a8; stroke-width: 1.8; rx: 8; }
    .title { font: 700 28px Arial, sans-serif; fill: #202923; }
    .label { font: 700 18px Arial, sans-serif; fill: #202923; }
    .text { font: 14px Arial, sans-serif; fill: #334139; }
    .small { font: 12px Arial, sans-serif; fill: #59655d; }
    .line { stroke: #c6cec7; stroke-width: 1.5; }
    .arrow { fill: none; stroke: #59655d; stroke-width: 2.2; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#59655d"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1040" height="640"/>
  <rect class="device" x="36" y="36" width="968" height="568" rx="18"/>
  <text class="title" x="70" y="82">Workplace: one computer, laptop, server, or runner host</text>
  <text class="small" x="70" y="108">Humans and AI agents work here. ProcessForge is installed once; each project keeps only its local flow layer.</text>

  <rect class="global" x="70" y="142" width="410" height="410" rx="12"/>
  <text class="label" x="96" y="178">Global .agents area</text>
  <line class="line" x1="96" y1="194" x2="454" y2="194"/>

  <rect class="forge" x="96" y="220" width="358" height="118" rx="10"/>
  <text class="label" x="122" y="254">ProcessForge tool root</text>
  <text class="text" x="122" y="284">bin/pf.py, docs, schemas</text>
  <text class="text" x="122" y="310">processes, templates, validation tools</text>

  <rect class="flow" x="96" y="366" width="358" height="146" rx="8"/>
  <text class="label" x="122" y="400">Global machine content</text>
  <text class="text" x="122" y="430">knowledge packages, local docs roots</text>
  <text class="text" x="122" y="456">tools, MCP servers, templates</text>
  <text class="text" x="122" y="482">platform contracts and registries</text>

  <rect class="project" x="560" y="142" width="380" height="160" rx="10"/>
  <text class="label" x="586" y="178">Project 1 repository</text>
  <line class="line" x1="586" y1="194" x2="914" y2="194"/>
  <rect class="flow" x="586" y="216" width="328" height="62" rx="8"/>
  <text class="label" x="606" y="244">.pf</text>
  <text class="text" x="656" y="244">context, selected resources, runs, tasks</text>
  <text class="small" x="606" y="266">artifacts, reviews, handoffs, private runtime files</text>

  <rect class="project" x="560" y="342" width="380" height="160" rx="10"/>
  <text class="label" x="586" y="378">Project 2 repository</text>
  <line class="line" x1="586" y1="394" x2="914" y2="394"/>
  <rect class="flow" x="586" y="416" width="328" height="62" rx="8"/>
  <text class="label" x="606" y="444">.pf</text>
  <text class="text" x="656" y="444">project-local flow state and evidence</text>
  <text class="small" x="606" y="466">no copied ProcessForge core or heavy global docs</text>

  <path class="arrow" d="M454 426 C510 426, 510 250, 586 250"/>
  <text class="small" x="494" y="323">project-onboard selects resources</text>
  <path class="arrow" d="M454 280 C510 280, 508 224, 560 224"/>
  <text class="small" x="492" y="220">runtime launcher calls tool root</text>
  <path class="arrow" d="M454 464 C516 464, 510 448, 586 448"/>
  <text class="small" x="494" y="486">each project has its own .pf</text>
</svg>
