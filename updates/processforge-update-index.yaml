schema_version: 1

product:
  id: processforge
  current_version: "1.1.0"

update_sites:
  - id: processforge-official
    enabled: true
    manifest_url: "https://raw.githubusercontent.com/WebTolk/process-forge/dev/release/updates/processforge-stable.json"
    changelog_url: "https://github.com/WebTolk/process-forge/releases/tag/v1.1.0"
    channel: stable
    priority: 10
    trust:
      require_https: true
      require_sha256: true
      allow_unsigned: true
      signature_required: false
    policy:
      check_interval_hours: 24
      auto_check: true
      auto_stage: false
      auto_apply: false
      notify_operator: true
      notify_director_inbox: true

channels:
  stable:
    latest: "1.1.0"

versions:
  - version: "0.1.0"
    channel: stable
    released_at: "2026-07-15"
    compatibility:
      min_project_schema: 1
      max_project_schema: 1
    migration:
      required: false
      guide: updates/migrations/0.1.0-linked-workplace.md
    changes:
      - type: architecture
        summary: "Linked workplace model, resource references, hooks validation, and update assessment contracts."
        breaking: false
    affected_files:
      - .pf/process-forge.yaml
      - .pf/hooks.yaml
      - .pf/contexts/project-context.snapshot.yaml

  - version: "1.0.0"
    channel: stable
    released_at: "2026-07-20"
    compatibility:
      min_project_schema: 1
      max_project_schema: 1
    migration:
      required: false
      guide: updates/migrations/1.0.0-stable-release.md
    changes:
      - type: release
        summary: "Stable ProcessForge 1.0.0 distribution with platform-agnostic core docs, resource authoring, update checks, release packaging, and project onboarding validation."
        breaking: false
      - type: documentation
        summary: "Human docs now start from workplace/device abstractions; agent docs reflect implemented CLI commands."
        breaking: false
    affected_files:
      - .pf/process-forge.yaml
      - .pf/hooks.yaml
      - .pf/contexts/project-context.snapshot.yaml
      - .pf/runtime/bin/pf.py

  - version: "1.0.1"
    channel: stable
    released_at: "2026-08-04"
    compatibility:
      min_project_schema: 1
      max_project_schema: 1
    migration:
      required: false
      guide: updates/migrations/1.0.1-worker-workspace-access.md
    changes:
      - type: runtime
        summary: "Shell and subagents can consume workplace knowledge, templates, tools, and MCP refs through private workspace access maps."
        breaking: false
      - type: runtime
        summary: "Added the built-in codex-exec runtime driver and portable Codex CLI worker wrapper."
        breaking: false
      - type: validation
        summary: "Added smokes for workspace access path hygiene and codex-exec launch propagation."
        breaking: false
    affected_files:
      - tools/processforge.py
      - tools/codex_exec_worker.py
      - templates/runtime-drivers/codex-exec.yaml
      - templates/registries/runtime-drivers.yaml
      - schemas/runtime-driver.schema.json

  - version: "1.0.2"
    channel: stable
    released_at: "2026-08-05"
    compatibility:
      min_project_schema: 1
      max_project_schema: 1
    migration:
      required: false
      guide: updates/migrations/1.0.2-update-server-contract.md
    changes:
      - type: updates
        summary: "Update servers now use a simple manifest and changelog URL contract, including local file manifests for offline or staged installations."
        breaking: false
      - type: documentation
        summary: "Documentation now reflects the current runtime driver launch flow and the simplified update model."
        breaking: false
      - type: validation
        summary: "Schemas and smokes now validate providerless update sites and reject the unsupported legacy url field."
        breaking: false
    affected_files:
      - tools/processforge.py
      - schemas/update-site.schema.json
      - schemas/entity-update-sites.schema.json
      - schemas/update-source-registry.schema.json
      - docs/concepts/update-sites.md
      - docs/ru/concepts/update-sites.md

  - version: "1.1.0"
    channel: stable
    released_at: "2026-08-31"
    compatibility:
      min_project_schema: 1
      max_project_schema: 1
    migration:
      required: false
      guide: updates/migrations/1.1.0-stable-release.md
    changes:
      - type: runtime
        summary: "Runtime, MCP session reads, Codex event capture, local resource search, and project initialization were hardened for the 1.1.0 release line."
        breaking: false
      - type: search
        summary: "Snapshot-authorized local search now maintains explicit fulltext, metadata, and none indexing policies with maintenance-owned refresh semantics."
        breaking: false
      - type: updates
        summary: "Manifest-based core update planning, apply, incomplete-update detection, and repair reporting were strengthened."
        breaking: false
      - type: validation
        summary: "Release, checksum, archive provenance, public-cleanliness, and extracted-archive validation gates were expanded."
        breaking: false
      - type: garage
        summary: "PF-first Garage context, governed work bootstrap, authorized search, and resource resolution are available without a pre-existing Ledger session."
        breaking: false
      - type: integration
        summary: "Codex hook telemetry, PF-managed worker governance, Windows Runtime autostart, and host-owned MCP registration were added."
        breaking: false
      - type: security
        summary: "Worker environment persistence, MCP mutation boundaries, session authorization, and public release cleanliness were hardened."
        breaking: false
    affected_files:
      - tools/processforge.py
      - tools/pf_runtime/session_read.py
      - tools/pf_runtime/mcp_server.py
      - src/processforge_core/core_update.py
      - src/processforge_core/local_resource_search.py
      - src/processforge_core/project_initialization.py
      - src/processforge_core/garage.py
      - tools/pf_runtime/codex_mcp.py
      - tools/pf_runtime/windows_autostart.py
      - docs/concepts/context-freshness.md
      - docs/concepts/resource-search-index.md
      - docs/concepts/garage-core.md
      - docs/getting-started/runtime-autostart.md
      - CHANGELOG.md
