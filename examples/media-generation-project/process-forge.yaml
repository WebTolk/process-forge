schema_version: 1
process_forge:
  version: 0.1.0
  mode: file_only
  runner_required: false
  backend_required: false
project:
  id: example-media-generation-project
  name: Example Media Generation Project
paths:
  assignments: assignments
  artifacts: artifacts
  logs: logs
processes:
  - id: content-production
    path: processes/content-production.yaml
packages:
  - id: process-forge-core
    path: packages/process-forge-core.yaml
  - id: process-forge-content
    path: packages/process-forge-content.yaml
policies:
  one_writer_per_file_scope: true
  approved_artifacts_are_protected: true
  execution_context_is_immutable: true
