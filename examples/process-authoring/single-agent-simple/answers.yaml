schema_version: 1
process:
  id: single-agent-simple
  name: Single Agent Simple
  version: 1.0.0
  status: draft
  description: Example Single Agent Simple process.
execution_mode: single_agent
coordination_requirements:
  mode: simple_allowed
  director_inbox:
    required: false
    optional: false
  error_workflow:
    mode: none
  simple_mode_behavior: disable_director_features
error_handling:
  enabled: false
  mode: none
  fallback_if_no_director: needs_operator
responsibility_boundaries:
  operator:
  - Approves scope.
  primary_agent:
  - Writes artifacts.
  director:
  - Coordinates when organized.
  inspector:
  - Checks runtime proof.
  worker:
  - Writes assigned outputs.
  cli_tools:
  - Run checks.
process_transitions: []
agent_requirements:
  required_role: primary-agent
  required_capabilities:
  - process_authoring
subagent_policy:
  allowed: false
  require_reports: false
  allowed_roles: []
evolve:
  enabled: true
  decision:
    value: enabled
    reason: This process may produce reusable knowledge.
  mode: optional
  timing: end_of_run
  default_scope: project
  candidate_targets:
  - knowledge_package
  - template_package
  - process_definition
  extraction_hints:
  - reusable rule
  - missing knowledge
  - template improvement
  - regression check
  - process improvement
  prompts:
  - What reusable knowledge may appear during this process?
  - Which outputs are candidates for shared packages?
  - What must remain project-private?
  required_outputs:
  - evolution-report
  privacy:
    default_sensitivity: internal
    export_requires_sanitization: true
    allow_private_paths: false
  apply_policy:
    auto_apply_global: false
    create_candidates_only: true

roles:
- id: primary-agent
  title: Primary Agent
  kind: primary_agent
  responsibility: Owns the example flow.
  responsibilities:
  - Owns the example flow.
stages:
- id: work
  title: Work
  goal: Produce the example artifact.
  description: Produce the example artifact.
  required_role: primary-agent
  actor: primary_agent
  produced_artifacts:
  - example-report
  exit_gates:
  - example-report-ready
  gates:
  - example-report-ready
artifacts:
- id: example-report
  title: Example Report
  owner_role: primary-agent
  type: markdown
  required: true
  template: artifact-template
  path_hint: .pf/artifacts/example-report.md
  lifecycle:
  - draft
  - ready_for_review
  - approved
gates:
- id: example-report-ready
  description: Example report exists.
  type: artifact_exists
  blocking: true
  required: true
  required_artifact: example-report
required_packages:
- process-forge-core
required_templates:
- artifact-template
allowed_tools:
- processforge-cli
forbidden_actions:
- write_private_absolute_paths_to_public_files
