schema_version: 1
id: organized-required-director
name: Organized Required Director
version: 1.0.0
status: draft
description: Example Organized Required Director process.
execution_mode: process_factory
coordination_requirements:
  mode: organized_required
  director_inbox:
    required: true
    optional: true
  error_workflow:
    mode: director_inbox
  simple_mode_behavior: fail_validation
error_handling:
  enabled: true
  mode: director_inbox
  fallback_if_no_director: fail_validation
responsibility_boundaries:
  operator:
  - Approves scope.
  primary_agent:
  - Writes artifacts.
  director:
  - Coordinates when organized.
  inspector:
  - Checks runtime proof.
  worker:
  - Writes assigned outputs.
  cli_tools:
  - Run checks.
process_transitions: []
agent_requirements:
  required_role: primary-agent
  required_capabilities:
  - process_authoring
subagent_policy:
  allowed: false
  require_reports: false
  allowed_roles:
  - worker_agent
roles:
- id: primary-agent
  title: Primary Agent
  kind: primary_agent
  responsibility: Owns the example flow.
  responsibilities:
  - Owns the example flow.
stages:
- id: work
  title: Work
  goal: Produce the example artifact.
  description: Produce the example artifact.
  required_role: primary-agent
  actor: primary_agent
  produced_artifacts:
  - example-report
  exit_gates:
  - example-report-ready
  gates:
  - example-report-ready
gates:
- id: example-report-ready
  description: Example report exists.
  type: artifact_exists
  blocking: true
  required: true
  required_artifact: example-report
required_packages:
- process-forge-core
required_templates:
- artifact-template
allowed_tools:
- processforge-cli
forbidden_actions:
- write_private_absolute_paths_to_public_files
artifact_definitions:
- id: example-report
  title: Example Report
  owner_role: primary-agent
  type: markdown
  required: true
  template: artifact-template
  path_hint: .pf/artifacts/example-report.md
  lifecycle:
  - draft
  - ready_for_review
  - approved
evolve:
  enabled: true
  mode: optional
  timing: end_of_run
  default_scope: project
  candidate_targets:
  - knowledge_package
  - template_package
  - process_definition
  extraction_hints:
  - reusable rule
  - missing knowledge
  - template improvement
  - regression check
  - process improvement
  required_outputs:
  - evolution-report
  privacy:
    default_sensitivity: internal
    export_requires_sanitization: true
    allow_private_paths: false
  apply_policy:
    auto_apply_global: false
    create_candidates_only: true

evolution_policy:
  active_run_upgrade:
    default: manual_only
