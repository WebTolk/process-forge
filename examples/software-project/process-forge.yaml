schema_version: 1
process_forge:
  version: 1.0.0
  mode: file_only
  runner_required: false
  backend_required: false
project:
  id: example-software-project
  name: Example Software Project
paths:
  assignments: assignments
  artifacts: artifacts
  logs: logs
processes:
  - id: software-feature-development
    path: processes/core/software-feature-development.yaml
execution_profiles:
  delivery_profiles:
    project.default_delivery:
      type: delivery_profile
      steps:
        - package
        - smoke
      commands:
        package: "<project-local package command>"
        smoke: "<project-local smoke command>"
packages:
  - id: process-forge-core
    path: packages/process-forge-core.yaml
policies:
  one_writer_per_file_scope: true
  approved_artifacts_are_protected: true
  execution_context_is_immutable: true
